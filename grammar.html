<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>수능 어법 변별 특강</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F1EEE5;
  --surface:#FBF9F2;
  --surface-2:#E9E4D6;
  --ink:#221F1A;
  --ink-soft:#5B5748;
  --muted:#8A8574;
  --line:#D9D3C1;
  --accent:#20395C;
  --accent-2:#3C5A82;
  --accent-soft:#DCE4DE;
  --correct:#2E7D5B;
  --correct-soft:#DCEFE3;
  --incorrect:#B7383A;
  --incorrect-soft:#F5DFDD;
  --shadow: 0 1px 2px rgba(34,31,26,.06), 0 6px 20px -8px rgba(34,31,26,.18);
  --serif-kr:"Gowun Batang", "Noto Serif KR", serif;
  --serif-en:"Source Serif 4", Georgia, serif;
  --sans-kr:"Noto Sans KR", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15181A;
    --surface:#1C2023;
    --surface-2:#242A2D;
    --ink:#EDEAE1;
    --ink-soft:#B7B2A4;
    --muted:#7D8480;
    --line:#33393C;
    --accent:#89AEDD;
    --accent-2:#6E93C4;
    --accent-soft:#22322B;
    --correct:#63C293;
    --correct-soft:#1B2E24;
    --incorrect:#E48481;
    --incorrect-soft:#332022;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --paper:#15181A;
  --surface:#1C2023;
  --surface-2:#242A2D;
  --ink:#EDEAE1;
  --ink-soft:#B7B2A4;
  --muted:#7D8480;
  --line:#33393C;
  --accent:#89AEDD;
  --accent-2:#6E93C4;
  --accent-soft:#22322B;
  --correct:#63C293;
  --correct-soft:#1B2E24;
  --incorrect:#E48481;
  --incorrect-soft:#332022;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans-kr);
  line-height:1.6;
}
::selection{ background:var(--accent-soft); }
a{color:var(--accent-2);}
button{font-family:inherit;}

.app{
  display:grid;
  grid-template-columns: 272px 1fr;
  min-height:100vh;
}
.sidebar{
  border-right:1px solid var(--line);
  background:var(--surface);
  padding:22px 16px 28px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.brand{
  padding:2px 6px 18px;
  border-bottom:1px solid var(--line);
  margin-bottom:14px;
}
.brand .kicker{
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
}
.brand h1{
  font-family:var(--serif-kr);
  font-size:21px;
  margin:6px 0 4px;
  text-wrap:balance;
  line-height:1.3;
}
.brand p{
  margin:0;
  font-size:12.5px;
  color:var(--ink-soft);
}
nav.topics{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.topic-btn{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background:transparent;
  border:1px solid transparent;
  border-radius:10px;
  padding:9px 10px;
  cursor:pointer;
  color:var(--ink);
}
.topic-btn:hover{ background:var(--surface-2); }
.topic-btn[aria-current="true"]{
  background:var(--accent);
  color:#F4F1E8;
  border-color:var(--accent);
}
.topic-btn .rank{
  flex:0 0 auto;
  min-width:26px;height:26px;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif-en);
  font-weight:600;
  font-size:11px;
  padding:0 3px;
  background:var(--accent-soft);
  color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.topic-btn[aria-current="true"] .rank{
  background:rgba(255,255,255,.18);
  color:#fff;
}
.topic-btn .meta{ min-width:0; flex:1 1 auto; }
.topic-btn .meta .t{
  font-size:13.5px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.topic-btn .meta .r{
  font-size:11px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.topic-btn[aria-current="true"] .meta .r{ color:#D9E2EE; }
.topic-btn .prog{
  flex:0 0 auto;
  font-size:10.5px;
  font-variant-numeric:tabular-nums;
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:999px;
  padding:2px 7px;
}
.topic-btn[aria-current="true"] .prog{ border-color:rgba(255,255,255,.35); color:#EDF1F7; }

.sidebar-foot{
  margin-top:18px;
  padding-top:14px;
  border-top:1px solid var(--line);
  font-size:11.5px;
  color:var(--muted);
}
.sidebar-foot button{
  margin-top:8px;
  background:none;
  border:1px solid var(--line);
  color:var(--ink-soft);
  border-radius:8px;
  padding:5px 9px;
  font-size:11px;
  cursor:pointer;
}
.sidebar-foot button:hover{ background:var(--surface-2); }

main{
  padding:34px clamp(18px,4vw,56px) 80px;
  max-width:920px;
}

.topic-head{
  display:flex;
  align-items:flex-start;
  gap:16px;
  margin-bottom:22px;
}
.topic-head .badge{
  flex:0 0 auto;
  width:52px;height:52px;border-radius:14px;
  background:var(--accent);
  color:#F4F1E8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--serif-en);
  padding:0 4px;
}
.topic-head .badge .num{ font-size:16px; font-weight:600; line-height:1.15; text-align:center; }
.topic-head .badge .lbl{ font-size:8px; letter-spacing:.08em; opacity:.8; }
.topic-head h2{
  font-family:var(--serif-kr);
  font-size:clamp(22px,3vw,28px);
  margin:0 0 4px;
  text-wrap:balance;
}
.topic-head .rate{
  display:inline-block;
  font-size:12.5px;
  color:var(--incorrect);
  background:var(--incorrect-soft);
  border-radius:999px;
  padding:2px 10px;
  font-variant-numeric:tabular-nums;
  font-weight:600;
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
}

.formula{
  padding:18px 20px;
  margin-bottom:26px;
}
.formula .lbl{
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--accent-2);
  font-weight:700;
  margin-bottom:6px;
}
.formula p{
  margin:0;
  font-size:14.5px;
  color:var(--ink-soft);
}

.section-lbl{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin:34px 0 6px;
}
.section-lbl h3{
  font-family:var(--serif-kr);
  font-size:17.5px;
  margin:0;
}
.section-lbl .n{
  font-size:11.5px;
  color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.section-note{
  font-size:12.5px;
  color:var(--muted);
  margin:0 0 16px;
  max-width:62ch;
}

.q-grid{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.q-card{
  padding:16px 18px 17px;
}
.q-card .q-top{
  display:flex;
  gap:10px;
  align-items:baseline;
  margin-bottom:9px;
}
.q-card .q-idx{
  font-family:var(--serif-en);
  font-weight:600;
  color:var(--accent-2);
  font-size:13px;
  flex:0 0 auto;
}
.q-card .q-stem{
  font-family:var(--serif-en);
  font-size:15.5px;
  line-height:1.55;
}
.q-card .q-stem em{ font-style:normal; border-bottom:2px dotted var(--muted); }

.choices{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:7px;
  margin-top:4px;
}
.choice{
  display:flex;
  align-items:center;
  gap:8px;
  text-align:left;
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--surface);
  cursor:pointer;
  font-size:13.5px;
  color:var(--ink);
}
.choice:hover{ border-color:var(--accent-2); }
.choice .k{
  flex:0 0 auto;
  width:20px;height:20px;border-radius:50%;
  border:1px solid var(--muted);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;
  font-family:var(--serif-en);
}
.choice .v{ font-family:var(--serif-en); }
.choice[disabled]{ cursor:default; }
.choice.is-correct{ border-color:var(--correct); background:var(--correct-soft); }
.choice.is-correct .k{ border-color:var(--correct); background:var(--correct); color:#fff; }
.choice.is-wrong{ border-color:var(--incorrect); background:var(--incorrect-soft); }
.choice.is-wrong .k{ border-color:var(--incorrect); background:var(--incorrect); color:#fff; }

.explain{
  margin-top:11px;
  padding-top:11px;
  border-top:1px dashed var(--line);
  font-size:13px;
  color:var(--ink-soft);
  display:none;
}
.explain.show{ display:block; }
.explain .tag{
  display:inline-block;
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.05em;
  border-radius:5px;
  padding:1px 6px;
  margin-right:6px;
}
.explain .tag.ok{ background:var(--correct-soft); color:var(--correct); }
.explain .tag.no{ background:var(--incorrect-soft); color:var(--incorrect); }

.passage-card{ padding:18px 20px 16px; }
.passage-card .p-head{
  display:flex; justify-content:space-between; align-items:baseline;
  margin-bottom:9px;
}
.passage-card .p-idx{
  font-family:var(--serif-en); font-weight:600; color:var(--accent-2); font-size:13px;
}
.passage-card .p-hint{ font-size:11.5px; color:var(--muted); }
.passage{
  font-family:var(--serif-en);
  font-size:15px;
  line-height:1.85;
}
.blank{
  cursor:pointer;
  border-bottom:2px solid var(--muted);
  padding:0 1px;
}
.blank .circ{
  font-size:12px;
  vertical-align:middle;
  margin-right:1px;
}
.blank:hover{ background:var(--accent-soft); }
.passage.answered .blank{ cursor:default; }
.passage.answered .blank:hover{ background:transparent; }
.blank.pick-correct{ background:var(--correct-soft); border-color:var(--correct); border-radius:3px; }
.blank.pick-wrong{ background:var(--incorrect-soft); border-color:var(--incorrect); border-radius:3px; text-decoration:line-through; text-decoration-color:var(--incorrect); }

footer.page{
  margin-top:46px;
  padding-top:16px;
  border-top:1px solid var(--line);
  font-size:11.5px;
  color:var(--muted);
}

.mobile-tabs{ display:none; }

@media (max-width: 860px){
  .app{ grid-template-columns:1fr; }
  .sidebar{ display:none; }
  .mobile-tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:12px 14px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
  }
  .mobile-tabs button{
    flex:0 0 auto;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    border-radius:999px;
    padding:7px 13px;
    font-size:12.5px;
    white-space:nowrap;
  }
  .mobile-tabs button[aria-current="true"]{
    background:var(--accent); color:#fff; border-color:var(--accent);
  }
  main{ padding:22px 16px 60px; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="kicker">최근 10개년 수능 · 어법</div>
      <h1>수능 어법 변별 특강</h1>
      <p>1위&ndash;10위 함정 패턴 + 최상위권 변별 문항</p>

    <div class="sidebar-foot">

      <button id="resetBtn" type="button">진행 기록 초기화</button>
    </div>
  </aside>

  <div>
    <div class="mobile-tabs" id="mobileTabs"></div>
    <main id="main"></main>
  </div>
</div>

    {text:"[2023년 3월 학평 29번 · 정답률 44%]  From the 8th to the 12th century CE, while Europe suffered the perhaps overdramatically named Dark Ages, science on planet Earth could be found almost §1{exclusively}§ in the Islamic world. This science was not exactly like our science today, but it was surely antecedent to §2{it}§ and was nonetheless an activity aimed at knowing about the world. Muslim rulers granted scientific institutions tremendous resources, such as libraries, observatories, and hospitals. Great schools in all the cities §3{covering}§ the Arabic Near East and North Africa (and even into Spain) trained generations of scholars. Almost every word in the modern scientific lexicon that begins with the prefix 'al' §4{owes}§ its origins to Islamic science — algorithm, alchemy, alcohol, alkali, algebra. And then, just over 400 years after it started, it ground to an apparent halt, and it would be a few hundred years later, give or take, before §5{that}§ we would today unmistakably recognize as science appeared in Europe — with Galileo, Kepler, and a bit later, Newton.",

    {text:"[2021년 9월 학평 29번 · 정답률 49%]  An economic theory of Say's Law holds that everything that's made will get sold. The money from anything that's produced is used to §1{buy}§ something else. There can never be a situation §2{which}§ a firm finds that it can't sell its goods and so has to dismiss workers and close its factories. Therefore, recessions and unemployment are impossible. Picture the level of spending like the level of water in a bath. Say's Law applies §3{because}§ people use all their earnings to buy things, but what happens if people don't spend all their money, saving some of it §4{instead}§? Savings are a 'leakage' of spending from the economy. You're probably imagining the water level now falling, so there's less spending in the economy. That would mean firms producing less and §5{dismissing}§ some of their workers.",

    {text:"[2021년 3월 학평 29번 · 정답률 35%]  While reflecting on the needs of organizations, leaders, and families today, we realize that one of the unique characteristics §1{is}§ inclusivity. Why? Because inclusivity supports §2{what}§ everyone ultimately wants from their relationships: collaboration. Yet the majority of leaders, organizations, and families are still using the language of the old paradigm in which one person — typically the oldest, most educated, and/or wealthiest — makes all the decisions, and their decisions rule with little discussion or inclusion of others, §3{resulting}§ in exclusivity. Today, this person could be a director, CEO, or other senior leader of an organization. There is no need for others to present their ideas because they are considered §4{inadequate}§. Yet research shows that exclusivity in problem solving, even with a genius, is not as effective as inclusivity, §5{which}§ everyone's ideas are heard and a solution is developed through collaboration.",

    {text:"[2018년 9월 모평 29번 · 정답률 43%]  Not all organisms are able to find sufficient food to survive, so starvation is a kind of disvalue often found in nature. It also is part of the process of selection §1{by which}§ biological evolution functions. Starvation helps filter out those less fit to survive, those less resourceful in finding food for §2{themselves}§ and their young. In some circumstances, it may pave the way for genetic variants §3{to take}§ hold in the population of a species and eventually allow the emergence of a new species in place of the old one. Thus starvation is a disvalue that can help make §4{possible}§ the good of greater diversity. Starvation can be of practical or instrumental value, even as it is an intrinsic disvalue. §5{What}§ some organisms must starve in nature is deeply regrettable and sad. The statement remains implacably true, even though starvation also may sometimes subserve ends that are good.",

    {text:"[2018년 6월 학평 28번 · 정답률 35%]  Plastic is extremely slow to degrade and tends to float, §1{which}§ allows it to travel in ocean currents for thousands of miles. Most plastics break down into smaller and smaller pieces when exposed to ultraviolet (UV) light, §2{forming}§ microplastics. These microplastics are very difficult to measure once they are small enough to pass through the nets typically used to collect §3{themselves}§. Their impacts on the marine environment and food webs are still poorly understood. These tiny particles are known to be eaten by various animals and to get into the food chain. Because most of the plastic particles in the ocean §4{are}§ so small, there is no practical way to clean up the ocean. One would have to filter enormous amounts of water to collect a §5{relatively}§ small amount of plastic.",

    {text:"[2018년 6월 모평 28번 · 정답률 41%]  Humans are so averse to feeling that they're being cheated §1{that}§ they often respond in ways that seemingly make little sense. Behavioral economists — the economists who actually study §2{what}§ people do as opposed to the kind who simply assume the human mind works like a calculator — have shown again and again that people reject unfair offers even if §3{it}§ costs them money to do so. The typical experiment uses a task called the ultimatum game. It's pretty straightforward. One person in a pair is given some money — say $10. She then has the opportunity to offer some amount of it to her partner. The partner only has two options. He can take what's offered or §4{refused}§ to take anything. There's no room for negotiation; that's why it's called the ultimatum game. What typically happens? Many people offer an equal split to the partner, §5{leaving}§ both individuals happy and willing to trust each other in the future.",

    {text:"[2018년 4월 학평 28번 · 정답률 42%]  According to Pierre Pica, understanding quantities approximately in terms of estimating ratios is a universal human intuition. In fact, humans who do not have numbers have no choice but §1{to see}§ the world in this way. By contrast, understanding quantities in terms of exact numbers is not a universal intuition; it is a product of culture. The precedence of approximations and ratios over exact numbers, Pica suggests, §2{is}§ due to the fact that ratios are much more important for survival in the wild than the ability to count. §3{Faced}§ with a group of spear-wielding adversaries, we needed to know instantly whether we were more or fewer of them than us. When we saw two trees we needed to know instantly §4{that}§ had more fruit hanging from it. In neither case was it §5{necessary}§ to enumerate every enemy or every fruit individually. The crucial thing was to be able to make quick estimates of the relative amounts.",

    {text:"[2017년 6월 학평 28번 · 정답률 40%]  Cutting costs can improve profitability but only up to a point. Once a manufacturer cuts costs so deeply §1{that}§ doing so harms the product's quality, then the increased profitability will be shortlived. A better approach is to improve productivity. If businesses can get more production from the same number of employees, they're §2{basically}§ tapping into free money. They get more product to sell, and the price of each product falls. As long as the machinery or employee training §3{needed}§ for productivity improvements costs less than the value of the productivity gains, it's an easy investment for any business to make. Productivity improvements are as important to the economy as they §4{do}§ to the individual business that's making them. Productivity improvements generally raise the standard of living for everyone and §5{are}§ a good indication of a healthy economy.",

    {text:"[2016년 6월 모평 28번 · 정답률 50%]  If an animal is innately programmed for some type of behaviour, then there §1{are}§ likely to be biological clues. It is no accident that fish have bodies which are streamlined and smooth, §2{with}§ fins and a powerful tail. Their bodies are structurally adapted for moving fast through the water. Similarly, if you found a dead bird or mosquito, you could guess by looking at §3{its}§ wings that flying was its normal mode of transport. However, we must not be over-optimistic: biological clues are not essential. The extent to which they are §4{finding}§ varies from animal to animal and from activity to activity. For example, it is impossible to guess from their bodies that birds make nests, and, sometimes, animals behave in a way quite contrary to §5{what}§ might be expected from their physical form: ghost spiders have tremendously long legs, yet they weave webs out of very short threads. To a human observer, their legs seem a great hindrance as they spin and move about the web.",

const KEY_PROGRESS = "suneung-grammar-progress-v1";
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(KEY_PROGRESS)) || {}; }catch(e){ return {}; } }
function saveProgress(p){ try{ localStorage.setItem(KEY_PROGRESS, JSON.stringify(p)); }catch(e){} }
let progress = loadProgress();

function totalItems(unit){ return unit.structure.length + unit.passages.length + (unit.box?unit.box.length:0); }
function doneItems(unit){
  const p = progress[unit.id] || {};
  return Object.keys(p).length;
}

let currentId = U[0].id;

function renderNav(){
  const nav = document.getElementById("nav");
  const mob = document.getElementById("mobileTabs");
  nav.innerHTML = "";
  mob.innerHTML = "";
  U.forEach(unit=>{
    const btn = document.createElement("button");
    btn.className = "topic-btn";
    btn.type = "button";
    btn.setAttribute("aria-current", String(unit.id===currentId));
    btn.innerHTML = '<span class="rank">'+unit.rank+'</span>'
      + '<span class="meta"><span class="t">'+unit.title+'</span><span class="r">'+unit.rate+'</span></span>'
      + '<span class="prog">'+doneItems(unit)+'/'+totalItems(unit)+'</span>';
    btn.addEventListener("click", ()=>{ currentId = unit.id; render(); window.scrollTo({top:0}); });
    nav.appendChild(btn);

    const mb = document.createElement("button");
    mb.type = "button";
    mb.textContent = unit.rank+". "+unit.title;
    mb.setAttribute("aria-current", String(unit.id===currentId));
    mb.addEventListener("click", ()=>{ currentId = unit.id; render(); window.scrollTo({top:0}); });
    mob.appendChild(mb);
  });
}

function parseBlank(str){
  // "text before §b§ text after" -> [before, after] for single-blank structure stems
  const parts = str.split("§b§");
  const wrap = document.createElement("span");
  wrap.appendChild(document.createTextNode(parts[0]));
  const em = document.createElement("em");
  em.textContent = "______";
  wrap.appendChild(em);
  wrap.appendChild(document.createTextNode(parts[1]));
  return wrap;
}

function renderStructureCard(item, idx, unit){
  const card = document.createElement("div");
  card.className = "card q-card";
  const top = document.createElement("div");
  top.className = "q-top";
  const qi = document.createElement("span");
  qi.className = "q-idx";
  qi.textContent = (idx+1)+".";
  const stem = document.createElement("span");
  stem.className = "q-stem";
  stem.appendChild(parseBlank(item.q));
  top.appendChild(qi); top.appendChild(stem);
  card.appendChild(top);

  const choicesEl = document.createElement("div");
  choicesEl.className = "choices";
  const letters = ["A","B","C","D"];
  const explain = document.createElement("div");
  explain.className = "explain";

  const key = "s"+idx;
  const prev = (progress[unit.id]||{})[key];

  item.choices.forEach((c,ci)=>{
    const b = document.createElement("button");
    b.type = "button";
    b.className = "choice";
    b.innerHTML = '<span class="k">'+letters[ci]+'</span><span class="v">'+c+'</span>';
    if(prev!==undefined){
      b.disabled = true;
      if(ci===item.answer) b.classList.add("is-correct");
      else if(ci===prev) b.classList.add("is-wrong");
    }
    b.addEventListener("click", ()=>{
      if(!progress[unit.id]) progress[unit.id] = {};
      progress[unit.id][key] = ci;
      saveProgress(progress);
      Array.from(choicesEl.children).forEach((el,i2)=>{
        el.disabled = true;
        if(i2===item.answer) el.classList.add("is-correct");
        else if(i2===ci) el.classList.add("is-wrong");
      });
      showExplain();
      renderNav();
    });
    choicesEl.appendChild(b);
  });
  card.appendChild(choicesEl);

  function showExplain(){
    const chosen = (progress[unit.id]||{})[key];
    const ok = chosen===item.answer;
    explain.innerHTML = '<span class="tag '+(ok?'ok':'no')+'">'+(ok?'정답':'오답')+'</span>'+item.explain;
    explain.classList.add("show");
  }
  if(prev!==undefined) showExplain();
  card.appendChild(explain);
  return card;
}

function renderPassageCard(item, idx, unit){
  const card = document.createElement("div");
  card.className = "card passage-card";
  const head = document.createElement("div");
  head.className = "p-head";
  head.innerHTML = '<span class="p-idx">지문 '+(idx+1)+'</span><span class="p-hint">어법상 틀린 곳을 클릭하세요</span>';
  card.appendChild(head);

  const p = document.createElement("div");
  p.className = "passage";
  const circ = ["①","②","③","④","⑤"];
  const key = "p"+idx;
  const prevPick = (progress[unit.id]||{})[key];
  if(prevPick!==undefined) p.classList.add("answered");

  const regex = /§(\d)\{([^}]*)\}§/g;
  let last = 0, m;
  while((m = regex.exec(item.text))!==null){
    p.appendChild(document.createTextNode(item.text.slice(last,m.index)));
    const n = parseInt(m[1],10);
    const span = document.createElement("span");
    span.className = "blank";
    span.innerHTML = '<span class="circ">'+circ[n-1]+'</span>'+m[2];
    if(prevPick!==undefined){
      if(n===item.answer) span.classList.add("pick-correct");
      else if(n===prevPick) span.classList.add("pick-wrong");
    }
    span.addEventListener("click", ()=>{
      if(p.classList.contains("answered")) return;
      p.classList.add("answered");
      if(!progress[unit.id]) progress[unit.id] = {};
      progress[unit.id][key] = n;
      saveProgress(progress);
      Array.from(p.querySelectorAll(".blank")).forEach(el=>{});
      // recolor all
      let idx2=0;
      p.querySelectorAll(".blank").forEach((el)=>{
        idx2++;
        if(idx2===item.answer) el.classList.add("pick-correct");
        else if(idx2===n) el.classList.add("pick-wrong");
      });
      showExplain();
      renderNav();
    });
    p.appendChild(span);
    last = regex.lastIndex;
  }
  p.appendChild(document.createTextNode(item.text.slice(last)));
  card.appendChild(p);

  const explain = document.createElement("div");
  explain.className = "explain";
  function showExplain(){
    const chosen = (progress[unit.id]||{})[key];
    const ok = chosen===item.answer;
    explain.innerHTML = '<span class="tag '+(ok?'ok':'no')+'">'+(ok?'정답':'오답')+'</span>'+item.explain;
    explain.classList.add("show");
  }
  if(prevPick!==undefined) showExplain();
  card.appendChild(explain);
  return card;
}

    const noteB = document.createElement("p");
    noteB.className = "section-note";
    noteB.textContent = "(A), (B), (C) 각 네모 안에서 어법에 맞는 표현을 고른 뒤, 그 조합과 일치하는 선택지를 고르세요.";
    main.appendChild(noteB);
    const gridB = document.createElement("div");
    gridB.className = "q-grid";
    unit.box.forEach((it,i)=> gridB.appendChild(renderBoxCard(it,i,unit)));
    main.appendChild(gridB);
  }

  const sec2 = document.createElement("div");
  sec2.className = "section-lbl";
  const label2 = unit.id==="kisa" ? "실제 기출 지문" : "최상위권 변별 &mdash; 수능형 지문 어법 판단";
  sec2.innerHTML = '<h3>'+label2+'</h3><span class="n">'+unit.passages.length+'지문</span>';
  main.appendChild(sec2);
  const note2 = document.createElement("p");
  note2.className = "section-note";
  note2.textContent = unit.id==="kisa"
    ? "실제 학력평가·모의평가에 출제된 문제 원문입니다. ①~⑤ 중 어법상 틀린 하나를 직접 찾아보고, 괄호 속 정답률과 비교해 보세요."
    : "실제 수능처럼 한 지문 안에 여러 어법 요소를 섞어 두었습니다. ①~⑤ 중 어법상 틀린 하나만 찾으세요.";
  main.appendChild(note2);
  const grid2 = document.createElement("div");
  grid2.className = "q-grid";
  unit.passages.forEach((it,i)=> grid2.appendChild(renderPassageCard(it,i,unit)));
  main.appendChild(grid2);

  const foot = document.createElement("footer");
  foot.className = "page";
  foot.textContent = "최근 10개년 수능 어법 기출 패턴 분석 기반 · 자체 제작 변별형 문항 · 학습용";
  main.appendChild(foot);
}

const resetBtn = document.getElementById("resetBtn");
const resetLabelDefault = resetBtn.textContent;
let resetArmed = false;
let resetTimer = null;
resetBtn.addEventListener("click", ()=>{
  if(!resetArmed){
    resetArmed = true;
    resetBtn.textContent = "다시 누르면 초기화됩니다";
    clearTimeout(resetTimer);
    resetTimer = setTimeout(()=>{
      resetArmed = false;
      resetBtn.textContent = resetLabelDefault;
    }, 4000);
    return;
  }
  clearTimeout(resetTimer);
  resetArmed = false;
  resetBtn.textContent = resetLabelDefault;
  progress = {};
  saveProgress(progress);
  render();
});

render();
</script>
</body>
</html>
