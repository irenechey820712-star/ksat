,{id:'P',name:'세트 P · 요지·주장 Ⅰ',desc:'자연과학·기술 주제의 요지 및 주장 파악 유형',color:'#c026d3',time:45*60,questions:[
{id:1,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Antibiotics have saved countless lives, but widespread and often unnecessary prescribing has accelerated the evolution of drug-resistant bacteria. In many countries, antibiotics are prescribed for viral infections against which they are entirely ineffective, simply because patients expect them. Each unnecessary course allows resistant bacteria to survive and multiply. Medical experts now warn that without dramatic changes in prescribing behavior, common infections will become life-threatening once more.`,
choices:["항생제의 발견은 현대 의학의 가장 중요한 성취 중 하나이다.","항생제 남용은 내성균의 진화를 가속화하므로 처방 행태를 근본적으로 바꿔야 한다.","바이러스 감염에 항생제를 처방하는 의사들의 태도가 점차 개선되고 있다.","항생제 내성은 주로 병원 내 감염을 통해 확산된다.","새로운 항생제 개발이 내성균 문제의 근본적 해결책이다."],answer:2,
explanation:"항생제 남용이 내성균을 만들므로 처방 행태를 바꿔야 한다는 주장이 요지이므로 ②입니다."},

{id:2,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Physical exercise reduces the risk of heart disease, stroke, type 2 diabetes, and several cancers. Yet few adults meet recommended activity guidelines. Public health campaigns targeting awareness have limited success because the real barrier is not knowledge but environment: urban design, sedentary jobs, and time constraints make regular activity genuinely difficult. The solution lies less in education than in redesigning cities and workplaces to make physical activity the default, not the exception.`,
choices:["성인 대부분이 권장 운동량을 지키지 못하는 것은 의지력 부족 때문이다.","환경 재설계를 통해 운동이 일상적으로 가능한 구조를 만드는 것이 더 효과적인 해결책이다.","규칙적인 운동은 심장병, 당뇨병 등 만성 질환의 위험을 낮춰 준다.","여가 시간을 늘려야 사람들이 더 많이 운동할 수 있다.","직장 내 운동 프로그램이 직원 건강을 향상시키는 가장 효과적인 방법이다."],answer:2,
explanation:"운동 증가를 위해서는 환경 재설계가 교육보다 더 효과적이라는 주장이므로 ②입니다."},

{id:3,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Modern societies consistently undervalue sleep. Many adults treat getting only five or six hours a night as a badge of productivity. But sleep is a biological necessity, not a luxury. During sleep the brain consolidates memories, repairs cellular damage, and clears metabolic waste linked to neurological disease. Chronic sleep deprivation correlates with obesity, heart disease, impaired judgment, and accelerated cognitive decline. Treating sleep as expendable is not a productivity strategy — it is a serious health hazard.`,
choices:["현대인의 수면 시간 감소는 생활 방식의 변화로 불가피한 현상이다.","수면 장애는 전문적 치료가 필요한 의학적 문제로 인식해야 한다.","수면 부족은 신체적·인지적 건강에 심각한 위험을 초래하므로 충분한 수면을 취해야 한다.","수면 연구에 대한 투자 부족으로 관련 질환 치료가 지연되고 있다.","낮잠이 야간 수면을 보완하는 효과적인 방법으로 활용될 수 있다."],answer:3,
explanation:"수면 부족이 심각한 건강 위험임을 경고하며 충분한 수면을 촉구하므로 ③입니다."},

{id:4,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Solar and wind power have undergone dramatic cost reductions over the past decade — falling more than eighty percent in many markets — making them now the cheapest source of new electricity generation in most of the world. Critics who argue that renewables are too expensive are working from outdated figures. The economic case for continued fossil fuel investment no longer holds in most contexts. The remaining barriers are not cost but policy inertia, incumbent industry lobbying, and grid infrastructure challenges.`,
choices:["풍력과 태양광 에너지는 여전히 화석 연료보다 비용이 높아 정부 보조금이 필요하다.","재생에너지는 이미 비용 경쟁력을 갖추었으며 에너지 전환의 장벽은 정책·인프라 문제다.","화석 연료 기업의 로비가 에너지 전환을 막는 가장 큰 장벽이다.","재생에너지 가격이 하락했지만 전력망 안정성 문제가 아직 해결되지 않았다.","에너지 전환을 위해서는 세금 지원보다 규제 완화가 더 효과적이다."],answer:2,
explanation:"재생에너지의 비용 경쟁력을 강조하며 전환의 진짜 장벽은 정책 문제임을 주장하므로 ②입니다."},

{id:5,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Microplastics have now been detected in human blood, lungs, placentas, and breast milk. While full health implications are not yet understood, preliminary research links microplastic exposure to inflammation, endocrine disruption, and oxidative stress. The assumption that plastic packaging is inert and safe has been overturned by evidence that plastics shed particles and chemical additives throughout their lifecycle. Consumers and regulators alike have been slow to respond to this emerging body of concerning evidence.`,
choices:["미세플라스틱의 인체 위험성은 아직 과학적으로 충분히 입증되지 않았다.","미세플라스틱은 인체 내 여러 조직에서 발견되므로 그 잠재적 건강 위험에 경각심을 가져야 한다.","플라스틱 재활용률 향상이 미세플라스틱 오염 문제를 효과적으로 해결할 수 있다.","포장재 규제보다 소비자 교육이 미세플라스틱 노출을 줄이는 데 더 중요하다.","해양 미세플라스틱 문제는 육상 오염보다 더 시급한 과제다."],answer:2,
explanation:"미세플라스틱이 인체에서 발견되며 그 잠재적 위험에 경각심을 가져야 한다는 내용이므로 ②입니다."},

{id:6,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Biodiversity is the foundation of the ecosystem services human civilization depends on. Pollinators underpin global food production. Wetlands filter water and buffer coastal flooding. Forests regulate rainfall and store carbon. The economic value of these services dwarfs the short-term gains from converting wild habitats to agricultural or industrial use. Biodiversity loss is, in the long run, an economic catastrophe as much as an environmental one.`,
choices:["생물다양성 보전을 위해 생태계 서비스의 경제적 가치를 시장 가격에 반영해야 한다.","생태계 서비스에 대한 연구 투자 부족으로 생물다양성의 경제적 가치가 과소평가되고 있다.","생물다양성 손실은 장기적으로 경제에도 심각한 피해를 주므로 생태계 보전이 필수적이다.","농업 생산성을 높이기 위해 일부 서식지 전환은 불가피하게 받아들여야 한다.","정부 보조금 정책이 생물다양성 보전과 농업 생산 간의 균형을 맞추는 핵심이다."],answer:3,
explanation:"생물다양성 손실이 환경뿐 아니라 경제적 재앙이므로 생태계 보전이 필수라는 주장이므로 ③입니다."},

{id:7,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Ultra-processed foods now constitute more than half of caloric intake in many high-income countries. Studies consistently link their consumption to obesity, type 2 diabetes, heart disease, and certain cancers. Yet food labels in most countries do not clearly communicate the degree of processing. The question of whether a product is 'natural' or has twelve artificial additives is not evident from current labeling systems. Consumers cannot make informed choices without knowing how heavily processed a product really is.`,
choices:["초가공식품의 건강 위험을 알리는 학교 영양 교육을 강화해야 한다.","식품 업계의 자율 규제만으로는 가공식품의 위험성을 충분히 알릴 수 없다.","가공식품 소비 감소를 위해 설탕세 등 재정적 억제책이 필요하다.","현행 식품 표시 제도가 가공도를 충분히 전달하지 못하므로 표시 기준을 개선해야 한다.","초가공식품 산업 규제 강화는 식품 접근성을 낮출 위험이 있다."],answer:4,
explanation:"현행 식품 라벨이 가공도를 충분히 전달하지 못하므로 기준 개선이 필요하다는 주장이므로 ④입니다."},

{id:8,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`As cities have grown denser, parks, street trees, and urban gardens have been squeezed out in favor of roads and buildings. Research shows that access to nature, even briefly, significantly reduces stress, lowers blood pressure, and improves mood and cognitive performance. In the densest urban areas — where residents have the least access to nature — health disparities are widest. Investing in urban green infrastructure is not a luxury but an evidence-based public health intervention.`,
choices:["도시 인구 밀도가 높아질수록 정신 건강 서비스의 수요가 증가한다.","도시 녹지공간은 스트레스 감소와 건강 증진에 기여하므로 도시 계획에서 우선시해야 한다.","환경 심리학 연구 결과들이 정책에 반영되는 속도가 너무 느리다.","공원보다 실내 자연 요소가 도시 거주자의 건강에 더 효율적이다.","도시 녹지 확충을 위해 기업 개발 부담금을 높여야 한다."],answer:2,
explanation:"도시 녹지공간이 공중 보건에 근거 기반의 필수 투자임을 주장하므로 ②입니다."},

{id:9,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Despite progress in understanding mental illness, a persistent stigma surrounds psychological conditions in many societies. People who would readily seek treatment for a broken leg often delay or avoid seeking help for depression, fearing judgment from colleagues or employers. This delay has measurable consequences: untreated mental illness worsens over time, and early intervention is far more effective than crisis care. Treating mental health conditions as equivalent in seriousness to physical ones is not merely compassionate — it is economically rational.`,
choices:["직장 내 정신 건강 지원 프로그램이 이직률과 결근을 줄이는 데 효과적이다.","정신 건강의 중요성이 신체 건강만큼 인정받아야 하며 치료에 대한 낙인을 없애야 한다.","정신 질환 치료의 비용 효과를 입증하는 연구에 더 많은 자금이 투입되어야 한다.","현행 정신 건강 보험 적용 범위가 신체 질환에 비해 불충분하다.","정신 건강 문제는 조기 개입보다 예방 교육이 더 효과적이다."],answer:2,
explanation:"정신 건강이 신체 건강과 동등하게 대우받아야 하며 치료 낙인을 없애야 한다는 주장이므로 ②입니다."},

{id:10,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Ocean plastic pollution originates primarily from a small number of rivers in Asia and Africa carrying waste from cities without adequate infrastructure. Cleaning the open ocean is orders of magnitude more difficult and costly than preventing plastic from entering it. Funding waste management infrastructure in developing countries would address the problem at its source, rather than attempting to remedy it downstream at enormous expense and with limited success.`,
choices:["선진국은 개발도상국에 폐기물 관리 기술을 이전하는 국제 협약을 체결해야 한다.","해양 플라스틱 정화 이니셔티브는 문제의 근본 원인을 해결하지 못해 효과가 제한적이다.","강을 통해 바다로 유입되는 플라스틱을 차단하는 것이 해양 오염의 핵심 해결책이다.","해양 플라스틱 오염을 줄이기 위해서는 발생원에서의 폐기물 관리 인프라 투자가 더 중요하다.","개발도상국의 플라스틱 소비 자체를 줄이는 것이 가장 근본적인 방법이다."],answer:4,
explanation:"해양 오염의 근본 해결책은 발생원인 개발도상국의 폐기물 관리 인프라 투자라는 주장이므로 ④입니다."},

{id:11,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Science literacy is increasingly essential for informed citizenship, yet public understanding of basic scientific concepts remains poor in many countries. When people cannot evaluate evidence quality, they become susceptible to misinformation about vaccines, climate change, and nutrition. Scientists bear responsibility for this gap: academic papers, written for other experts, are inaccessible to the public. Science communication — translating research findings into accessible language without sacrificing accuracy — should be treated as a professional skill and a civic obligation.`,
choices:["과학 교육 강화를 위해 교사 연수와 교육 과정 개편에 더 많은 예산을 투입해야 한다.","과학자들은 연구 결과를 일반 대중이 이해할 수 있는 방식으로 전달하는 책임을 져야 한다.","학술 저널의 오픈 액세스 확대가 과학 정보 불평등을 해소하는 핵심 방법이다.","가짜 과학 정보를 규제하기 위한 플랫폼 자체 검증 시스템이 강화되어야 한다.","일반인을 위한 과학 박물관과 체험 시설에 대한 투자가 확대되어야 한다."],answer:2,
explanation:"과학자들이 연구를 대중이 이해할 수 있도록 전달해야 한다는 주장이므로 ②입니다."},

{id:12,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`The proliferation of smartphones has transformed how people engage with information. Studies show that constant connectivity fragments attention, making sustained deep reading increasingly rare. Students who take notes on laptops retain less information than those who write by hand, apparently because typing encourages verbatim transcription rather than synthesis. The tools we adopt to make us more efficient may, in some domains, be reducing our capacity for the sustained thought that genuine understanding requires.`,
choices:["디지털 기기 의존도가 높은 학생들은 학업 성취도가 낮은 경향이 있다.","스마트폰 사용 시간을 제한하는 정책이 학교와 직장에서 도입되어야 한다.","디지털 도구에 대한 과도한 의존은 깊은 사고 능력을 저하시킬 수 있다.","노트북 필기보다 손 필기가 정보 보유에 더 효과적임이 연구로 증명되고 있다.","디지털 기기 활용 교육은 효율성과 함께 비판적 사고 훈련을 병행해야 한다."],answer:3,
explanation:"디지털 도구 과의존이 깊은 사고 능력을 저하시킨다는 경고가 요지이므로 ③입니다."},

{id:13,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Air quality standards in most countries were established decades ago based on health research that has since been superseded. Newer epidemiological studies consistently find harm at pollution levels previously considered safe, particularly for children, the elderly, and those with respiratory conditions. The lag between scientific evidence and regulatory standards leaves millions breathing air that meets current legal thresholds but still causes measurable health damage. Updating pollution standards to reflect current science is a matter of public health urgency.`,
choices:["대기오염 규제는 경제적 비용보다 건강 이익을 기준으로 재평가되어야 한다.","노약자를 위한 별도의 대기질 기준을 마련하여 취약 계층을 보호해야 한다.","산업계의 반발로 대기질 규제 강화가 지연되어 시민 사회의 압력이 필요하다.","현행 대기질 기준은 최신 과학 근거를 반영하지 못하므로 시급히 개정해야 한다.","대기오염 측정 방법의 표준화가 국가 간 비교와 정책 개선에 기여한다."],answer:4,
explanation:"현행 대기질 기준이 최신 과학을 반영하지 못하므로 시급히 개정해야 한다는 주장이므로 ④입니다."},

{id:14,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Modern healthcare systems are disproportionately organized around treating disease rather than preventing it. In most high-income countries, less than five percent of health spending goes toward prevention programs. Diabetes, heart disease, stroke, and several cancers are all largely preventable through lifestyle interventions and early screening. Shifting even a modest fraction of healthcare spending from treatment to prevention would yield enormous improvements in population health at lower overall cost.`,
choices:["만성 질환 치료를 위한 의료 자원이 선진국에서도 부족한 실정이다.","치료 중심의 의료비 지출 구조를 예방 중심으로 전환하면 더 큰 건강 편익을 얻을 수 있다.","예방 의학 전문 인력 양성을 위한 의과대학 교육 과정 개편이 필요하다.","개인의 생활 습관 개선만으로는 만성 질환 예방에 한계가 있어 의료 접근성 확대가 더 중요하다.","선진국의 예방적 건강 관리 프로그램을 개발도상국에 도입하면 의료비 절감 효과가 크다."],answer:2,
explanation:"의료비 지출을 치료 중심에서 예방 중심으로 전환해야 한다는 주장이므로 ②입니다."},

{id:15,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`The debate over genetically modified organisms in food is often conducted with more heat than light. Opponents raise fears of unknown long-term health risks and corporate control of the food supply; proponents point to decades of safety data and increased yields. Both sides frequently speak past each other, treating distinct questions as if they were one. Productive discussion of GMOs requires separating the safety question for human consumption, the environmental impact question, and the corporate governance question — each of which deserves independent, evidence-based analysis.`,
choices:["GMO 식품의 안전성은 과학적으로 충분히 입증되었으므로 규제 완화가 필요하다.","GMO에 대한 소비자 교육 강화로 근거 없는 공포심을 해소해야 한다.","GMO 논쟁에서 안전성, 환경 영향, 기업 지배구조 문제를 분리해 이성적으로 논의해야 한다.","GMO 식품의 라벨 표시 의무화가 소비자 선택권 보장에 필수적이다.","생물다양성 손실 문제를 해결하지 않는 한 GMO 작물의 확산을 허용해서는 안 된다."],answer:3,
explanation:"GMO 논쟁에서 서로 다른 문제를 분리해 이성적으로 논의해야 한다는 주장이므로 ③입니다."},

{id:16,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Fresh water is among the most critical natural resources humanity faces a shortage of. Groundwater aquifers in key agricultural regions are being depleted far faster than they are naturally recharged. Agricultural irrigation, which accounts for roughly seventy percent of freshwater withdrawals globally, remains highly inefficient in most regions. Without significant changes in irrigation technology and water pricing, water scarcity will constrain food production in ways that economic growth alone cannot solve.`,
choices:["효율적인 관개 기술 보급을 위해 국제 농업 기관의 역할이 강화되어야 한다.","수자원 고갈 문제는 해수 담수화 기술 발전으로 해결될 가능성이 크다.","관개 효율 개선과 합리적 물 가격 정책 없이는 수자원 고갈로 식량 생산이 위협받을 것이다.","지하수 고갈을 막기 위해 물 집약적 작물 재배를 제한하는 국제 협약이 필요하다.","민간 기업의 수자원 개발 참여를 장려하여 혁신적 해결책을 모색해야 한다."],answer:3,
explanation:"관개 효율 개선과 물 가격 정책 없이는 수자원 고갈로 식량 생산이 위협받는다는 경고이므로 ③입니다."},

{id:17,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Light pollution is so pervasive that more than a third of the world's population can no longer see the Milky Way. This matters not only for astronomy but for ecology. Sea turtle hatchlings disoriented by coastal lighting march toward roads instead of the ocean. Migratory birds collide with illuminated buildings. Insects drawn to artificial lights die, disrupting food chains. Smarter, directed lighting could reduce light pollution substantially at relatively low cost.`,
choices:["국제 조약을 통해 야간 조명 규제 기준을 통일해야 한다.","빛 공해는 생태계와 동물 행동에 심각한 피해를 주므로 지능적 조명 설계가 필요하다.","관측소 주변 지역의 인공 조명을 제한하여 천문학 연구를 보호해야 한다.","빛 공해의 경제적 비용을 정량화하여 기업이 자발적으로 조명 사용을 줄이도록 유도해야 한다.","가로등의 LED 전환이 에너지 효율을 높이면서도 빛 공해를 악화시킬 수 있다."],answer:2,
explanation:"빛 공해가 생태계에 미치는 피해와 지능형 조명 설계의 필요성을 강조하므로 ②입니다."},

{id:18,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Growing clinical research supports exercise as a treatment for mild to moderate depression, with effect sizes comparable to antidepressant medication in several trials. Unlike medication, exercise has no significant side effects, improves physical health simultaneously, and develops a sense of self-efficacy that may itself be therapeutically important. Clinical guidelines in several countries now recommend exercise as a first-line option, though prescription rates among physicians remain low relative to the evidence base.`,
choices:["항우울제 처방 환자들도 운동을 병행해야 치료 효과가 높아진다.","운동이 경증·중등도 우울증에 약물과 유사한 효과를 보이므로 의사들이 적극 권고해야 한다.","규칙적인 운동이 우울증 재발 방지에 약물 치료보다 더 효과적임이 입증되고 있다.","정신 건강 치료에서 의사들의 운동 처방 역량을 높이기 위해 교육을 개편해야 한다.","운동과 인지행동치료를 병행하는 통합 접근법이 가장 효과적이다."],answer:2,
explanation:"운동이 경증 우울증에 약물과 유사한 효과를 가지므로 의사들이 적극 권고해야 한다는 주장이므로 ②입니다."},

{id:19,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Nuclear energy produces virtually no direct carbon emissions during operation, making it a potential ally in reducing greenhouse gas emissions. Yet public opposition has led many countries to phase out or refuse to build new reactors. Meanwhile, the coal and gas plants that replace nuclear capacity continue to emit carbon at scale. The climate arithmetic may be uncomfortable for some environmentalists, but a fact-based assessment requires acknowledging the potential role of next-generation nuclear power in a low-carbon energy portfolio.`,
choices:["노후 원자력 발전소를 조기에 폐쇄하여 방사선 사고 위험을 최소화해야 한다.","차세대 원자력 기술 개발에 대한 국제 협력이 강화되어야 한다.","원자력 에너지의 탄소 저감 잠재력을 사실에 근거하여 저탄소 에너지 포트폴리오의 일부로 검토해야 한다.","원자력 폐기물 처리 문제가 해결되지 않는 한 신규 원전 건설은 정당화될 수 없다.","원전 사고 위험에 대한 대중의 과대 인식을 바로잡기 위해 정부 홍보가 필요하다."],answer:3,
explanation:"원자력의 탄소 저감 잠재력을 사실에 근거해 저탄소 에너지 선택지로 고려해야 한다는 주장이므로 ③입니다."},

{id:20,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`The global food system is responsible for roughly a third of total greenhouse gas emissions, with animal agriculture contributing a disproportionate share. A widespread shift toward plant-rich diets would reduce emissions, land use, and water consumption simultaneously, while delivering health benefits. However, dietary change at scale requires more than individual willpower: it depends on food environments, pricing, cultural norms, and the choices made by food companies, caterers, and governments that determine what is cheap, available, and socially acceptable.`,
choices:["채식주의가 건강과 환경 모두에 이롭다는 과학적 근거가 충분히 제시되지 않고 있다.","식량 시스템의 지속 가능성을 위해 개인의 식단 변화뿐 아니라 식품 환경 자체를 바꿔야 한다.","소고기·유제품 소비 감소를 위해 탄소 기반 식품 과세를 도입해야 한다.","축산업의 온실가스 배출을 줄이기 위한 기술 혁신이 식단 변화보다 더 현실적이다.","학교 급식에서 식물성 식품 비율을 높이는 것이 식단 변화를 유도하는 효과적인 정책이다."],answer:2,
explanation:"식단 변화를 위해 개인 의지뿐 아니라 식품 환경과 제도적 변화가 함께 필요하다는 주장이므로 ②입니다."}
]},

// ── SET Q : 요지·주장 Ⅱ  (심리·사회·문화) ──────────────────────────
,{id:'Q',name:'세트 Q · 요지·주장 Ⅱ',desc:'심리·사회·문화 주제의 요지 및 주장 파악 유형',color:'#e11d48',time:45*60,questions:[
{id:1,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Empathy is often presented as a fixed personality trait — you either have it or you do not. But research in developmental psychology tells a different story. Empathy consists of distinguishable components — perspective-taking, emotional responsiveness, and compassion — that can each be trained. Structured exercises in perspective-taking, practiced regularly, demonstrably increase empathic accuracy. This finding has important implications for schools, workplaces, and clinical settings, all of which could cultivate empathy as a teachable skill rather than waiting for it to emerge naturally.`,
choices:["공감 능력이 높은 사람들은 직장 생활에서 더 높은 성과를 내는 경향이 있다.","공감은 타고나는 고정된 특성이 아니라 훈련과 연습을 통해 향상시킬 수 있다.","정서적 공감보다 인지적 관점 수용이 사회적 갈등 해소에 더 효과적이다.","학교 환경에서 공감 교육보다 사회·정서 학습 전반의 도입이 더 중요하다.","공감 능력 부족이 직장 내 갈등의 주된 원인이 되고 있어 해결책이 필요하다."],answer:2,
explanation:"공감은 타고나는 것이 아니라 훈련으로 향상될 수 있다는 주장이므로 ②입니다."},

{id:2,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Adolescents who spend more than three hours daily on social media are significantly more likely to report symptoms of depression, anxiety, and low self-esteem than those who use it less. The mechanisms are well-documented: upward social comparison, cyberbullying, sleep disruption from nighttime use, and displacement of face-to-face interaction. Unlike adults, adolescents lack the developed prefrontal cortex needed to manage the emotional demands of constant social evaluation. Age-appropriate usage limits, akin to those applied to alcohol and driving, deserve serious consideration.`,
choices:["소셜 미디어 기업들은 청소년 사용자 데이터 수집에 대한 더 엄격한 규제를 받아야 한다.","사이버 괴롭힘 예방을 위해 학교 내 디지털 리터러시 교육을 강화해야 한다.","청소년의 정신 건강 보호를 위해 소셜 미디어 사용에 연령에 맞는 제한을 두어야 한다.","소셜 미디어 사용이 청소년의 사회적 기술 발달에 미치는 부정적 영향을 연구해야 한다.","부모의 적극적 관리가 청소년 소셜 미디어 문제의 가장 효과적인 해결책이다."],answer:3,
explanation:"청소년의 정신 건강을 위해 소셜 미디어 사용에 연령 적합한 제한을 두어야 한다는 주장이므로 ③입니다."},

{id:3,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`History textbooks in many countries present a single national narrative: the story of 'our' nation's glorious past, with uncomfortable episodes minimized or omitted. This approach produces students who feel pride but lack the critical tools to evaluate historical claims. Countries that have attempted to incorporate multiple perspectives — including those of colonized peoples, marginalized groups, and neighboring nations — report that students develop stronger analytical skills and greater capacity for civic dialogue. History education is not merely about transmitting facts but about developing historical thinking.`,
choices:["역사 교육에서 국가 정체성 형성을 위한 민족 서사의 역할을 무시해서는 안 된다.","역사 교육은 단일 국가 서사를 넘어 다양한 관점을 포함해야 비판적 사고와 시민 역량을 키울 수 있다.","역사 교과서 편찬 과정에 역사학자뿐 아니라 일반 시민도 참여해야 한다.","식민지 역사에 대한 서술 방식을 국제적으로 표준화하는 노력이 필요하다.","역사적 사실보다 역사적 사고 방법론을 가르치는 데 더 많은 수업 시간을 할애해야 한다."],answer:2,
explanation:"역사 교육이 다양한 관점을 포함해야 비판적 사고와 시민 역량을 키울 수 있다는 주장이므로 ②입니다."},

{id:4,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Children's cognitive, social, and emotional development is powerfully shaped by play — especially the kind of unstructured, imaginative play that children direct themselves. When children invent games, negotiate rules, manage conflict, and create narratives, they practice executive functions like planning, impulse control, and perspective-taking. Yet in many countries, children's time for free play has fallen dramatically, squeezed out by structured academic activities, homework, and screen-based entertainment. This reduction in play time may be contributing to rising rates of anxiety and declining social competence in young children.`,
choices:["과도한 학업 부담이 아동의 신체 활동 시간을 감소시켜 비만율을 높이고 있다.","디지털 게임이 전통적 신체 놀이를 대체함으로써 아동 발달에 부정적 영향을 미친다.","아동이 주도하는 자유 놀이 시간을 확보하는 것이 인지적·사회적 발달에 필수적이다.","창의적 놀이 활동을 정규 교육 과정에 통합하면 학업 성취도도 함께 향상된다.","유아 교육에서 구조화된 학습보다 자유 탐색이 더 효과적임을 교사들이 인식해야 한다."],answer:3,
explanation:"아동 주도의 자유 놀이 시간을 확보하는 것이 발달에 필수적이라는 주장이므로 ③입니다."},

{id:5,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Angela Duckworth's research on grit argued that passion and perseverance predict success more reliably than talent alone. The concept attracted enormous attention from educators keen on discovering teachable paths to achievement. But subsequent research has revealed important limitations: grit's predictive power is modest, and children's ability to persist is heavily shaped by their circumstances. Children from stable, resource-rich environments have far more opportunity to develop perseverance than those experiencing poverty, trauma, or chronic instability. Celebrating grit without addressing structural disadvantage may blame individuals for circumstances beyond their control.`,
choices:["끈기와 열정이 학업 성취를 예측하는 데 지능보다 더 중요한 요소임이 입증되었다.","끈기만으로는 구조적 불평등을 극복하기 어려우므로 사회적 지원 체계도 함께 강화해야 한다.","교사들이 학생의 끈기를 계발하기 위한 구체적 교수 전략을 갖추어야 한다.","끈기 중심 교육관은 경쟁에서 뒤처지는 학생들에 대한 낙인을 강화할 위험이 있다.","학업 성취에 영향을 미치는 다양한 성격 변수를 종합적으로 고려한 연구가 필요하다."],answer:2,
explanation:"끈기(grit)만으로는 구조적 불평등을 극복하기 어려우므로 사회적 지원 체계도 필요하다는 주장이므로 ②입니다."},

{id:6,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Critics of immigration often focus on fiscal costs — immigrants using public services — while overlooking fiscal contributions. In most high-income countries, immigrants on average pay more in taxes over their lifetimes than they receive in benefits, partly because they tend to arrive at working age having been educated elsewhere. Labor market fears are similarly overblown: immigrants largely complement rather than substitute for native workers, filling gaps in sectors with persistent shortages. A more accurate economic assessment would recognize immigration as a net positive for host country economies.`,
choices:["이민자의 고국 송금이 개발도상국 경제에 미치는 긍정적 효과를 더 인정해야 한다.","이민이 수용국 경제에 미치는 재정적 비용에 대한 우려는 과장되어 있으며 실제로는 경제적 이익이 크다.","숙련 이민자 유치를 위해 수용국들이 더 경쟁적인 이민 정책을 개발해야 한다.","이민자의 사회 통합을 지원하는 정책이 경제적 기여를 극대화하는 핵심이다.","이민에 대한 대중의 부정적 인식을 바로잡기 위해 언론의 역할이 중요하다."],answer:2,
explanation:"이민이 수용국 경제에 실제로 순이익을 가져온다는 주장이므로 ②입니다."},

{id:7,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Automation and artificial intelligence are displacing workers not only in manufacturing but increasingly in service and knowledge work. While past technological transitions created new categories of employment, economists debate whether this wave of automation will do the same at sufficient speed and scale. Universal basic income — a regular, unconditional payment to all citizens — is increasingly proposed as a policy buffer that would provide economic security while allowing people to retrain, care for family members, or engage in socially valuable but unpaid work.`,
choices:["인공지능 기술 발전이 고용 시장에 미치는 영향에 대한 체계적 연구가 부족하다.","자동화로 인한 일자리 감소에 대응하여 노동자 재교육 프로그램을 확대해야 한다.","기술 혁신이 장기적으로 새로운 직종을 창출한다는 낙관적 전망은 재고해야 한다.","자동화로 인한 고용 불안에 대응하는 정책 수단으로 기본소득 도입을 진지하게 고려해야 한다.","인공지능 개발 기업에 로봇세를 부과하여 실업 지원 재원을 마련해야 한다."],answer:4,
explanation:"자동화로 인한 고용 불안에 대한 정책 수단으로 기본소득 도입을 진지하게 고려해야 한다는 주장이므로 ④입니다."},

{id:8,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Reading literary fiction — as opposed to non-fiction or popular genre fiction — uniquely exercises the capacity to inhabit other minds. Readers of literary fiction must constantly infer characters' unstated thoughts, emotions, and motivations. Experimental studies comparing readers of literary fiction to non-readers on measures of theory of mind show consistent advantages for fiction readers. If empathy can be trained, one of the most accessible and enjoyable training tools may be the novel sitting on your shelf.`,
choices:["독서 습관은 어린 시절 형성되는 것이므로 유아기부터 독서 교육을 시작해야 한다.","문학 소설 읽기는 타인의 마음을 이해하는 공감 능력을 향상시키는 효과적인 방법이다.","비문학 독서보다 문학 독서를 통해 더 많은 어휘력과 언어 표현력을 기를 수 있다.","디지털 콘텐츠의 증가로 전통적 독서가 감소하는 현상에 대한 사회적 대책이 필요하다.","독서 클럽 활동이 개인 독서보다 공감 능력 향상에 더 효과적인 방법이다."],answer:2,
explanation:"문학 소설 읽기가 공감 능력을 향상시키는 효과적인 방법이라는 주장이므로 ②입니다."},

{id:9,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Studies consistently show that employees who work excessively long hours are less productive per hour, more error-prone, and more likely to suffer burnout. Countries and companies that have experimented with four-day workweeks report maintaining or improving output while significantly reducing absenteeism and turnover. The belief that longer hours signal commitment and produce better results is deeply embedded in corporate culture but contradicted by the evidence. A shift toward output-focused rather than hours-focused evaluation would benefit both employees and employers.`,
choices:["직장인의 과도한 업무 시간이 만성 스트레스를 유발하여 의료비 지출을 증가시키고 있다.","주 4일 근무제가 생산성을 유지하면서도 직원 만족도와 건강을 향상시킨다.","장시간 근무가 성과와 헌신을 나타낸다는 믿음을 버리고 성과 중심의 평가로 전환해야 한다.","유연 근무제 도입이 업무 효율성과 직원 만족도를 모두 높이는 가장 현실적인 방법이다.","일-생활 균형 정책이 직원 이직률을 낮추어 기업의 채용 비용을 절감하는 데 효과적이다."],answer:3,
explanation:"장시간 근무 문화를 버리고 성과 중심 평가로 전환해야 한다는 주장이므로 ③입니다."},

{id:10,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Cultural heritage sites — ancient temples, historic city centers, indigenous landscapes — are regularly threatened by development, tourism pressure, and climate change. UNESCO and national preservation bodies lack the resources to protect the thousands of sites that require urgent attention. Private investment, when structured correctly with conservation covenants, has proven effective in some cases. More fundamentally, societies need to recognize that the irreplaceable character of heritage sites makes them worth protecting even when their immediate economic return is modest.`,
choices:["문화유산 보호를 위한 유네스코의 예산과 권한을 대폭 확대해야 한다.","관광 수입을 통해 문화유산 보호 비용을 충당하는 지속 가능한 모델을 개발해야 한다.","기후 변화가 문화유산에 미치는 위협을 국제 협약에서 더 비중 있게 다루어야 한다.","사회는 문화유산 보호가 경제적 수익이 작더라도 그 대체 불가능한 가치 때문에 우선시해야 한다.","민간 투자를 문화유산 보전에 활용하기 위해 세제 혜택 등 인센티브 구조를 정비해야 한다."],answer:4,
explanation:"문화유산은 경제적 수익이 작더라도 대체 불가능한 가치 때문에 사회가 우선 보호해야 한다는 주장이므로 ④입니다."},

{id:11,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Population studies show that volunteers consistently report higher levels of subjective wellbeing, lower rates of depression, and even longer lifespans than non-volunteers. The mechanism appears to be multidirectional: volunteering provides social connection, a sense of purpose, and the psychological benefits of helping others. The relationship is not merely correlational — experimental studies in which participants are randomly assigned to volunteering show subsequent improvements in mood and self-reported health. The wellbeing benefits flow to the helper, not only the helped.`,
choices:["지역 사회 자원봉사 프로그램이 사회적 소외감 해소에 효과적인 정책 도구로 활용될 수 있다.","자원봉사 활동은 제공자의 정신 건강과 웰빙을 향상시키는 실증된 방법이다.","은퇴 후 자원봉사는 노인의 사회적 관계를 유지하고 인지 기능 저하를 늦추는 데 도움이 된다.","자원봉사의 심리적 혜택을 최대화하기 위해 봉사자와 수혜자 사이의 개인적 연결이 중요하다.","자원봉사 문화 확산을 위해 학교와 직장에서 자원봉사 참여에 인센티브를 제공해야 한다."],answer:2,
explanation:"자원봉사가 제공자 본인의 정신 건강과 웰빙을 향상시킨다는 주장이므로 ②입니다."},

{id:12,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Participation in arts education — music, visual arts, drama, and creative writing — has been associated with improvements in literacy, mathematical reasoning, and school engagement. The benefits appear particularly pronounced for students from disadvantaged backgrounds, who often receive fewer enrichment experiences outside of school. Arts education also develops capacities that are not captured by standardized testing: aesthetic judgment, the ability to tolerate ambiguity, and creative problem-solving. These are among the most valued competencies in the modern workforce.`,
choices:["예술 분야의 직업 기회를 확대하기 위해 예술 교육 기관에 대한 정부 지원을 늘려야 한다.","디지털 기술을 예술 교육에 접목하면 학생들의 창의적 표현 능력이 향상된다.","예술 교육은 학업 성취와 창의적 역량 발달에 기여하므로 교육 과정에서 우선시해야 한다.","예술적 소질이 있는 학생들을 조기에 발굴하여 맞춤형 교육 기회를 제공해야 한다.","예술과 과학 교육의 통합적 접근(STEAM)이 미래 인재 양성에 가장 효과적이다."],answer:3,
explanation:"예술 교육이 학업 성취와 창의적 역량 발달에 기여하므로 교육에서 우선시해야 한다는 주장이므로 ③입니다."},

{id:13,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Mass incarceration has failed to reduce crime rates proportionally to its enormous economic and human cost. Evidence consistently shows that the severity of punishment — in terms of sentence length — has little deterrent effect compared to the certainty of being caught. By contrast, rehabilitation programs addressing addiction, mental health, education, and employment skills substantially reduce reoffending. A justice system focused on rehabilitation rather than punishment would be both more humane and more effective at protecting public safety.`,
choices:["재범 방지를 위해 출소 후 사회 재통합 지원 프로그램을 확대해야 한다.","교도소 과밀 문제를 해결하기 위해 비폭력 범죄에 대한 대안적 제재를 도입해야 한다.","형사 사법 제도는 처벌보다 재활에 초점을 맞춰야 인도주의적이면서도 공공 안전에 더 효과적이다.","형벌의 확실성을 높이는 것이 경중 구분 없이 형량을 늘리는 것보다 범죄 억제에 효과적이다.","교도소 교육 프로그램이 수감자의 자존감과 재취업 가능성을 높인다는 근거가 더 필요하다."],answer:3,
explanation:"형사 사법 제도가 처벌보다 재활에 초점을 맞추는 것이 더 효과적이라는 주장이므로 ③입니다."},

{id:14,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Mindfulness-based interventions — training attention to be present, non-judgmental, and aware of moment-to-moment experience — have been supported by substantial research. Randomized trials show that regular mindfulness practice reduces symptoms of stress, anxiety, and depression, improves focus and working memory, and appears to lower cortisol levels. Increasingly, mindfulness is being incorporated into healthcare, education, and workplace settings as an accessible tool for improving wellbeing and decision-making quality at relatively low cost.`,
choices:["마음챙김 명상은 불교 전통에서 발원한 수행법으로 현대 심리 치료에 적용되고 있다.","마음챙김은 스트레스 감소와 의사결정 능력 향상에 효과적이므로 다양한 분야에서 적극 활용해야 한다.","마음챙김 기반 인지 치료가 우울증 재발 방지에 약물 치료만큼 효과적임이 입증되었다.","직장 내 마음챙김 프로그램이 직원 소진을 줄이고 창의성을 향상시킨다는 사례가 늘고 있다.","마음챙김 앱의 급증이 실제 효과가 없는 프로그램의 확산을 초래하고 있어 품질 관리가 필요하다."],answer:2,
explanation:"마음챙김이 스트레스 감소와 의사결정 개선에 효과적이므로 다양한 분야에서 활용해야 한다는 주장이므로 ②입니다."},

{id:15,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Gender stereotypes shape career aspirations from an early age. Girls who show aptitude for mathematics or engineering often receive subtle discouragement — from parents, teachers, and peers — that steers them away from these fields. Boys who show sensitivity or interest in caregiving face similar pressures in the opposite direction. The result is a labor market where entire professions are skewed by gender in ways that reflect socialized expectations rather than individual capability. Both sexes pay a price when social norms narrow the range of permissible identities and careers.`,
choices:["직업 세계의 성별 격차 해소를 위해 기업의 채용 과정에서 성평등 기준을 강화해야 한다.","여학생의 STEM 분야 진출을 늘리기 위해 롤 모델 제시와 멘토링 프로그램을 확대해야 한다.","성별 임금 격차를 줄이기 위해 동일 노동 동일 임금 원칙을 법적으로 강화해야 한다.","성 고정관념은 양쪽 성별 모두의 직업 선택과 개인 정체성의 가능성을 제한하므로 타파해야 한다.","남성 지배적 직업 문화를 변화시키기 위해 여성 리더십 육성 프로그램이 필요하다."],answer:4,
explanation:"성 고정관념이 양쪽 성별 모두의 직업 선택을 제한한다는 주장이므로 ④입니다."},

{id:16,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`In many educational settings, students learn more from each other than from direct instruction. Peer learning — whether through structured group work, peer tutoring, or collaborative projects — engages students more actively, requires them to articulate and defend their understanding, and exposes them to multiple problem-solving approaches. A student explaining a concept to a classmate must organize and clarify their own thinking, often deepening their own comprehension in the process. Well-designed peer learning activities can achieve better outcomes than equivalent time spent in lecture-based instruction.`,
choices:["소그룹 학습이 효과적이기 위해서는 교사의 적절한 역할 조정과 모니터링이 필수적이다.","또래 학습 활동은 학생들의 의사소통 능력과 협력 역량을 동시에 향상시킨다.","잘 설계된 또래 학습 활동은 강의 중심 수업보다 더 나은 학습 성과를 낼 수 있다.","디지털 협업 도구를 활용한 원격 또래 학습도 대면 학습에 못지않은 효과를 보인다.","교사 주도 수업과 학생 주도 탐구 학습의 균형 있는 조합이 최적의 학습 효과를 낸다."],answer:3,
explanation:"잘 설계된 또래 학습이 강의 중심 수업보다 더 나은 성과를 낼 수 있다는 주장이므로 ③입니다."},

{id:17,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Democratic governance depends on citizens who can assess the credibility of sources, distinguish fact from opinion, evaluate the logic of arguments, and resist manipulation. These capacities — collectively called civic literacy — are not acquired automatically but must be taught. Many countries have reduced civics education in favor of tested academic subjects, producing generations that are knowledgeable in narrow domains but ill-equipped to participate meaningfully in democratic processes. Restoring civic education to the curriculum is not optional for democracies that wish to remain functional.`,
choices:["민주주의를 강화하기 위해서는 선거 제도 개혁과 함께 정치 참여 기회를 확대해야 한다.","시민 교육은 민주적 참여에 필수적이므로 교육 과정에서 반드시 복원되어야 한다.","디지털 미디어 리터러시 교육이 현대 시민 교육의 핵심으로 부상해야 한다.","시민 의식 향상을 위해 학교 교육뿐 아니라 지역 사회 차원의 참여 기회도 늘려야 한다.","정치적 양극화가 심화되는 환경에서 균형 잡힌 시민 교육 내용을 설계하기가 갈수록 어려워지고 있다."],answer:2,
explanation:"시민 교육이 민주적 참여에 필수적이므로 교육 과정에서 반드시 복원되어야 한다는 주장이므로 ②입니다."},

{id:18,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Loneliness affects roughly a quarter of adults in many high-income countries, with particularly high rates among the elderly, young adults, and those with disabilities. The health consequences rival those of smoking fifteen cigarettes a day, including elevated risks of heart disease, dementia, and premature death. Yet loneliness remains largely invisible to policy. The UK has appointed a Minister for Loneliness, recognizing it as a public health crisis requiring systemic responses: built environments that encourage interaction, social prescribing by healthcare providers, and community programs targeting isolated populations.`,
choices:["고독감은 개인의 성격 특성이나 사회 기술의 문제로 치료보다 예방 교육이 우선되어야 한다.","외로움은 개인 차원을 넘어 체계적 접근이 필요한 공중 보건 위기로 인식하고 대응해야 한다.","노인 인구의 사회적 고립 문제를 해결하기 위해 세대 간 교류 프로그램을 확대해야 한다.","도시 계획 단계에서부터 주민 간 자연스러운 교류를 촉진하는 설계 원칙을 적용해야 한다.","원격 근무 확산으로 인한 직장인의 고독감 증가에 기업이 적극적으로 대응해야 한다."],answer:2,
explanation:"외로움을 개인 문제가 아닌 체계적 대응이 필요한 공중 보건 위기로 봐야 한다는 주장이므로 ②입니다."},

{id:19,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Critics of ethical consumerism argue that individual purchasing choices are too small to matter against the scale of corporate and industrial decisions. While it is true that no single consumer's choice moves markets, aggregate consumer behavior shapes what companies produce, where they invest, and how they communicate. The success of organic food, electric vehicles, and sustainable fashion demonstrates that consumer preferences, expressed consistently over time, do shift markets. Ethical consumption is not sufficient on its own — it must be paired with policy advocacy — but it is not irrelevant either.`,
choices:["개인의 소비 선택보다 기업의 환경 책임과 규제 정책이 지속 가능한 변화에 더 중요하다.","소비자 운동과 기업 광고 사이의 정보 비대칭 문제를 해소하기 위해 투명성 규제를 강화해야 한다.","윤리적 소비 선택은 단독으로는 불충분하지만 정책 지지와 함께하면 실질적인 변화를 만들 수 있다.","친환경 제품에 대한 소비자 접근성을 높이기 위해 그린 제품의 세금 혜택을 확대해야 한다.","소비자 교육이 부족하여 그린워싱 제품에 속는 소비자를 보호하는 규제가 필요하다."],answer:3,
explanation:"윤리적 소비는 단독으로는 불충분하지만 정책 지지와 함께하면 실질적 변화를 만든다는 주장이므로 ③입니다."},

{id:20,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Contact theory, developed by Gordon Allport in the 1950s, proposed that prejudice between groups could be reduced through meaningful contact under conditions of equal status, shared goals, and institutional support. Decades of research have broadly supported this prediction: people who have had positive, equal-status contact with members of outgroups consistently show lower levels of prejudice. Schools that deliberately create diverse, collaborative learning environments show measurable reductions in intergroup hostility. Education systems that bring students from different backgrounds into meaningful contact can meaningfully reduce societal divisions.`,
choices:["다문화 교육은 소수 집단의 문화와 역사를 교육 과정에 포함시키는 방향으로 발전해야 한다.","다양한 배경의 학생들이 의미 있는 상호작용을 할 수 있는 교육 환경이 사회적 편견을 줄일 수 있다.","이민자 자녀들이 주류 문화에 통합되도록 적극적으로 지원하는 교육 정책이 필요하다.","문화적 다양성이 높은 학교에서 집단 갈등이 발생할 위험이 있어 갈등 조정 전문가 배치가 필요하다.","다문화 사회에서의 시민 정체성 교육이 개별 집단 정체성 교육보다 국가 통합에 더 효과적이다."],answer:2,
explanation:"다양한 배경의 학생들이 의미 있게 교류할 수 있는 교육 환경이 편견을 줄일 수 있다는 주장이므로 ②입니다."}
]},

,{id:'R',name:'세트 R · 내용 일치 Ⅰ',desc:'인물·생물 관련 지문의 내용 일치 파악 유형',color:'#1d4ed8',time:45*60,questions:[
{id:1,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`Marie Curie was born Maria Sklodowska in Warsaw, Poland, in 1867. Unable to attend university in Poland because women were excluded, she moved to Paris at age 24 to study at the Sorbonne. She became the first woman to earn a doctorate in physics in France. Curie discovered two new elements — polonium (named after her homeland) and radium — and won the Nobel Prize in Physics in 1903, which she shared with her husband Pierre and physicist Henri Becquerel. In 1911 she won a second Nobel Prize, this time in Chemistry, becoming the first person to receive the Nobel Prize in two different sciences. She died in 1934 from aplastic anemia, almost certainly caused by her prolonged exposure to radiation.`,
choices:["그녀는 폴란드의 대학에서 물리학 박사 학위를 취득하였다.","그녀는 노벨 물리학상을 남편과 공동 수상하였다.","그녀가 발견한 원소 라듐은 조국의 이름을 따서 명명되었다.","그녀는 같은 분야에서 노벨상을 두 번 수상하였다.","그녀는 1934년 방사선 노출과 무관한 원인으로 사망하였다."],answer:2,
explanation:"그녀는 노벨 물리학상을 남편 Pierre와 Becquerel과 공동 수상하였습니다. ②가 일치합니다."},

{id:2,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`Charles Darwin was born in Shrewsbury, England, in 1809 into a wealthy and well-connected family. He initially studied medicine at the University of Edinburgh but found the experience deeply unpleasant and switched to Cambridge to study theology, intending to become a clergyman. His landmark five-year voyage on HMS Beagle (1831–1836) took him around the world, during which he collected extensive specimens and made detailed observations. He did not publish his theory of evolution by natural selection until 1859, having spent over twenty years gathering evidence and refining his ideas. His book On the Origin of Species sold out on its first day of publication.`,
choices:["다윈은 에든버러 대학에서 신학을 전공하였다.","비글호 항해는 약 5년간 지속되었다.","다윈은 항해를 마친 직후 자연선택 이론을 발표하였다.","'종의 기원'은 출판 후 첫 주가 지나서야 완판되었다.","다윈의 가족은 사회적으로 잘 알려지지 않은 중산층이었다."],answer:2,
explanation:"비글호 항해는 1831–1836년으로 약 5년간 지속되었습니다. ②가 일치합니다."},

{id:3,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The blue whale is the largest animal known to have ever existed, reaching lengths of up to 30 meters and weights of up to 200 metric tons. Despite their enormous size, blue whales feed almost exclusively on tiny crustaceans called krill, consuming up to 4 metric tons of krill per day during feeding season. They are found in all the world's oceans and undertake some of the longest migrations of any mammal. Blue whales communicate through extremely low-frequency vocalizations that can travel thousands of kilometers underwater. Their populations were decimated by commercial whaling in the twentieth century; they are currently listed as endangered, with an estimated global population of 10,000 to 25,000.`,
choices:["대왕고래는 지금까지 존재했던 것으로 알려진 동물 중 가장 크다.","대왕고래는 하루에 최대 4톤의 먹이를 먹는다.","대왕고래는 크릴 외에도 작은 물고기를 주요 식량으로 삼는다.","대왕고래는 수천 킬로미터를 이동하는 초저주파 소리를 낸다.","대왕고래의 개체 수는 20세기 포경으로 크게 감소하였다."],answer:3,
explanation:"지문에서 대왕고래는 거의 전적으로 크릴만 먹는다고 하였으므로 ③이 일치하지 않습니다."},

{id:4,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`Ada Lovelace, born in 1815, was the daughter of the poet Lord Byron, though she never knew her father. She was educated in mathematics and science, which was unusual for women of her era. Working with mathematician Charles Babbage on his proposed Analytical Engine — a mechanical general-purpose computer — she wrote what is now considered the first computer algorithm, intended to calculate Bernoulli numbers. She recognized that the machine had applications beyond mere calculation. She died at age 36 from uterine cancer. The programming language Ada, developed in the 1980s for the US Department of Defense, was named in her honor.`,
choices:["에이다 러브레이스는 아버지 바이런과 함께 성장하였다.","그녀는 찰스 배비지의 기계와 함께 최초의 컴퓨터 알고리즘을 작성하였다.","그녀는 해석 기관이 계산 이외의 용도로는 활용될 수 없다고 보았다.","그녀는 40세 이상 살았다.","그녀의 이름을 딴 프로그래밍 언어는 1970년대에 개발되었다."],answer:2,
explanation:"그녀는 배비지의 해석 기관을 위해 최초의 컴퓨터 알고리즘을 작성하였습니다. ②가 일치합니다."},

{id:5,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The African elephant is the largest land animal on Earth, with males reaching up to 3.3 meters at the shoulder and weighing up to 6 metric tons. Elephants live in matriarchal family groups led by the oldest female, called the matriarch, whose accumulated knowledge is critical to the herd's survival during droughts or migrations. They are highly intelligent animals with exceptional long-term memory, capable of recognizing hundreds of individuals and mourning deceased companions. Elephants are classified into two species — the African bush elephant and the African forest elephant — both of which are endangered due to poaching for ivory and habitat loss.`,
choices:["아프리카코끼리는 지구상 가장 큰 육지 동물이다.","코끼리 무리는 가장 나이 많은 암컷이 이끄는 모계 집단이다.","코끼리는 수백 명의 개체를 인식할 수 있는 장기 기억 능력을 가진다.","아프리카코끼리는 한 종으로 분류된다.","코끼리는 상아 밀렵과 서식지 손실로 멸종 위기에 처해 있다."],answer:4,
explanation:"지문에서 아프리카코끼리는 아프리카 사바나 코끼리와 아프리카 숲 코끼리 두 종으로 분류된다고 하였으므로 ④가 일치하지 않습니다."},

{id:6,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`Nikola Tesla was born in 1856 in Serbia (then part of the Austrian Empire) and emigrated to the United States in 1884, initially working for Thomas Edison before a famous and bitter falling-out over compensation. Tesla developed the alternating current (AC) electrical system that became the global standard, defeating Edison's direct current (DC) system in what is sometimes called the 'War of Currents.' Despite holding nearly 300 patents, Tesla died penniless in a New York hotel room in 1943. His work was largely forgotten for decades before experiencing a popular revival in the late twentieth century.`,
choices:["테슬라는 에디슨과 평생 우호적인 협력 관계를 유지하였다.","테슬라가 개발한 직류 시스템이 현재 세계 표준으로 자리잡았다.","테슬라는 미국에 이민한 후 처음에 에디슨 밑에서 일하였다.","테슬라는 약 100개의 특허를 보유하였다.","테슬라는 1943년 뉴욕에서 부유한 상태로 사망하였다."],answer:3,
explanation:"테슬라는 미국 이민 후 처음에 에디슨 밑에서 일하였다고 서술되어 있으므로 ③이 일치합니다."},

{id:7,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The cheetah is the fastest land animal, capable of reaching speeds of up to 112 km/h (70 mph) in short bursts. Unlike other big cats, cheetahs cannot roar; instead, they communicate through chirps, purrs, and yelps. Cheetahs are diurnal hunters, typically hunting during the early morning and late afternoon. After a high-speed chase, they need up to 30 minutes to recover before eating because their body temperature rises dangerously high. Cheetahs have a distinctive tear-shaped black mark running from the inner corner of each eye down the sides of the nose, which is thought to reduce glare and aid in focusing on prey.`,
choices:["치타는 육상 동물 중 가장 빠르다.","치타는 다른 대형 고양잇과 동물과 달리 으르렁거리지 못한다.","치타는 야행성으로 주로 밤에 사냥한다.","치타는 빠른 추격 후 식사 전 최대 30분간 휴식이 필요하다.","치타의 눈 아래 검은 무늬는 눈부심을 줄이는 데 도움이 된다고 여겨진다."],answer:3,
explanation:"지문에서 치타는 낮에 주로 사냥하는 주행성 동물이라고 하였으므로 ③이 일치하지 않습니다."},

{id:8,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`Alan Turing was a British mathematician and computer scientist who made foundational contributions to theoretical computer science and artificial intelligence. During World War II, he played a central role at Bletchley Park in breaking the German Enigma code, work widely credited with shortening the war by several years. In 1950, he proposed the 'Turing Test' as a measure of machine intelligence. Despite his enormous contributions to the Allied war effort, Turing was prosecuted in 1952 for homosexual acts, then illegal in Britain, and was chemically castrated as a result. He died in 1954; the cause of death remains disputed, with some historians questioning the official verdict of suicide. He received a royal pardon posthumously in 2013.`,
choices:["튜링은 2차 세계대전 중 프랑스 암호 해독에 참여하였다.","그는 1952년 당시 영국 법상 불법이었던 행위로 기소되었다.","튜링 테스트는 기계 지능을 측정하기 위해 1960년에 제안되었다.","튜링은 살아있는 동안 영국 왕실로부터 사면을 받았다.","일부 역사학자들은 그의 공식 사망 원인에 의문을 제기하지 않는다."],answer:2,
explanation:"그는 1952년 당시 영국에서 불법이었던 동성 행위로 기소되었으므로 ②가 일치합니다."},

{id:9,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The emperor penguin is the tallest and heaviest of all penguin species, standing up to 1.2 meters tall and weighing up to 45 kilograms. Unlike most birds, emperor penguins breed during the Antarctic winter, with females laying a single egg and then departing to the sea to feed. The males incubate the egg on their feet, huddled together in large groups for warmth, fasting for up to four months. When the chicks hatch, the fathers regurgitate a special secretion to feed them until the females return. Emperor penguins can dive to depths of over 500 meters and hold their breath for over 20 minutes.`,
choices:["황제펭귄은 모든 펭귄 종 중에서 가장 크고 무겁다.","황제펭귄은 남극의 여름에 번식한다.","수컷이 알을 품는 동안 최대 4개월간 먹지 않는다.","황제펭귄은 500미터 이상의 깊이까지 잠수할 수 있다.","새끼가 부화하면 수컷이 특별한 분비물을 토해 먹인다."],answer:2,
explanation:"지문에서 황제펭귄은 남극의 겨울에 번식한다고 하였으므로 ②가 일치하지 않습니다."},

{id:10,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`Rosalind Franklin was a British chemist and X-ray crystallographer whose work was critical to understanding the structures of DNA, RNA, viruses, coal, and graphite. Her X-ray photograph of DNA, known as Photo 51, provided key evidence for the double helix structure. Her colleague Maurice Wilkins shared this image with James Watson without her knowledge or consent. Watson and Crick used it alongside her published work to develop their double helix model. The 1962 Nobel Prize in Physiology or Medicine was awarded to Watson, Crick, and Wilkins — but not Franklin, who had died of ovarian cancer in 1958, four years before the Nobel was awarded.`,
choices:["프랭클린은 자신의 사진 51호를 왓슨에게 직접 제공하였다.","프랭클린은 1962년 노벨 생리의학상을 왓슨, 크릭과 공동 수상하였다.","프랭클린은 노벨상이 수여되기 4년 전에 사망하였다.","프랭클린은 DNA 구조 연구만을 전담하였다.","모리스 윌킨스는 프랭클린의 동의를 받고 사진 51호를 왓슨과 공유하였다."],answer:3,
explanation:"프랭클린은 1958년에 사망하였고 노벨상은 1962년에 수여되었으므로, 4년 전에 사망한 ③이 일치합니다."},

{id:11,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The octopus is one of the most intelligent invertebrates on Earth. It has three hearts, blue blood (due to copper-based hemocyanin), and eight arms lined with suckers that contain both tactile and chemical receptors. Octopuses can change the color, pattern, and texture of their skin in milliseconds, primarily for camouflage and communication. They have a relatively short lifespan — most species live one to two years — and die shortly after reproduction. Despite their intelligence, they are largely solitary animals. Some species, such as the mimic octopus, can imitate the appearance of other marine animals including lionfish and flatfish.`,
choices:["문어는 세 개의 심장을 가지고 있다.","문어의 피는 철분 기반 색소 때문에 파란색이다.","문어는 피부의 색깔, 무늬, 질감을 빠르게 바꿀 수 있다.","문어는 대부분 1~2년의 비교적 짧은 수명을 가진다.","미믹 문어는 다른 해양 동물의 외모를 흉내 낼 수 있다."],answer:2,
explanation:"지문에서 문어의 피는 구리 기반 헤모시아닌 때문에 파란색이라고 하였으므로, 철분 기반이라고 한 ②가 일치하지 않습니다."},

{id:12,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`Isaac Newton was born prematurely on Christmas Day 1642 in Woolsthorpe, England. He was a sickly infant not expected to survive. He attended the University of Cambridge beginning in 1661, but the university was closed due to plague in 1665, and Newton returned home to Woolsthorpe. During the eighteen months he spent there, he made his most significant discoveries: calculus, the laws of motion, and the theory of universal gravitation. He later become Warden and then Master of the Royal Mint, a position he held for the last thirty years of his life and in which he took an active role prosecuting counterfeiters.`,
choices:["뉴턴은 정상 체중으로 태어난 건강한 유아였다.","뉴턴은 1665년 전염병으로 케임브리지 대학이 폐쇄될 때 가장 중요한 발견을 이루었다.","뉴턴의 가장 중요한 발견은 케임브리지에서 이루어졌다.","뉴턴은 조폐국 관련 업무에는 소극적인 자세를 취하였다.","뉴턴은 성탄절인 1642년에 건강하게 태어났다."],answer:2,
explanation:"1665년 전염병으로 케임브리지가 폐쇄되었을 때 뉴턴은 귀향하여 가장 중요한 발견을 하였으므로 ②가 일치합니다."},

{id:13,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The hummingbird is the only bird capable of sustained hovering flight. To hover, hummingbirds beat their wings up to 80 times per second — so fast that the wings appear as a blur and produce the humming sound that gives the bird its name. This extreme exertion requires an enormous metabolic rate: hummingbirds have the highest heart rate of any bird, up to 1,260 beats per minute during flight, and must consume approximately their own body weight in nectar each day to sustain it. At night, they enter a state of torpor — a kind of deep sleep with dramatically reduced metabolic activity — to conserve energy until morning.`,
choices:["벌새는 지속적으로 정지 비행을 할 수 있는 유일한 새이다.","벌새는 날개를 초당 최대 80번 퍼덕인다.","벌새는 비행 중 최대 1,260 bpm의 심박수를 가진다.","벌새는 에너지 보존을 위해 낮에 동면 상태에 들어간다.","벌새는 매일 자신의 체중에 해당하는 꿀을 소비해야 한다."],answer:4,
explanation:"지문에서 벌새는 밤에 혼수상태(torpor)에 들어간다고 하였으므로, 낮에 들어간다고 한 ④가 일치하지 않습니다."},

{id:14,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`Mahatma Gandhi was born Mohandas Karamchand Gandhi in 1869 in Porbandar, a coastal town in present-day Gujarat, India. He trained as a lawyer in London and then spent twenty-one years in South Africa, where he first developed his philosophy of nonviolent resistance, which he called Satyagraha. Returning to India in 1915, he led major campaigns of civil disobedience against British rule, including the famous 1930 Salt March to the sea to protest the British salt monopoly. He was assassinated in January 1948, just months after Indian independence was achieved in August 1947.`,
choices:["간디는 인도의 내륙 도시에서 태어났다.","간디는 남아프리카공화국에서 21년을 보내며 비폭력 저항 철학을 발전시켰다.","간디의 소금 행진은 1920년에 일어났다.","간디는 인도의 독립 이후 10년 이상 생존하였다.","간디는 영국에서 법학 공부를 한 후 바로 인도로 돌아왔다."],answer:2,
explanation:"간디는 남아프리카공화국에서 21년을 보내며 Satyagraha 철학을 발전시켰으므로 ②가 일치합니다."},

{id:15,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The mantis shrimp is a marine crustacean renowned for two extraordinary traits. First, its club-like appendages can strike with the speed of a bullet — accelerating at 10,000 g — delivering a blow powerful enough to break aquarium glass. Second, mantis shrimp possess the most complex visual system of any known animal, with up to 16 types of photoreceptors (humans have three). Surprisingly, research suggests they process color information peripherally rather than centrally, making their color discrimination actually inferior to humans in some ways despite their superior receptor count. Mantis shrimp are also notable for long-term monogamous pair bonding, which is unusual among crustaceans.`,
choices:["사마귀 새우의 타격 부속지는 총알에 맞먹는 속도로 가속한다.","사마귀 새우는 알려진 동물 중 가장 복잡한 시각 시스템을 가지고 있다.","사마귀 새우는 인간보다 많은 16가지 유형의 광수용체를 가지고 있다.","연구에 따르면 사마귀 새우의 색 식별 능력은 인간보다 항상 뛰어나다.","사마귀 새우는 갑각류 중에서 드물게 장기적인 일부일처 관계를 맺는다."],answer:4,
explanation:"지문에서 사마귀 새우의 색 식별 능력은 어떤 면에서 인간보다 열등하다고 하였으므로 ④가 일치하지 않습니다."},

{id:16,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`Harriet Tubman was born into slavery in Maryland around 1822. After escaping north in 1849, she returned to the south at least thirteen times to rescue approximately seventy enslaved people through the Underground Railroad — a secret network of routes and safe houses. During the Civil War, she served as a spy and scout for the Union Army and led a raid that liberated more than 700 enslaved people. Despite her extraordinary service, she never received a military pension during her lifetime. She was posthumously awarded a Congressional Gold Medal, and her image will eventually appear on the US twenty-dollar bill.`,
choices:["터브먼은 1849년 탈출 후 남부로 돌아가지 않았다.","그녀는 지하 철도를 통해 약 70명의 노예를 구출하였다.","그녀는 생전에 군사 연금을 받았다.","그녀는 남북전쟁 중 연합군을 위한 스파이로 활동하지 않았다.","그녀의 이미지는 미국 50달러 지폐에 실릴 예정이다."],answer:2,
explanation:"그녀는 지하 철도를 통해 약 70명을 구출하였으므로 ②가 일치합니다."},

{id:17,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`Dolphins are highly intelligent marine mammals known for their sophisticated social behavior, complex communication, and problem-solving abilities. They are part of the cetacean family, which also includes whales and porpoises. Dolphins breathe through a blowhole on top of their heads and must surface regularly to breathe air; they cannot breathe underwater. They communicate through a complex system of clicks, whistles, and body language, and each individual dolphin develops a unique signature whistle that functions like a name. Bottlenose dolphins, the most widely studied species, have been shown to recognize themselves in mirrors — a capacity previously thought unique to great apes and humans.`,
choices:["돌고래는 아가미를 통해 수중에서 직접 산소를 흡수한다.","돌고래는 클릭, 휘파람, 몸짓으로 구성된 복잡한 의사소통 체계를 사용한다.","각 돌고래는 이름과 같은 기능을 하는 고유한 특징적 휘파람을 발전시킨다.","큰돌고래는 거울 속의 자신을 인식하는 능력을 보여 주었다.","돌고래는 고래목에 속하며 고래 및 쥐돌고래와 같은 과이다."],answer:1,
explanation:"지문에서 돌고래는 머리 위의 분기공을 통해 공기를 호흡하며 수중에서 숨을 쉴 수 없다고 하였으므로 ①이 일치하지 않습니다."},

{id:18,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`Florence Nightingale was born into a wealthy British family in 1820 and was named after the Italian city of Florence, where she was born. Against considerable family opposition, she trained as a nurse and went to Scutari in Ottoman Turkey during the Crimean War (1853–1856), where she discovered that more soldiers were dying from preventable diseases than from battle wounds. By implementing sanitation reforms — clean water, proper drainage, ventilation — she reduced the death rate from 42% to around 2% within months. She later founded the first secular nursing school at St Thomas' Hospital in London in 1860.`,
choices:["나이팅게일은 이탈리아 피렌체에서 태어났으며 태어난 도시의 영어식 이름을 따서 이름 지어졌다.","크림 전쟁에서 전투 부상으로 인한 사망이 예방 가능한 질병에 의한 사망보다 많았다.","그녀는 위생 개혁을 통해 사망률을 42%에서 약 2%로 줄였다.","그녀는 가족의 전폭적인 지지를 받아 간호사 교육을 받았다.","나이팅게일은 1870년 런던 성 토마스 병원에 최초의 세속적 간호학교를 설립하였다."],answer:3,
explanation:"그녀는 위생 개혁으로 사망률을 42%에서 약 2%로 줄였으므로 ③이 일치합니다."},

{id:19,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The polar bear is the largest land predator on Earth, with adult males typically weighing between 350 and 700 kilograms. They are classified as marine mammals because they spend most of their lives on sea ice hunting ringed seals, their primary prey. Polar bears are excellent swimmers, capable of swimming distances of hundreds of kilometers, although long swims are energetically costly and dangerous for cubs. Their fur appears white but is actually transparent, trapping sunlight to help keep the bears warm. Climate change is the primary threat to polar bears, as melting sea ice reduces their hunting season and forces longer fasts.`,
choices:["북극곰은 지구상에서 가장 큰 육상 포식자이다.","북극곰은 해양 포유류로 분류된다.","북극곰의 털은 실제로 투명하지만 흰색으로 보인다.","북극곰은 새끼와 함께 장거리 수영을 해도 에너지 소모가 거의 없다.","해빙 감소가 북극곰의 사냥 기간을 줄이는 주요 위협이다."],answer:4,
explanation:"지문에서 장거리 수영은 새끼에게 에너지 비용이 크고 위험하다고 하였으므로 ④가 일치하지 않습니다."},

{id:20,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`Leonardo da Vinci was born in 1452 near the town of Vinci in the Republic of Florence. He was the illegitimate son of a Florentine notary and a peasant woman, and received no formal education in Latin or mathematics as a child. He was apprenticed to artist Andrea del Verrocchio at around age 14. His most famous paintings, the Mona Lisa and The Last Supper, were created in the late fifteenth and early sixteenth centuries. He filled thousands of pages of notebooks with observations on anatomy, engineering, geology, botany, and hydrodynamics. He never published these notes during his lifetime, and they were scattered across Europe after his death.`,
choices:["레오나르도 다빈치는 피렌체 시내에서 태어났다.","그는 어린 시절 라틴어와 수학을 정규 교육에서 배웠다.","그는 약 14세에 안드레아 델 베로키오의 공방에서 도제 생활을 시작하였다.","'최후의 만찬'은 그의 인생 후반인 17세기에 그려졌다.","그는 생전에 수천 페이지에 달하는 노트를 출판하였다."],answer:3,
explanation:"레오나르도는 약 14세에 베로키오에게 도제로 들어갔으므로 ③이 일치합니다."}
]},

{id:1,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The Great Wall of China is not a single continuous structure but a series of walls built over many centuries by different Chinese states and dynasties. Construction began as early as the 7th century BCE, though the most famous sections were built during the Ming Dynasty (1368–1644). At its greatest extent, the wall and its associated defenses stretched over 21,000 kilometers. Contrary to popular belief, the wall is not visible from space with the naked eye; the claim has been widely debunked. The wall was primarily designed to protect against nomadic invasions from the north, and it also served as a transportation corridor and means of controlling trade.`,
choices:["만리장성은 단일한 연속 구조물로 이루어져 있다.","가장 유명한 구간은 한 왕조 때 건설되었다.","만리장성은 총 2만 1천 킬로미터가 넘는 방어 체계를 갖추었다.","만리장성은 우주에서 육안으로 볼 수 있다는 것이 과학적으로 증명되었다.","만리장성은 주로 남쪽으로부터의 침입을 막기 위해 설계되었다."],answer:3,
explanation:"만리장성과 관련 방어물의 총 연장은 21,000킬로미터를 넘는다고 하였으므로 ③이 일치합니다."},

{id:2,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The Titanic was a British ocean liner operated by the White Star Line that sank on April 15, 1912, after striking an iceberg during its maiden voyage from Southampton to New York City. It carried 2,224 passengers and crew; approximately 1,500 died, making it one of the deadliest peacetime maritime disasters. The ship was declared 'unsinkable' in promotional materials, not by its designers. Lifeboats were insufficient for all passengers because they were stowed in a way to avoid cluttering the deck, not because designers believed the ship could not sink. The wreck was discovered by Robert Ballard in 1985, lying in two pieces on the ocean floor at a depth of approximately 3,800 meters.`,
choices:["타이타닉호는 영국 화이트 스타 라인이 운영하였다.","타이타닉호는 뉴욕으로의 첫 항해 중 침몰하였다.","타이타닉호 침몰로 약 1,500명이 사망하였다.","타이타닉호의 설계자들이 배가 절대 가라앉지 않는다고 주장하였다.","타이타닉호의 잔해는 1985년 로버트 발라드에 의해 발견되었다."],answer:4,
explanation:"지문에서 '침몰하지 않는다'는 표현은 홍보 자료에서 나온 것이지 설계자들의 주장이 아니라고 하였으므로 ④가 일치하지 않습니다."},

{id:3,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The Olympic Games originated in ancient Olympia, Greece, held in honor of Zeus starting around 776 BCE. The ancient Olympics were held every four years and included events such as running, wrestling, chariot racing, and the pentathlon. All free male Greek citizens were eligible to compete; women were excluded from competing and, according to some ancient sources, from watching. The games were abolished in 393 CE by the Roman Emperor Theodosius I. The modern Olympics were revived in Athens in 1896 through the efforts of Pierre de Coubertin, a French educator who modeled them partly on English public school sports.`,
choices:["고대 올림픽은 헤라 여신을 기리기 위해 개최되었다.","고대 올림픽에는 모든 그리스인이 성별에 관계없이 참가할 수 있었다.","고대 올림픽은 로마 황제 테오도시우스 1세에 의해 폐지되었다.","현대 올림픽은 1900년 파리에서 처음 부활하였다.","쿠베르탱은 독일 학교 체육을 모델로 현대 올림픽을 구상하였다."],answer:3,
explanation:"고대 올림픽은 로마 황제 테오도시우스 1세에 의해 393 CE에 폐지되었으므로 ③이 일치합니다."},

{id:4,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The International Space Station (ISS) is a modular space station in low Earth orbit that is a joint project among five space agencies: NASA (USA), Roscosmos (Russia), JAXA (Japan), ESA (Europe), and CSA (Canada). Assembly began in 1998 and has been continuously inhabited since November 2000, making it the longest continuous human presence in space. The ISS orbits at an altitude of approximately 400 kilometers and completes 15.5 orbits of Earth per day. It spans the area of an American football field. Astronauts typically stay for missions of about six months, though some have stayed longer for research on the effects of long-duration spaceflight.`,
choices:["국제우주정거장은 5개 우주기관의 공동 프로젝트이다.","국제우주정거장은 2000년 11월부터 지속적으로 사람이 거주하고 있다.","국제우주정거장은 고도 약 400킬로미터에서 하루에 약 15.5번 지구를 선회한다.","국제우주정거장의 건설은 1988년에 시작되었다.","우주비행사들은 보통 약 6개월간 임무를 수행한다."],answer:4,
explanation:"지문에서 조립은 1998년에 시작되었다고 하였으므로 1988년이라고 한 ④가 일치하지 않습니다."},

{id:5,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The Amazon River is the largest river in the world by discharge volume, releasing about 20% of all freshwater that flows into the world's oceans. While the Nile is generally considered longer, some measurements place the Amazon as the longest river as well, depending on how the source is defined. The Amazon basin covers approximately 7 million square kilometers — about 40% of South America — and contains the world's largest tropical rainforest. The river is home to thousands of fish species, including the piranha and the freshwater pink river dolphin. The city of Manaus, Brazil, lies approximately 1,500 kilometers from the Amazon's mouth but is a major port accessible to ocean-going ships.`,
choices:["아마존강은 유량 기준으로 나일강보다 길다.","아마존강의 담수 방류량은 전 세계 해양으로 흘러드는 담수의 약 20%를 차지한다.","아마존 유역은 남아메리카 면적의 약 60%를 차지한다.","마나우스는 아마존강 하구에서 약 500킬로미터 떨어져 있다.","아마존강에는 민물 분홍강돌고래가 서식하지 않는다."],answer:2,
explanation:"아마존강의 담수 방류량은 전 세계 해양으로 흘러드는 담수의 약 20%를 차지한다고 하였으므로 ②가 일치합니다."},

{id:6,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The Chernobyl disaster occurred on April 26, 1986, at Reactor No. 4 of the Chernobyl Nuclear Power Plant in Soviet Ukraine, during a safety test that went wrong. The explosion and subsequent fires released large quantities of radioactive particles into the atmosphere, spreading across much of the western USSR and Europe. The Soviet government initially attempted to conceal the scale of the disaster. The nearby city of Pripyat, home to about 49,000 people, was evacuated 36 hours after the explosion. An exclusion zone of 30 kilometers was established around the plant. The exact death toll remains disputed; direct deaths were relatively few, but cancers and other health effects are estimated to number in the tens of thousands.`,
choices:["체르노빌 사고는 1986년 4월 안전 실험 중에 발생하였다.","소련 정부는 처음에 사고의 규모를 은폐하려 하였다.","프리피야트 시는 사고 발생 약 36시간 후에 대피하였다.","발전소 주변에 50킬로미터 반경의 출입 금지 구역이 설정되었다.","직접적 사망자 수는 비교적 적었으나 암 등 건강 영향은 수만 명에 달하는 것으로 추산된다."],answer:4,
explanation:"지문에서 출입 금지 구역은 30킬로미터 반경으로 설정되었다고 하였으므로 50킬로미터라고 한 ④가 일치하지 않습니다."},

{id:7,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The Colosseum in Rome is one of the most iconic structures of the ancient world. Its construction began under Emperor Vespasian around 70–72 CE and was completed by his son Titus in 80 CE. The amphitheater could hold between 50,000 and 80,000 spectators and hosted gladiatorial contests, animal hunts, public executions, and mock sea battles. Beneath the arena floor was a complex underground network of tunnels and chambers called the hypogeum, used to house animals and gladiators before they entered the arena. The Colosseum was damaged by earthquakes in 847 and 1231 CE and has been used as a source of building materials for other Roman structures.`,
choices:["콜로세움 건설은 티투스 황제에 의해 시작되었다.","콜로세움은 5만에서 8만 명의 관중을 수용할 수 있었다.","콜로세움 지하에는 동물과 검투사를 수용하는 통로와 방이 없었다.","콜로세움은 8세기부터 다른 로마 건물의 건축 자재 공급원으로 사용되었다.","콜로세움은 완공 후 200년간 지진 피해를 입지 않았다."],answer:2,
explanation:"콜로세움은 5만에서 8만 명의 관중을 수용할 수 있었으므로 ②가 일치합니다."},

{id:8,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The United Nations was established in 1945, after the end of World War II, with 51 founding member states. Its headquarters are located in New York City on land donated by the Rockefeller family. The UN has six principal organs: the General Assembly, the Security Council, the Economic and Social Council, the Trusteeship Council, the International Court of Justice, and the Secretariat. The Security Council has five permanent members — the United States, the United Kingdom, France, Russia, and China — each with veto power. Currently, the UN has 193 member states, making it the most universal intergovernmental organization in the world.`,
choices:["유엔은 1945년 2차 세계대전 이후 51개 창립 회원국으로 설립되었다.","유엔 본부는 록펠러 가문이 기증한 토지에 뉴욕 시에 위치한다.","유엔 안전보장이사회에는 거부권을 가진 4개의 상임이사국이 있다.","국제사법재판소는 유엔의 6개 주요 기관 중 하나이다.","현재 유엔은 193개 회원국을 보유하고 있다."],answer:3,
explanation:"지문에서 안전보장이사회 상임이사국은 5개국이라고 하였으므로 4개라고 한 ③이 일치하지 않습니다."},

{id:9,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The Galápagos Islands are an archipelago of volcanic islands in the Pacific Ocean, approximately 906 kilometers west of Ecuador, to which they belong. They are home to a remarkable array of endemic species, including the Galápagos giant tortoise, the marine iguana, and Darwin's finches. Charles Darwin visited the islands in 1835 during the voyage of the Beagle and observed the variation in finch beak shapes between islands — observations that later contributed to his theory of natural selection. The islands were declared a UNESCO World Heritage Site in 1978 and are protected as a national park by Ecuador.`,
choices:["갈라파고스 제도는 태평양의 페루령 화산 군도이다.","찰스 다윈은 비글호 항해 중 1835년에 갈라파고스 제도를 방문하였다.","갈라파고스 제도는 1990년에 유네스코 세계 유산으로 지정되었다.","갈라파고스 제도에는 해양 이구아나가 서식하지 않는다.","다윈의 핀치 부리 관찰은 그의 진화 이론 발전에 기여하지 않았다."],answer:2,
explanation:"다윈은 1835년 비글호 항해 중 갈라파고스를 방문하였으므로 ②가 일치합니다."},

{id:10,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The Louvre Museum in Paris is the world's largest art museum by area and the most visited museum in the world, attracting approximately 9 million visitors per year in normal years. It is housed in a historic palace that served as a royal residence until 1682, when the French court moved to Versailles. The museum was first opened to the public in 1793, during the French Revolution. Its collection includes over 380,000 objects, of which approximately 35,000 are on display. The iconic glass pyramid entrance, designed by architect I. M. Pei, was completed in 1989 and was initially controversial among many Parisians.`,
choices:["루브르 박물관은 세계에서 면적이 가장 큰 미술관이다.","루브르 궁전은 1682년까지 왕실 거처로 사용되었다.","루브르 박물관은 프랑스 혁명 중인 1793년에 처음 대중에게 개방되었다.","루브르 박물관의 유리 피라미드는 1999년에 완공되었다.","유리 피라미드는 처음 완공되었을 때 많은 파리 시민들로부터 논란이 되었다."],answer:4,
explanation:"지문에서 유리 피라미드는 1989년에 완공되었다고 하였으므로 1999년이라고 한 ④가 일치하지 않습니다."},

{id:11,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The World Health Organization (WHO) is a specialized agency of the United Nations responsible for international public health. It was established on April 7, 1948 — a date now commemorated as World Health Day. Its headquarters are in Geneva, Switzerland. The WHO coordinates international responses to health emergencies, sets global health standards, and oversees research and data collection. Its primary budget comes from assessed contributions from member states and voluntary contributions, the latter constituting the majority of its funding. The WHO declared COVID-19 a pandemic on March 11, 2020.`,
choices:["세계보건기구는 1945년에 설립되었다.","세계보건기구의 본부는 뉴욕에 위치한다.","세계보건기구의 예산에서 자발적 기부금이 대부분을 차지한다.","WHO는 COVID-19를 2020년 1월 11일에 팬데믹으로 선언하였다.","세계보건기구 설립일은 세계 보건의 날로 기념되지 않는다."],answer:3,
explanation:"지문에서 자발적 기부금이 WHO 재정의 대부분을 차지한다고 하였으므로 ③이 일치합니다."},

{id:12,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`Pompeii was an ancient Roman city near Naples, Italy, that was destroyed and buried under 4 to 6 meters of volcanic ash and pumice during the eruption of Mount Vesuvius in 79 CE. The city remained largely intact beneath the ash until its rediscovery in 1748, providing an extraordinarily preserved snapshot of Roman life. Excavations have revealed streets, buildings, artwork, and even the preserved bodies of victims who were caught in the eruption. The site is now a UNESCO World Heritage Site. Vesuvius is still considered an active volcano and remains one of the most closely monitored volcanoes in Europe.`,
choices:["폼페이는 서기 79년 베수비오 화산 폭발로 완전히 파괴되었다.","폼페이는 1748년에 재발견되기 전까지 화산재 아래에 대체로 온전한 상태로 남아 있었다.","폼페이 유적지는 유네스코 세계 유산으로 지정되어 있다.","베수비오 화산은 현재 활동이 완전히 멈춘 사화산으로 분류된다.","폼페이는 4~6미터 두께의 화산재와 부석 아래에 묻혔다."],answer:4,
explanation:"지문에서 베수비오는 여전히 활화산으로 간주된다고 하였으므로 사화산이라고 한 ④가 일치하지 않습니다."},

{id:13,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The Hiroshima Peace Memorial Museum is located in Hiroshima, Japan, and documents the atomic bombing of the city on August 6, 1945, which killed between 90,000 and 166,000 people by the end of 1945. The museum preserves artifacts, personal testimonies, and photographs from the bombing. The atomic bomb used on Hiroshima, nicknamed 'Little Boy,' was a uranium bomb. The bomb dropped on Nagasaki three days later, nicknamed 'Fat Man,' used plutonium. Japan surrendered shortly after the bombings, and the formal surrender occurred on September 2, 1945, aboard USS Missouri. The museum received approximately 1.7 million visitors annually before the COVID-19 pandemic.`,
choices:["히로시마 원폭 투하는 1945년 8월 6일에 발생하였다.","히로시마에 투하된 폭탄은 플루토늄 폭탄이었다.","나가사키에 투하된 폭탄은 'Little Boy'라는 별명을 가졌다.","일본의 공식 항복은 USS 미주리함 위에서 9월 2일에 이루어졌다.","히로시마 원폭으로 1945년 말까지 약 50만 명이 사망하였다."],answer:4,
explanation:"일본의 공식 항복은 1945년 9월 2일 USS 미주리함 위에서 이루어졌으므로 ④가 일치합니다."},

{id:14,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The Eiffel Tower was built as the entrance arch for the 1889 World's Fair, held in Paris to celebrate the centennial of the French Revolution. Designed by Gustave Eiffel's engineering company, its construction took two years, two months, and five days. It stands 330 meters tall including the broadcast antenna at the top. When first completed, it was the world's tallest man-made structure, a title it held for 41 years until the Chrysler Building in New York was completed in 1930. Initially controversial among Parisian artists and intellectuals, it was originally intended to be dismantled after 20 years but was saved because of its utility as a radio transmission tower.`,
choices:["에펠탑은 프랑스 혁명 100주년을 기념하는 1889년 세계박람회를 위해 건설되었다.","에펠탑의 건설에는 약 2년 2개월 5일이 소요되었다.","에펠탑은 처음 완공되었을 때 41년간 세계에서 가장 높은 인공 구조물이었다.","에펠탑은 파리 예술가들과 지식인들에게 처음부터 큰 환영을 받았다.","에펠탑은 원래 20년 후 철거될 예정이었으나 무선 통신 안테나로 활용되어 보존되었다."],answer:4,
explanation:"지문에서 에펠탑은 처음에 파리 예술가와 지식인들로부터 논란이 되었다고 하였으므로 환영받았다고 한 ④가 일치하지 않습니다."},

{id:15,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The Black Death was a devastating pandemic that swept through Europe between 1347 and 1351, killing an estimated one-third to one-half of Europe's population — roughly 25 million people. It was caused by the bacterium Yersinia pestis and spread primarily through the bites of fleas that lived on rats. The disease arrived in Europe via trading ships from Asia that docked in Messina, Sicily. The pandemic had profound social consequences: labor shortages gave surviving peasants more bargaining power, accelerating the decline of feudalism, and the Church's inability to explain or stop the plague damaged its authority.`,
choices:["흑사병은 유럽에서 약 100년에 걸쳐 점진적으로 확산되었다.","흑사병의 원인균은 Yersinia pestis이며 쥐에 기생하는 벼룩을 통해 주로 전파되었다.","흑사병은 아프리카에서 온 무역선을 통해 유럽에 처음 도착하였다.","흑사병은 살아남은 농민들의 협상력을 낮추어 봉건제를 강화시켰다.","흑사병으로 유럽에서 약 1억 명이 사망한 것으로 추정된다."],answer:2,
explanation:"흑사병의 원인균은 Yersinia pestis이며 쥐에 기생하는 벼룩을 통해 주로 전파되었으므로 ②가 일치합니다."},

{id:16,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`CERN, the European Organization for Nuclear Research, is the world's largest and most respected centre for scientific research in particle physics. Located near Geneva, Switzerland, on the border with France, it was established in 1954 with 12 founding member states. Its most famous facility is the Large Hadron Collider (LHC), a 27-kilometer circular tunnel in which particles are accelerated to nearly the speed of light and collided. In 2012, CERN scientists announced the discovery of the Higgs boson — often called the 'God particle' — whose existence had been theorized since 1964. The World Wide Web was also invented at CERN in 1989 by Tim Berners-Lee.`,
choices:["CERN은 1954년 12개의 창립 회원국과 함께 설립되었다.","대형 강입자 충돌기는 27킬로미터 길이의 원형 터널이다.","CERN 과학자들은 2012년에 힉스 보손의 발견을 발표하였다.","월드 와이드 웹은 1999년 CERN에서 팀 버너스-리에 의해 발명되었다.","힉스 보손의 존재는 1964년 이후 이론적으로 예측되었다."],answer:4,
explanation:"지문에서 월드 와이드 웹은 1989년 CERN에서 발명되었다고 하였으므로 1999년이라고 한 ④가 일치하지 않습니다."},

{id:17,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The Kyoto Protocol was an international treaty that extended the 1992 United Nations Framework Convention on Climate Change (UNFCCC), committing state parties to reduce greenhouse gas emissions. Adopted in Kyoto, Japan, in December 1997, it came into force in February 2005 after being ratified by 55 countries. Notably, the United States signed but never ratified the protocol, making it one of the few major nations not bound by its commitments. The protocol established the Clean Development Mechanism, allowing developed countries to fund emission-reduction projects in developing countries in exchange for emission credits.`,
choices:["교토 의정서는 1992년에 채택되었다.","교토 의정서는 2000년 2월에 발효되었다.","미국은 교토 의정서를 서명하고 비준하였다.","교토 의정서는 청정 개발 체제를 통해 선진국이 개발도상국에서 감축 프로젝트에 투자할 수 있게 하였다.","교토 의정서는 55개국이 비준하기 전인 1998년에 이미 발효되었다."],answer:4,
explanation:"교토 의정서는 청정 개발 체제(CDM)를 통해 선진국이 개발도상국에서 감축 프로젝트에 투자할 수 있게 하였으므로 ④가 일치합니다."},

{id:18,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The Silk Road was not a single road but a network of trade routes that connected China to the Mediterranean world, covering roughly 6,400 kilometers. Named by German geographer Ferdinand von Richthofen in 1877, the routes were used from roughly the 2nd century BCE to the 15th century CE. Silk was indeed the most prized commodity traded, but merchants also transported spices, glassware, cotton, ivory, and eventually papermaking and gunpowder technology westward. The routes also transmitted ideas, religions (including Buddhism, Islam, and Christianity), and diseases — most notably the bubonic plague that triggered the Black Death.`,
choices:["실크로드는 단일 도로가 아니라 여러 교역로로 이루어진 네트워크였다.","'실크로드'라는 명칭은 1877년 독일 지리학자 리히트호펜에 의해 붙여졌다.","실크로드를 통해 서쪽으로 종이 제조 기술과 화약 기술이 전파되었다.","실크로드는 주로 15세기 이후부터 상업적으로 번성하였다.","흑사병을 일으킨 선페스트도 실크로드를 통해 전파되었다."],answer:4,
explanation:"지문에서 실크로드는 기원전 2세기부터 15세기 CE까지 사용되었다고 하였으므로 15세기 이후라고 한 ④가 일치하지 않습니다."},

{id:19,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The Great Barrier Reef, located off the coast of Queensland, Australia, is the world's largest coral reef system, stretching approximately 2,300 kilometers. It is composed of over 2,900 individual reefs and 900 islands. The reef supports extraordinary biodiversity, including 1,500 species of fish, 4,000 types of mollusk, and six of the world's seven marine turtle species. It was declared a UNESCO World Heritage Site in 1981. Climate-related bleaching events, particularly during the El Niño years of 2016 and 2017, and again in subsequent years, have severely damaged large portions of the reef.`,
choices:["대보초는 세계에서 두 번째로 큰 산호초 시스템이다.","대보초는 약 2,300킬로미터에 걸쳐 뻗어 있다.","대보초에는 세계 7종의 바다거북 중 4종이 서식한다.","대보초는 2000년에 유네스코 세계 유산으로 지정되었다.","2016년 이후 기후 관련 백화 현상은 대보초의 일부에만 영향을 미쳤다."],answer:2,
explanation:"대보초는 약 2,300킬로미터에 걸쳐 있다고 하였으므로 ②가 일치합니다."},

{id:20,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The Marshall Plan, officially the European Recovery Program, was a US initiative enacted in 1948 to aid Western Europe in rebuilding economies after World War II. The US provided over $13 billion (equivalent to about $140 billion today) in economic and technical assistance to 17 European countries over four years. The plan was proposed by Secretary of State George Marshall in a speech at Harvard University in June 1947. The Soviet Union rejected participation and pressured its satellite states to do the same. The plan is widely credited with accelerating Western European economic recovery and helping to contain the spread of communism.`,
choices:["마샬 플랜은 1947년에 공식적으로 시행되기 시작하였다.","마샬 플랜은 조지 마샬이 하버드 대학교 연설에서 제안하였다.","소련은 마샬 플랜 참여를 거부하고 위성 국가들도 마찬가지로 거부하도록 압력을 넣었다.","마샬 플랜은 4년에 걸쳐 17개 유럽 국가에 경제 및 기술 지원을 제공하였다.","마샬 플랜은 공산주의 확산을 억제하는 데 기여한 것으로 널리 평가받는다."],answer:1,
explanation:"지문에서 마샬 플랜은 1948년에 시행되었다고 하였으므로 1947년이라고 한 ①이 일치하지 않습니다."}
]},
