,{id:'M',name:'세트 M · 주제 파악 Ⅱ',desc:'글의 주제를 파악하는 유형 (심리·사회·문화)',color:'#0891b2',time:45*60,questions:[
{id:1,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Research consistently shows that people overestimate the extent to which others share their beliefs and values — a phenomenon called the false consensus effect. When someone holds a strong opinion, they tend to assume it is the majority view, which can lead to poor social judgments and failed predictions. Political campaigns, marketing teams, and policymakers who fall prey to this bias may design strategies suited to a narrow constituency while believing they are appealing to the majority.`,
choices:["how political campaigns use social media to reach voters","the false consensus effect and its impact on social judgment","methods for measuring public opinion through surveys","why people form strong political opinions early in life","the relationship between group identity and consumer behavior"],answer:2,
explanation:"거짓 합의 효과가 사회적 판단에 미치는 영향을 다루므로, 주제는 ②입니다."},

{id:2,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Solitary confinement in prisons — isolation in a small cell for twenty-two to twenty-four hours a day — was designed as a reformative measure but has proven to be deeply damaging. Psychologists report that after only a few days in isolation, prisoners begin to experience hallucinations, panic attacks, and an inability to think coherently. Long-term solitary confinement is now classified by human rights organizations as a form of torture, with effects comparable to severe physical abuse.`,
choices:["the history of prison systems and theories of punishment","the severe psychological harm caused by solitary confinement","rehabilitation programs that reduce recidivism in prisons","the economic cost of maintaining large prison populations","international standards for humane treatment of prisoners"],answer:2,
explanation:"독방 감금이 수감자의 정신 건강에 미치는 심각한 피해를 다루므로, 주제는 ②입니다."},

{id:3,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`When we experience powerful emotions, we tend to search for causes in the most salient features of our environment — even when those features are unrelated to how we feel. Researchers call this misattribution of arousal. In a famous study, men who crossed a fear-inducing suspension bridge rated an interviewer as more attractive than men who crossed a stable bridge, apparently confusing fear-induced excitement with romantic attraction. Our explanations for our own feelings are often more creative than accurate.`,
choices:["how fear responses are processed by the amygdala in the brain","misattribution of arousal and the unreliability of emotional self-knowledge","the role of serotonin and dopamine in regulating mood","cognitive behavioral therapy techniques for managing anxiety","how romantic relationships form among people of similar personality types"],answer:2,
explanation:"감정의 잘못된 귀인(오귀인)과 감정적 자기 인식의 부정확성을 다루므로, 주제는 ②입니다."},

{id:4,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The concept of 'grit' — defined as the combination of passion and perseverance for long-term goals — has attracted enormous attention from educators. Psychologist Angela Duckworth argues that grit predicts academic and professional success more reliably than IQ or talent alone. Critics, however, point out that grit research often overlooks structural factors: children in stable, supportive environments have far more opportunity to develop perseverance than those facing poverty, trauma, or systemic disadvantage.`,
choices:["how intelligence quotient tests are designed and validated","debates over grit as a predictor of success and its social limitations","the neuroscience of motivation and reward-seeking behavior","parenting styles that promote resilience in young children","standardized testing policies in competitive school systems"],answer:2,
explanation:"끈기(grit)가 성공 예측 변수로서 갖는 의미와 그 사회적 한계에 대한 논쟁을 다루므로, 주제는 ②입니다."},

{id:5,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Social comparison — evaluating ourselves relative to others — is a fundamental human tendency that social media platforms have dramatically amplified. When feeds consist primarily of curated highlights of others' lives, users tend to compare these highlights to their own unedited reality, a process that psychologists link to declines in self-esteem, increased depression, and heightened anxiety, particularly among adolescents. The asymmetry between what we show and what we see is a design feature of social media with significant psychological costs.`,
choices:["the business model of major social media companies","how social media amplifies social comparison and harms mental health","cyberbullying prevention programs for schools and parents","the effect of screen time on children's sleep quality","how social media platforms moderate harmful content"],answer:2,
explanation:"SNS가 사회적 비교를 심화시켜 정신 건강에 해를 끼친다는 내용이므로, 주제는 ②입니다."},

{id:6,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Language does more than describe the world — it shapes how we perceive and categorize experience. The Hopi language, for example, encodes time differently from Indo-European languages, raising questions about whether Hopi speakers experience time differently. More concrete evidence comes from color perception: speakers of languages that have distinct words for light blue and dark blue (such as Russian) are faster at discriminating between shades than speakers of English, which uses a single word for both.`,
choices:["the structure of grammar in non-Indo-European languages","how language influences perception and categorization of experience","the importance of learning a second language in childhood","translation challenges between culturally distant languages","how children acquire their native language through imitation"],answer:2,
explanation:"언어가 세상을 인지하고 범주화하는 방식에 영향을 미친다는 내용이므로, 주제는 ②입니다."},

{id:7,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Urban planning in the twentieth century was dominated by the idea of separating land uses — placing homes, offices, and shops in distinct zones connected by highways. This model, critics now argue, produced cities that are car-dependent, socially isolated, and hostile to pedestrians. The new urbanism movement advocates for mixed-use neighborhoods with walkable streets, public transit, and diverse housing types, arguing that the design of the built environment powerfully shapes how people live and connect.`,
choices:["the environmental impact of highway construction on urban areas","critiques of zoning-based urban planning and the case for mixed-use design","the economics of public transportation in rapidly growing cities","how the COVID-19 pandemic changed commuting patterns globally","historic preservation policies in major world cities"],answer:2,
explanation:"단일 용도 구역제(기능 분리) 도시계획 비판과 혼합 용도 설계의 장점을 다루므로, 주제는 ②입니다."},

{id:8,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Nudge theory, developed by behavioral economists Thaler and Sunstein, proposes that the way choices are presented — the 'choice architecture' — profoundly influences which option people select. Making organ donation the default option rather than requiring active enrollment dramatically increases donation rates. Placing healthy foods at eye level in a cafeteria increases their selection without banning unhealthy alternatives. Nudges work by aligning default choices with desired outcomes, preserving freedom while harnessing predictable human tendencies.`,
choices:["the ethics of mandatory organ donation policies around the world","nudge theory and how choice architecture shapes behavior","how advertising influences consumer purchasing decisions","the psychological mechanisms underlying impulse buying behavior","health education campaigns targeting childhood obesity"],answer:2,
explanation:"'넛지 이론'과 선택 설계가 행동에 미치는 영향을 다루므로, 주제는 ②입니다."},

{id:9,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Global migration is often framed as a crisis to be contained, but demographic analysis tells a different story. Many high-income countries face shrinking workforces and aging populations that their current birth rates cannot sustain. Skilled migrants fill critical gaps in healthcare, technology, and engineering, while even low-skilled migrants contribute to sectors that native workers increasingly avoid. Rather than a burden, managed immigration may be an economic necessity for maintaining living standards in aging societies.`,
choices:["the cultural challenges of integrating immigrant communities","why immigration may be economically necessary for aging societies","the effect of brain drain on developing countries sending migrants","international refugee law and the right to seek asylum","how language barriers affect immigrant employment outcomes"],answer:2,
explanation:"이민이 인구 고령화 사회에 경제적으로 필요하다는 주장을 다루므로, 주제는 ②입니다."},

{id:10,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Western classical music is often taught as a universal standard of musical achievement, but this framing obscures its cultural specificity. The emphasis on written notation, harmonic progression, and instrumental virtuosity reflects the values of European courts and churches from roughly 1600 to 1900. Musical traditions from West Africa, India, and the Middle East organize pitch, rhythm, and improvisation in fundamentally different ways that are no less sophisticated — only differently sophisticated.`,
choices:["the history of classical music from the Baroque to the Romantic period","the cultural bias in treating Western classical music as a universal standard","how music education benefits cognitive development in children","the influence of African rhythmic traditions on American jazz and blues","how digital technology has transformed music production and distribution"],answer:2,
explanation:"서양 클래식 음악을 보편적 기준으로 보는 시각의 문화적 편향성을 다루므로, 주제는 ②입니다."},

{id:11,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The concept of 'cultural capital,' introduced by sociologist Pierre Bourdieu, refers to the non-financial assets — knowledge, behaviors, skills, and educational credentials — that confer social status and mobility. Children raised in privileged households absorb cultural capital through everyday experience: visiting museums, speaking standard dialect, knowing which fork to use, or understanding the unwritten rules of elite institutions. This inherited advantage is largely invisible, which makes it especially effective at reproducing social inequality across generations.`,
choices:["how financial inequality affects educational opportunities for children","Bourdieu's concept of cultural capital and its role in reproducing inequality","why arts education has declined in public school curricula","the relationship between social class and physical health outcomes","how universities select students through standardized admissions tests"],answer:2,
explanation:"부르디외의 '문화 자본' 개념과 이것이 계층 불평등을 재생산하는 방식을 다루므로, 주제는 ②입니다."},

{id:12,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Research on human happiness consistently finds that beyond a moderate income threshold, additional wealth contributes surprisingly little to subjective wellbeing. What strongly predicts happiness is the quality and depth of social relationships — close friendships, strong family ties, and a sense of community belonging. People who report high life satisfaction tend not to be the wealthiest but those who invest most in their social connections, suggesting that time and attention are more valuable currencies than money when it comes to human flourishing.`,
choices:["the correlation between national GDP and average citizen happiness","why social relationships matter more than wealth for human happiness","how workplace culture affects employee motivation and productivity","philosophical theories of the good life from Aristotle to the present","financial literacy education and its effect on long-term savings behavior"],answer:2,
explanation:"행복에는 부보다 사회적 관계가 훨씬 중요하다는 연구 결과를 다루므로, 주제는 ②입니다."},

{id:13,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Confirmation bias — the tendency to seek out and favor information that confirms existing beliefs while ignoring contradictory evidence — is one of the most robust findings in cognitive psychology. It operates in domains from political belief to medical diagnosis. Doctors who form an early hypothesis about a patient's condition may unconsciously downplay symptoms that do not fit, potentially delaying the correct diagnosis. Training professionals to actively seek disconfirming evidence is one of the most effective ways to improve decision-making quality.`,
choices:["how political polarization is driven by partisan media ecosystems","confirmation bias and strategies to overcome it in decision-making","the history of logical fallacies in philosophical argumentation","how cognitive biases affect financial investment behavior","memory distortion and the reliability of eyewitness testimony"],answer:2,
explanation:"확증 편향의 특성과 그것을 극복하기 위한 전략을 다루므로, 주제는 ②입니다."},

{id:14,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Homelessness is often attributed to personal failures — addiction, mental illness, poor decisions — but research increasingly points to structural causes. In cities where housing costs have risen far faster than wages, even employed people earning moderate incomes can find themselves unable to afford rent. Studies of homelessness prevention programs show that providing stable housing directly — rather than requiring people to achieve sobriety or employment first — is both more humane and more cost-effective than emergency shelter systems.`,
choices:["the psychological profile of individuals experiencing chronic homelessness","how housing unaffordability and structural factors drive homelessness","addiction treatment programs in urban social services contexts","the history of welfare policy reform in the United States","government incentives for building affordable housing developments"],answer:2,
explanation:"노숙의 개인적 원인이 아닌 구조적 원인(주거비 상승 등)과 효과적인 예방 정책을 다루므로, 주제는 ②입니다."},

{id:15,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Traditional economic models assume that humans make rational decisions by carefully weighing costs and benefits. Behavioral economics has dismantled this assumption by documenting systematic patterns in how people actually decide. People are disproportionately loss-averse, prefer immediate rewards over larger future ones, and are heavily influenced by how options are framed. These predictable irrationalities are not random errors but consistent patterns that can be modeled — and sometimes exploited or corrected through smart policy design.`,
choices:["the mathematical models used in stock market price prediction","how behavioral economics reveals systematic patterns in human irrationality","microeconomic theory and the conditions for market equilibrium","the role of central banks in managing inflation and interest rates","game theory and strategic decision-making in competitive markets"],answer:2,
explanation:"행동경제학이 인간의 비합리적이고 예측 가능한 의사결정 패턴을 어떻게 밝혀내는지를 다루므로, 주제는 ②입니다."},

{id:16,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Modern supply chains have become extraordinarily efficient by concentrating production in low-cost locations, minimizing inventory, and relying on just-in-time delivery. The COVID-19 pandemic exposed the fragility of this model: a shutdown of a single factory in one country could halt production on a different continent. The experience has prompted companies and governments to reassess the tradeoff between efficiency and resilience, considering whether some redundancy in supply chains might be worth the cost.`,
choices:["the economic effects of tariffs and trade barriers between nations","the vulnerability of just-in-time supply chains and the value of resilience","how logistics companies use artificial intelligence to optimize delivery routes","labor rights violations in the global garment and electronics industries","the environmental impact of international shipping and air freight"],answer:2,
explanation:"적기 공급 방식의 취약성과 공급망 복원력의 중요성을 다루므로, 주제는 ②입니다."},

{id:17,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Introverts and extroverts differ not only in social preference but in how their brains respond to stimulation. Research suggests that extroverts need more external stimulation to maintain an optimal level of arousal, while introverts reach that level more easily and can find crowded environments overwhelming. This neurological difference explains why introverts typically prefer deep, one-on-one conversations and need solitary time to recover after social interaction — not because of shyness, but because of how their brains are wired.`,
choices:["how childhood experiences shape adult personality and social preferences","neurological differences between introverts and extroverts and their behavioral implications","shyness as a social anxiety disorder and its treatment options","the role of genetics versus environment in determining personality traits","cross-cultural differences in social norms for introversion and extroversion"],answer:2,
explanation:"내향인과 외향인의 신경학적 차이와 그것이 행동에 미치는 영향을 다루므로, 주제는 ②입니다."},

{id:18,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Food security — reliable access to sufficient, nutritious food — is undermined not only by drought and war but increasingly by economic volatility. When global commodity prices spike, low-income households, which spend the largest share of their income on food, are most vulnerable. International food aid programs can alleviate acute crises but do little to address the chronic structural causes: landlessness, inadequate agricultural investment, and trade policies that favor wealthy food-exporting nations at the expense of subsistence farmers elsewhere.`,
choices:["how technological innovation can increase agricultural productivity","structural causes of food insecurity beyond drought and conflict","the nutritional science behind recommended daily dietary guidelines","comparing organic and conventional farming methods and their yields","the logistics of distributing food aid in conflict zones"],answer:2,
explanation:"가뭄·분쟁 외에도 경제적·구조적 요인이 식량 불안의 주요 원인임을 다루므로, 주제는 ②입니다."},

{id:19,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The digital divide — the gap between those who have reliable access to internet technology and those who do not — is no longer merely a matter of whether a household owns a computer. As education, employment, healthcare, and government services move online, digital exclusion translates directly into economic and social disadvantage. Researchers note that the divide now runs along multiple axes: income, age, geography, and disability, making it a complex equity issue that simple device provision cannot solve.`,
choices:["the business models of major internet service providers","how the digital divide creates multi-dimensional social and economic inequality","cybersecurity challenges facing governments and corporations","social media regulation and the protection of user data privacy","the history of internet infrastructure development since the 1990s"],answer:2,
explanation:"디지털 격차가 경제적·사회적 불평등을 야기하는 복합적인 문제임을 다루므로, 주제는 ②입니다."},

{id:20,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The ancient Greek concept of 'eudaimonia' — often translated as happiness but more accurately as flourishing — is experiencing a revival in contemporary positive psychology. Unlike hedonic happiness, which emphasizes pleasure and the absence of pain, eudaimonic wellbeing focuses on living in accordance with one's deepest values, engaging meaningfully with others, and contributing to something beyond oneself. Studies suggest that people who pursue eudaimonic goals report greater long-term life satisfaction than those who primarily pursue pleasure.`,
choices:["the history of philosophy from ancient Greece to the Enlightenment","eudaimonic wellbeing versus hedonic happiness and their effects on life satisfaction","how meditation practices derived from Buddhism reduce stress and anxiety","the psychological benefits of volunteering and prosocial behavior","cultural differences in how societies define and pursue personal success"],answer:2,
explanation:"쾌락적 행복과 구별되는 에우다이모니아(번영)의 개념과 그것이 삶의 만족에 미치는 영향을 다루므로, 주제는 ②입니다."}
]},

,{id:'N',name:'세트 N · 제목 찾기 Ⅰ',desc:'글의 제목을 추론하는 유형 (자연과학·기술)',color:'#7c3aed',time:45*60,questions:[
{id:1,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Photosynthesis does more than feed plants — it is the foundation of nearly all life on Earth. By converting sunlight, carbon dioxide, and water into glucose and oxygen, plants and algae make the chemical energy that flows through every food web. Every calorie we consume, whether from a grain, a fruit, or an animal that ate grass, traces back to a photon of sunlight captured by a chlorophyll molecule. Without photosynthesis, the atmosphere would contain almost no free oxygen, and complex aerobic life would not exist.`,
choices:["The Chemistry of Chlorophyll and Why Leaves Are Green","Photosynthesis: The Engine That Powers All Life on Earth","How Carbon Dioxide Drives Global Warming","Why Forests Are Disappearing at an Alarming Rate","The Role of Oxygen in the Evolution of Animal Life"],answer:2,
explanation:"광합성이 지구 모든 생명의 근본 에너지원임을 설명하므로, 가장 적절한 제목은 ②입니다."},

{id:2,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Firefighters, soldiers, and emergency surgeons must make critical decisions under intense time pressure, emotional stress, and incomplete information — conditions where deliberate analytical reasoning is a luxury they cannot afford. Research by Gary Klein revealed that experienced professionals in these fields rarely compare options; instead, they pattern-match the situation to a mental library built from years of experience and execute the first workable plan they recognize. This naturalistic decision-making process is fast, effective, and largely invisible to the decision-maker.`,
choices:["How to Build Better Checklists for Emergency Responders","Expert Intuition: Decision-Making Through Pattern Recognition","The Dangers of Snap Judgments in High-Stakes Environments","Why Analytical Thinking Outperforms Intuition in Complex Tasks","Teaching Critical Thinking in Military Officer Training Programs"],answer:2,
explanation:"전문가의 직관적 의사결정이 패턴 인식을 통해 이루어진다는 내용이므로, 가장 적절한 제목은 ②입니다."},

{id:3,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`In 1953, James Watson and Francis Crick, building on X-ray crystallography images produced by Rosalind Franklin, proposed the double helix structure of DNA. This discovery explained not only how genetic information is stored but how it can be precisely copied during cell division and transmitted to offspring. The double helix became one of the most celebrated and consequential scientific icons of the twentieth century, opening the door to molecular biology, genetic engineering, and genomic medicine.`,
choices:["Rosalind Franklin and the Politics of Scientific Credit","The Double Helix: Unlocking the Secret of Heredity","How Gene Therapy Is Curing Previously Untreatable Diseases","From Mendel's Peas to the Human Genome Project","Why DNA and RNA Play Different Roles in the Cell"],answer:2,
explanation:"DNA 이중나선 구조 발견의 의미와 그 영향을 설명하므로, 가장 적절한 제목은 ②입니다."},

{id:4,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The Great Barrier Reef, stretching over 2,300 kilometers along Australia's northeastern coast, is the world's largest coral reef system and one of the most biodiverse ecosystems on the planet. Rising ocean temperatures triggered by climate change cause corals to expel the symbiotic algae that give them both color and nutrition — a process called bleaching. Severe bleaching events, which occurred in 2016, 2017, 2020, 2022, and 2024, have killed vast portions of the reef, raising fears that continued warming could destroy it entirely within decades.`,
choices:["How Australia Is Profiting from Coral Reef Tourism","Climate Change and the Looming Destruction of the Great Barrier Reef","The Biology of Coral Polyps and Their Symbiotic Algae","Ocean Acidification: A Threat Separate from Global Warming","Marine Protected Areas and Their Role in Reef Conservation"],answer:2,
explanation:"기후변화로 인한 대보초의 위기를 다루므로, 가장 적절한 제목은 ②입니다."},

{id:5,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Deep in caves and extreme environments, scientists have found organisms that thrive in conditions once thought incompatible with life: boiling acid, intense radiation, crushing pressure, complete darkness. These 'extremophiles' have expanded our understanding of the conditions under which biology can operate and have fueled optimism about the possibility of life on other planets. If life can exist in the hot springs of Yellowstone or the ice-covered lakes of Antarctica, the range of environments in the solar system that could harbor life grows considerably.`,
choices:["How NASA Selects Astronauts for Deep Space Missions","Life in the Extremes: What Extremophiles Tell Us About Life's Possibilities","The Chemistry of Volcanic Springs and Hydrothermal Vents","Why Europa and Enceladus Are Top Targets in the Search for Alien Life","Survival Strategies of Deep-Sea Organisms Without Sunlight"],answer:2,
explanation:"극한 환경 생물이 생명 가능성에 대한 우리의 이해를 넓혔음을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:6,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The history of medicine is littered with treatments that were once standard and later discovered to be useless or harmful — bloodletting, routine tonsillectomies, lobotomies. The randomized controlled trial (RCT) emerged as the gold standard for testing whether a treatment actually causes improvement, by comparing outcomes between a group receiving the treatment and a statistically matched group receiving a placebo or no treatment. RCTs have transformed medicine from an art guided by tradition and intuition into a science grounded in evidence.`,
choices:["Why Doctors Once Recommended Cigarettes to Their Patients","The Randomized Controlled Trial: How Evidence-Based Medicine Was Born","The Placebo Effect: When Belief Heals the Body","How Pharmaceutical Companies Design and Fund Clinical Trials","Medical Ethics and the Rights of Research Participants"],answer:2,
explanation:"무작위 대조 시험이 어떻게 증거 기반 의학을 탄생시켰는지를 다루므로, 가장 적절한 제목은 ②입니다."},

{id:7,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The Fermi Paradox — named for physicist Enrico Fermi, who famously asked 'Where is everybody?' — captures the puzzling contradiction between the apparent high probability of extraterrestrial civilizations and the complete absence of contact with or evidence of them. Given the billions of stars in our galaxy alone, and the billions of years available for civilizations to develop and communicate, many scientists expected that we would have detected signals or evidence by now. The silence remains one of the most profound mysteries in science.`,
choices:["How Radio Telescopes Search for Signals from Other Civilizations","The Fermi Paradox: Why Haven't We Found Alien Life Yet?","The Drake Equation and Estimating the Number of Civilizations","Why Space Travel Between Stars Is Practically Impossible","The Discovery of Exoplanets and the Search for Earth-Like Worlds"],answer:2,
explanation:"페르미 역설의 내용과 그것이 왜 과학의 깊은 수수께끼인지를 다루므로, 가장 적절한 제목은 ②입니다."},

{id:8,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`When scientists discovered that the ozone layer over Antarctica was thinning dramatically, the international community responded with remarkable speed. The 1987 Montreal Protocol banned the production of chlorofluorocarbons — the chemical culprits — and has been ratified by every nation on Earth. Decades later, measurements show the ozone layer slowly recovering. The Montreal Protocol is now widely cited as the most successful international environmental agreement in history, a model of what global cooperation can achieve when the science is clear and the economic interests are manageable.`,
choices:["Why UV Radiation Is More Dangerous at High Altitudes","Fixing the Sky: The Montreal Protocol as a Model of Environmental Success","The Discovery of the Ozone Layer and Its Importance for Life","Chemical Industry Lobbying Against Environmental Regulations","Climate Change: Why International Agreements Repeatedly Fail"],answer:2,
explanation:"몬트리올 의정서가 오존층 회복의 성공 사례로서 국제 협력의 모범임을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:9,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The wolf reintroduction to Yellowstone in 1995 provides a striking example of what ecologists call a 'trophic cascade.' By hunting elk, wolves changed the behavior of elk herds, which had been overgrazing riverbanks. As vegetation recovered, songbirds and beavers returned, the beavers built dams that created wetlands, and the wetlands stabilized riverbanks and cooled water temperatures, benefiting fish. The rivers even changed course. One predator, returned to its natural range, transformed an entire ecosystem.`,
choices:["Why Wolves Were Hunted to Extinction Across North America","How One Predator Changed an Entire Ecosystem: The Yellowstone Wolf","The Breeding Habits and Pack Structure of Gray Wolves","Conservation Conflicts Between Ranchers and Wildlife Managers","Population Control Strategies for Overabundant Deer and Elk"],answer:2,
explanation:"옐로스톤 늑대 재도입이 생태계 전체를 변화시킨 먹이연쇄 효과를 다루므로, 가장 적절한 제목은 ②입니다."},

{id:10,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The Cambrian explosion — a relatively brief period roughly 540 million years ago — saw the sudden appearance in the fossil record of most major animal body plans. Within perhaps ten million years, evolution produced eyes, limbs, shells, and complex nervous systems that had not existed before. Scientists debate what triggered this burst of diversification: changes in ocean chemistry, a rise in oxygen levels, or ecological feedbacks between predator and prey. Whatever the cause, the Cambrian explosion shaped the blueprint of animal life for hundreds of millions of years to come.`,
choices:["Mass Extinction Events and the Recovery of Life on Earth","The Cambrian Explosion: When Animal Life Suddenly Diversified","How Fossils Are Formed and What They Tell Us About the Past","Why Some Animal Groups Have Survived Unchanged for Millions of Years","The Evolutionary Origins of Eyes and Complex Sense Organs"],answer:2,
explanation:"캄브리아기 대폭발의 내용과 그 원인에 대한 논의를 다루므로, 가장 적절한 제목은 ②입니다."},

{id:11,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Hydrogen fuel cells combine hydrogen and oxygen to produce electricity, with water as the only byproduct. Unlike batteries, which store a fixed charge, fuel cells generate electricity as long as hydrogen is supplied, making them potentially ideal for long-range transportation and grid-scale energy storage. The challenge lies in producing hydrogen cleanly: most hydrogen today is extracted from natural gas in a process that releases CO₂. 'Green hydrogen,' produced by splitting water using renewable electricity, could eliminate this problem — but currently costs too much to compete with fossil fuels.`,
choices:["Battery Technology and the Race to Power Electric Vehicles","Hydrogen Fuel Cells: Clean Energy Promise and Current Challenges","How Fuel Efficiency Standards Have Changed the Auto Industry","The Economics of Offshore Wind Power Development","Nuclear Fusion: The Energy Source That Is Always Thirty Years Away"],answer:2,
explanation:"수소 연료전지의 가능성과 현재의 기술·비용 과제를 다루므로, 가장 적절한 제목은 ②입니다."},

{id:12,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Sleep is not merely rest — it is an active biological process essential for physical and cognitive health. During slow-wave sleep, the brain consolidates memories by replaying and strengthening neural pathways formed during waking hours. During REM sleep, the brain processes emotional experiences, apparently helping regulate mood. Chronic sleep deprivation impairs memory, decision-making, immune function, and metabolic regulation. Yet modern societies consistently undervalue sleep, treating it as a negotiable commodity rather than a biological necessity.`,
choices:["Insomnia Treatments: From Sleep Hygiene to Pharmacology","More Than Rest: The Vital Biological Functions of Sleep","Why Teenagers Naturally Stay Up Late and Wake Up Late","The Business of Sleep Tracking Devices and Their Accuracy","How Jet Lag Disrupts the Body's Internal Circadian Clock"],answer:2,
explanation:"수면이 단순한 휴식이 아닌 기억 통합·감정 조절 등의 필수 생물학적 과정임을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:13,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Modern vaccines work by presenting the immune system with a harmless version of a pathogen — a weakened virus, a protein fragment, or, in the case of mRNA vaccines, genetic instructions to produce such a protein — so that the immune system can build memory cells without experiencing the actual disease. When the vaccinated person later encounters the real pathogen, the immune response is faster and stronger, often neutralizing the threat before symptoms can develop. This principle, developed from Edward Jenner's eighteenth-century smallpox work, has eliminated or controlled diseases that once killed millions annually.`,
choices:["Edward Jenner and the Invention of the First Vaccine","How Vaccines Train the Immune System to Fight Disease","The Controversy Over Childhood Vaccine Safety and Autism Claims","How mRNA Technology Was Developed Before COVID-19","The Global Effort to Eradicate Polio in the Final Remaining Countries"],answer:2,
explanation:"백신이 면역계를 훈련시켜 질병에 맞서게 하는 원리를 설명하므로, 가장 적절한 제목은 ②입니다."},

{id:14,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The Amazon rainforest is often called 'the lungs of the Earth,' but the metaphor, while evocative, is scientifically imprecise. The forest does absorb enormous quantities of carbon dioxide, but the organisms living in it also respire, releasing most of that oxygen back. The net contribution to atmospheric oxygen is small. What the Amazon genuinely provides is irreplaceable: an unmatched reservoir of biodiversity, a regulator of regional rainfall patterns through transpiration, and a massive carbon store that, if released through deforestation, would dramatically accelerate climate change.`,
choices:["Why Deforestation Rates in Brazil Have Accelerated Since 2019","The Amazon Rainforest: Correcting the Myths and Clarifying the Facts","How Tropical Forests Are Being Replaced by Soy Farms and Cattle Ranches","The Medicinal Plants of the Amazon and Their Commercial Potential","Satellite Technology for Monitoring Deforestation in Real Time"],answer:2,
explanation:"아마존 열대우림에 대한 오해를 바로잡고 실제 가치를 명확히 설명하므로, 가장 적절한 제목은 ②입니다."},

{id:15,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Traditional breeding has always exploited genetic variation, selecting plants and animals with desirable traits over generations. Modern gene editing tools like CRISPR have accelerated this process by allowing scientists to make precise changes in a single generation, without introducing foreign DNA. Regulators and consumers debate whether CRISPR-edited organisms are fundamentally different from traditionally bred ones. Proponents argue that the end result — a targeted genetic change — is the same; critics focus on the intentionality and speed of the process.`,
choices:["The History of Selective Breeding from Ancient Agriculture to Today","CRISPR-Edited Crops: Between Tradition and Controversy","Why Genetically Modified Organisms Are Banned in Many Countries","How Hybrid Seeds Transformed Industrial Agriculture in the Twentieth Century","The Science of Epigenetics and How Diet Alters Gene Expression"],answer:2,
explanation:"CRISPR 편집 작물의 규제 및 논쟁을 전통 육종과의 비교를 통해 다루므로, 가장 적절한 제목은 ②입니다."},

{id:16,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Sound moves through water about four times faster than through air, and certain frequencies travel extraordinary distances in the ocean without significant loss of energy. Before satellite navigation, military scientists discovered that explosions detonated at specific depths could be detected thousands of kilometers away. Whales appear to exploit this same acoustic phenomenon, communicating across ocean basins through low-frequency calls. Human noise pollution — from shipping, sonar, and construction — now overlaps with these frequencies, interfering with whale communication and navigation.`,
choices:["How Sonar Technology Is Used to Map the Ocean Floor","Underwater Acoustics: How Sound Travels in the Ocean and Why It Matters","The Intelligence of Whales and Their Complex Social Behaviors","Noise Pollution Regulation in International Maritime Law","How Military Sonar Technology Was Developed During the Cold War"],answer:2,
explanation:"수중 음향의 특성과 그것이 고래 소통 및 해양 소음 오염에 미치는 영향을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:17,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The concept of terraforming — deliberately altering a planet's environment to make it habitable for humans — has moved from science fiction to serious scientific discussion. Mars, with its thin atmosphere, extreme cold, and lack of liquid water, would require centuries of intervention: releasing greenhouse gases to warm the planet, redirecting comets to deliver water, and potentially genetically engineering microorganisms to begin producing oxygen. Whether terraforming Mars is ethical — given that we do not know if Mars harbors microbial life — remains a serious philosophical debate.`,
choices:["Living on the Moon: Plans for a Permanent Lunar Base","Terraforming Mars: The Science, Timeline, and Ethical Questions","How Astronauts Prepare for Long-Duration Space Travel","The Search for Microbial Life Under the Martian Surface","Why Mars Exploration Has Become a Priority for Space Agencies"],answer:2,
explanation:"화성 테라포밍의 과학적 가능성, 시간표, 윤리적 문제를 다루므로, 가장 적절한 제목은 ②입니다."},

{id:18,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The human appendix was long dismissed as a useless evolutionary remnant. Recent research has revised this view: the appendix appears to serve as a 'safe house' for beneficial gut bacteria, allowing the microbiome to be repopulated after severe gastrointestinal illness. People without appendixes, studies suggest, take longer to recover from bacterial gut infections because they lack this reservoir. The appendix exemplifies how evolutionary 'vestiges' often retain functions that were simply overlooked.`,
choices:["The Risks and Recovery Process of Appendectomy Surgery","The Appendix: From Evolutionary Leftover to Microbial Safe House","Why the Human Body Retains Organs That Appear Useless","How the Immune System Is Concentrated in the Gastrointestinal Tract","The Role of Beneficial Bacteria in Preventing Autoimmune Disease"],answer:2,
explanation:"맹장이 진화적 흔적이 아닌 장내 세균의 보호처 역할을 한다는 내용이므로, 가장 적절한 제목은 ②입니다."},

{id:19,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Computer vision systems can now identify objects in photographs more accurately than humans in many controlled tests. Yet they fail in ways that humans never would: a small, carefully designed sticker on a stop sign can fool a neural network into classifying it as a speed limit sign, while any human driver would see the stop sign immediately. These 'adversarial examples' reveal that AI systems learn statistical patterns in training data rather than the underlying concepts, making them brittle in ways that are difficult to predict and potentially dangerous in safety-critical applications.`,
choices:["How Convolutional Neural Networks Recognize Faces and Objects","The Achilles' Heel of AI: Why Neural Networks Fail at What Humans Find Obvious","Training Datasets and the Problem of Bias in Machine Learning Systems","Autonomous Weapons and the Ethics of Delegating Lethal Decisions to AI","How Self-Driving Cars Distinguish Between Pedestrians and Cyclists"],answer:2,
explanation:"AI가 적대적 사례에서 인간과 달리 실패하는 이유와 그 취약성을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:20,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Plate tectonics — the theory that Earth's outer shell is divided into large plates that move slowly over the mantle — unified geology the way evolution unified biology. It explained why the coastlines of South America and Africa fit together like puzzle pieces, why earthquakes and volcanoes cluster at plate boundaries, and why identical fossils appear on continents now separated by oceans. When Alfred Wegener proposed the idea in 1912, geologists ridiculed him. By the 1960s, evidence from ocean floor mapping had vindicated him completely.`,
choices:["How Volcanoes Form at Subduction Zones and Hot Spots","Plate Tectonics: The Theory That Unified All of Earth Science","Alfred Wegener's Life and His Struggle to Be Taken Seriously","Why Earthquakes Cannot Be Predicted Far in Advance","The Role of the Mantle in Driving Crustal Movement"],answer:2,
explanation:"판구조론이 지구과학 전체를 통합한 이론임을 베게너의 이야기와 함께 설명하므로, 가장 적절한 제목은 ②입니다."}
]},

,{id:'O',name:'세트 O · 제목 찾기 Ⅱ',desc:'글의 제목을 추론하는 유형 (심리·사회·문화)',color:'#9333ea',time:45*60,questions:[
{id:1,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The marshmallow test, conducted at Stanford University in the 1960s and 70s, offered children a choice: eat one marshmallow now or wait fifteen minutes and receive two. Children who delayed gratification showed significantly better life outcomes decades later — higher SAT scores, better health, and higher incomes. For years, this was taken as proof that self-control is a fundamental trait predicting success. Later replication attempts complicated the picture, finding that socioeconomic background — not innate self-control — largely determined which children waited, because children from unstable environments had learned that delayed rewards often do not materialize.`,
choices:["Why Sugar Is the Leading Driver of Childhood Obesity","Rethinking the Marshmallow Test: Self-Control or Social Context?","How Early Childhood Cognitive Development Is Measured","IQ Tests and Their Limitations as Predictors of Life Outcomes","The Science of Habit Formation and Breaking Bad Habits"],answer:2,
explanation:"마시멜로 테스트의 의미를 재해석하여 자기통제보다 사회경제적 맥락이 중요함을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:2,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Globalization has created a world in which ideas, fashions, and media spread across cultural borders with unprecedented speed. Critics argue this homogenizes culture, eroding local traditions under the weight of American entertainment and global brands. But cultural exchange has always flowed in multiple directions: Korean pop music and drama now dominate youth culture across Asia and beyond; Japanese cuisine has become globally prestigious; West African music rhythms underlie much of contemporary popular music. Perhaps globalization accelerates exchange rather than simply imposing one culture on others.`,
choices:["How American Fast Food Chains Conquered the World","Cultural Globalization: Homogenization or Mutual Exchange?","The Business Model of the Global Entertainment Industry","How Social Media Has Changed the Speed of Cultural Trends","Why Languages Are Disappearing at an Accelerating Rate"],answer:2,
explanation:"문화 세계화가 동질화인지 상호 교류인지를 논의하므로, 가장 적절한 제목은 ②입니다."},

{id:3,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The Stanford prison experiment convinced many that ordinary people, placed in roles of authority, will inevitably engage in cruelty. Philip Zimbardo, who ran the experiment, used it to support his 'situationist' view that evil is driven by circumstances, not character. However, recent historical analysis of the experiment's records reveals that Zimbardo coached participants, actively encouraging guards to behave harshly. Far from a natural emergence of cruelty, the behavior was substantially scripted — fundamentally undermining the experiment's most famous conclusions.`,
choices:["The Milgram Experiment and Obedience to Authority","The Stanford Prison Experiment: A Famous Study That May Have Been Rigged","How Prison Conditions Contribute to Rehabilitation or Recidivism","Why Social Psychology Has Struggled to Replicate Classic Experiments","Philip Zimbardo's Later Work on Heroism and Positive Psychology"],answer:2,
explanation:"스탠퍼드 감옥 실험이 연구자의 개입으로 인해 결과가 조작되었을 가능성을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:4,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Economists have long assumed that the price mechanism efficiently allocates most goods. But some things resist commodification in ways that reveal deeper social values. When a parking space in a crowded city sells for a high price, most people accept this as fair — the market clears. When a lifesaving medicine is priced beyond the means of a dying patient, the same logic provokes moral outrage. The difference, philosopher Michael Sandel argues, lies in the nature of the good: some things have intrinsic value that markets distort or corrupt when they price it.`,
choices:["Supply and Demand: The Fundamentals of Price Theory","The Moral Limits of Markets: When Pricing Things Goes Wrong","Healthcare Reform and the Case for Universal Insurance Coverage","How Pharmaceutical Companies Set Drug Prices and Why They Differ","The Economics of Organ Transplantation and Donation Incentives"],answer:2,
explanation:"시장 가격 메커니즘의 도덕적 한계, 즉 일부 재화는 상품화하면 안 된다는 주장을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:5,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Many adults believe they are worse at learning new languages than children — and the evidence partly supports this. Children acquire phonology and grammar with an ease that adults cannot match, especially for very different languages. However, adults have advantages that are rarely acknowledged: they learn vocabulary faster, understand grammar rules more explicitly, and are more efficient at deploying memory strategies. Adults who invest sustained effort routinely achieve high proficiency in second languages, often outperforming children in formal academic measures within a few years of study.`,
choices:["Why Immersion Programs Are Superior to Classroom Language Study","Children vs. Adults as Language Learners: A More Balanced View","How the Brain Stores and Retrieves Vocabulary in a Foreign Language","The Critical Period Hypothesis and Its Implications for Language Education","Differences Between Learning Mandarin and Spanish for English Speakers"],answer:2,
explanation:"아동과 성인 외국어 학습의 장단점을 균형 있게 비교하므로, 가장 적절한 제목은 ②입니다."},

{id:6,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The arts are often the first programs cut when school budgets tighten, framed as luxuries compared to core academic subjects. Yet a growing body of research links arts education to outcomes schools care deeply about: improved literacy, stronger mathematical reasoning, greater engagement, and reduced dropout rates. More fundamentally, arts education develops capacities — creativity, ambiguity tolerance, aesthetic judgment — that are central to human flourishing and that standardized tests do not capture. Cutting the arts, the evidence suggests, may impoverish education in ways that show up only years later.`,
choices:["How to Evaluate Art Objectively: Criteria for Artistic Excellence","The Hidden Value of Arts Education in Schools","Why Drama and Theater Develop Better Public Speaking Skills","Comparing Academic Achievement in Arts-Focused vs. STEM Schools","The History of Music Education in American Public Schools"],answer:2,
explanation:"예술 교육이 간과되지만 학업 성취와 인간적 역량 발달에 중요하다는 내용이므로, 가장 적절한 제목은 ②입니다."},

{id:7,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The phenomenon of 'cultural trauma' occurs when a devastating event — a genocide, a forced migration, a cultural suppression — inflicts wounds that persist across generations, not just in individual memory but in community identity, social trust, and psychological wellbeing. Descendants of Holocaust survivors show stress responses and psychological profiles that differ measurably from matched control groups, suggesting that collective trauma can alter not just memory but potentially biological inheritance. Understanding cultural trauma is essential for designing policies that genuinely support affected communities.`,
choices:["Individual Therapy vs. Community Healing After Disasters","Intergenerational Cultural Trauma and Its Effects on Communities","Post-Traumatic Stress Disorder: Symptoms, Diagnosis, and Treatment","How Memory Works and Why Traumatic Events Are Remembered Differently","The Psychological Recovery of Populations After Natural Disasters"],answer:2,
explanation:"세대를 넘어 지속되는 집단적·문화적 트라우마의 영향을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:8,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Most people believe they are less biased than average — a metacognitive error sometimes called the 'bias blind spot.' When shown descriptions of cognitive biases, people readily recognize them in others but rarely in themselves. This irony extends to intelligence: studies show that people with less expertise are often more confident in their judgments — the Dunning-Kruger effect — while genuine experts, aware of how much they do not know, tend toward greater epistemic humility. Recognizing our own limitations is cognitively harder than it sounds.`,
choices:["How Intelligence Testing Has Changed Since Binet and Simon","Why We Are Blind to Our Own Biases and Overconfident in Our Expertise","The Difference Between Knowledge and Wisdom in Human Development","Strategies for Improving Self-Awareness and Emotional Intelligence","Why Peer Review Is Essential for Scientific Credibility"],answer:2,
explanation:"자신의 편향에 대한 맹목성(편향 맹점)과 전문성 부재로 인한 과신(더닝-크루거 효과)을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:9,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The relationship between poverty and crime is well established statistically, but the direction of causation is debated. High-poverty neighborhoods tend to have higher crime rates, but this does not prove that poverty causes crime. Growing evidence suggests the relationship runs in both directions: economic deprivation increases stress, limits legitimate opportunities, and weakens social bonds — all factors associated with offending. Meanwhile, criminal records close off employment and housing options, deepening poverty. Breaking this cycle requires simultaneous attention to economic and criminal justice policy.`,
choices:["Sentencing Reform: Why Mandatory Minimums Need to Be Reconsidered","Poverty and Crime: A Complex Two-Way Relationship","How Urban Renewal Programs Have Affected Crime Rates in American Cities","The Psychological Profile of Repeat Offenders and Recidivism Prevention","Community Policing Strategies That Have Reduced Urban Crime"],answer:2,
explanation:"빈곤과 범죄 사이의 복잡한 양방향 관계를 설명하므로, 가장 적절한 제목은 ②입니다."},

{id:10,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Researchers studying 'flow' — the state of complete absorption in a challenging activity — find that it requires a precise balance between the difficulty of the task and the skill level of the performer. When a task is too easy, boredom results; too hard, anxiety. In the flow channel, the challenge slightly exceeds current ability, producing a state of effortless focus in which time seems to stop. Athletes, musicians, surgeons, and programmers report flow as their most productive and satisfying experience, suggesting that work designed to produce this balance enhances both output and wellbeing.`,
choices:["How Mindfulness Meditation Reduces Stress and Improves Attention","Flow: The Psychology of Optimal Experience and Peak Performance","Time Management Techniques for Professionals Under Deadline Pressure","Why Boredom at Work Leads to Distraction and Lower Productivity","The Science of Motivation and Why Rewards Can Undermine Creativity"],answer:2,
explanation:"최적 경험인 '플로(flow)' 상태의 조건과 그것이 성과와 행복에 미치는 영향을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:11,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`When a group of people must make a collective decision — whether a jury, a corporate board, or a national legislature — the process can either amplify the wisdom of its members or compound their errors. Deliberation among diverse, independent thinkers tends to pool genuine information. But when social pressure, conformity, and status hierarchies dominate, groups converge prematurely on the view of the most dominant member, ignoring information held by quieter members. This failure mode — groupthink — has been linked to some of history's most consequential decision-making disasters.`,
choices:["How Democratic Systems Prevent the Concentration of Power","The Wisdom and Failure Modes of Group Decision-Making","Leadership Qualities That Drive Innovation in Technology Companies","How Juries Are Selected and How Deliberation Procedures Work","The History of Consensus-Based Decision-Making in Indigenous Cultures"],answer:2,
explanation:"집단 의사결정의 지혜와 집단사고(groupthink)라는 실패 양상을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:12,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Historians note that most major social movements — from the abolition of slavery to women's suffrage to civil rights — were initially ridiculed or condemned by mainstream society before eventually prevailing. A consistent pattern emerges: a small committed minority advocates persistently, public opinion shifts slowly, then suddenly tips in a cascade of changed positions. Sociologists call this dynamic 'preference falsification' followed by rapid norm change: people privately hold views they conceal in public until the perceived cost of expressing them drops below a threshold.`,
choices:["How Propaganda Is Used to Suppress Political Dissent","Why Social Norms Change Slowly — Then All at Once","The History of the Women's Suffrage Movement Worldwide","How Modern Activists Use Social Media to Organize Protests","The Role of Charismatic Leaders in Driving Social Change"],answer:2,
explanation:"사회적 규범이 서서히 변화하다가 갑자기 급격히 변화하는 역학을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:13,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Traditional measures of economic progress — GDP, per capita income — count a new highway the same whether it replaces a forest or a vacant lot, and treat hospital visits from pollution-related illness as additions to economic output. Alternative indicators like the Genuine Progress Indicator subtract environmental degradation and income inequality from GDP and add the value of volunteer work and household labor. Countries that score highly on GDP can score poorly on GPI, and vice versa, raising fundamental questions about what economic success means.`,
choices:["Why Free Trade Agreements Benefit Some Countries More Than Others","Beyond GDP: Alternative Measures of Economic and Social Progress","How Tax Policy Affects Income Distribution in Developed Economies","The Environmental Kuznets Curve: Does Growth Eventually Clean Up?","Corporate Social Responsibility and Its Effect on Firm Profitability"],answer:2,
explanation:"GDP를 넘어서는 경제·사회 진보의 대안적 측정 지표를 다루므로, 가장 적절한 제목은 ②입니다."},

{id:14,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The act of choosing between options requires mental effort, and when we make too many choices in a row, our decision quality degrades — a phenomenon called decision fatigue. Studies of judges showed that favorable parole decisions were most likely immediately after a break, declining steadily throughout each session as fatigue accumulated. Retailers exploit this: supermarkets place impulse purchases near the checkout line, where shoppers' self-control is most depleted. Knowing when our decision-making capacity is lowest can help us design environments and schedules that protect it.`,
choices:["Willpower as a Muscle: Training Self-Control Through Practice","Decision Fatigue: How Depleted Mental Energy Leads to Poor Choices","The Paradox of Choice: Why More Options Lead to Less Happiness","Shopping Psychology: How Store Design Influences Purchasing Behavior","How Judges' Sentencing Decisions Are Reviewed for Consistency"],answer:2,
explanation:"의사결정 피로(decision fatigue)가 판단의 질을 떨어뜨리는 현상과 그 함의를 다루므로, 가장 적절한 제목은 ②입니다."},

{id:15,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Laughter is often dismissed as trivial, but its physiological and social functions are profound. Neurologically, laughter activates reward circuits and releases endorphins, reducing pain and stress. Socially, it functions as a bonding signal, synchronizing emotions between individuals and reinforcing group membership. Research shows that people laugh far more in social settings than alone and that most laughter is not in response to jokes but to ordinary, mildly amusing conversational statements. Humor, it turns out, is mostly about connection, not comedy.`,
choices:["The History of Stand-Up Comedy From Vaudeville to Netflix","Laughter: A Social Bonding Tool With Surprising Health Benefits","How the Brain Recognizes and Responds to Humor and Wit","Why Humor Differs Across Cultures and Historical Periods","Therapy Through Humor: Laughter Yoga and Its Psychological Effects"],answer:2,
explanation:"웃음의 생리적·사회적 기능과 그것이 유대감과 건강에 미치는 영향을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:16,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The concept of 'thin slicing' — making accurate judgments based on very brief exposures — suggests that first impressions often contain genuine information. Psychologist Nalini Ambady showed that students rating a professor from a two-second silent video clip produced evaluations closely matching those of students who had taken the full semester course. Similarly, voters shown thirty-second clips of political debates without sound correctly predicted election outcomes at above-chance rates. While snap judgments can be biased, they are not always wrong — they draw on subtle cues processed beneath conscious awareness.`,
choices:["Why Voters Are Influenced More by Appearance Than by Policy","Thin Slicing: The Surprising Accuracy of First Impressions","How to Make a Memorable First Impression in a Job Interview","The Neuroscience of Face Recognition and Social Judgment","Unconscious Bias in Hiring Decisions and How to Counter It"],answer:2,
explanation:"'씬 슬라이싱'이라는 첫인상의 짧고 의외의 정확성을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:17,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`For most of human history, people lived and died within a few kilometers of where they were born, knowing personally almost everyone in their community. Modernity has radically expanded our nominal social circles while potentially shrinking the number of genuinely close relationships. Research suggests that people today have fewer intimate friends than previous generations, despite being more 'connected' than ever. The paradox of modern social life is that greater connectivity has not automatically produced greater closeness — and may have substituted shallow digital contact for the kind of sustained face-to-face interaction that deep friendship requires.`,
choices:["How Social Isolation Affects the Immune System and Lifespan","Hyperconnected but Lonely: The Paradox of Modern Social Life","Why Online Communities Can Provide Genuine Emotional Support","The History of Friendship From Ancient Philosophy to the Present","How Urban Design Can Foster or Inhibit Community Cohesion"],answer:2,
explanation:"현대인이 더 많이 연결되어 있지만 더 외롭다는 역설적 현상을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:18,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Much of what we call 'multitasking' is actually rapid task-switching — and research shows it is far less efficient than sustained attention on one task at a time. Every switch incurs a cognitive 'reset' cost as the brain reloads the context of the new task. Workers interrupted by emails, notifications, or colleagues take an average of twenty-three minutes to return to deep focus. Open-plan offices, originally conceived to promote collaboration, have been found in many studies to actually reduce productivity by multiplying interruptions.`,
choices:["How to Organize Your Workday for Maximum Productivity","The Myth of Multitasking and the Hidden Costs of Constant Interruption","Why Remote Work Has Increased Employee Satisfaction and Output","Time-Blocking Techniques Used by High-Performing Executives","The Science of Attention and Why Deep Work Is Becoming Rare"],answer:2,
explanation:"멀티태스킹의 비효율성과 잦은 방해가 집중력에 미치는 숨겨진 비용을 다루므로, 가장 적절한 제목은 ②입니다."},

{id:19,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The Sapir-Whorf hypothesis — also known as linguistic relativity — holds that the language we speak shapes how we think. Strong versions of this claim have largely been discredited: speakers of all languages can think about concepts their language lacks words for. But weaker versions have surprising empirical support. Languages that use absolute cardinal directions (north, south, east, west) rather than relative terms (left, right) produce speakers with extraordinary spatial orientation skills. Languages with grammatical gender influence how speakers conceptualize inanimate objects.`,
choices:["Why English Has Borrowed More Words Than Any Other Language","Language and Thought: How What We Speak Shapes How We Think","The Decline of Minority Languages and Efforts to Revive Them","How Children Learn Grammar Without Being Explicitly Taught Rules","Translation and the Challenge of Capturing Concepts Across Languages"],answer:2,
explanation:"언어가 사고에 영향을 미친다는 언어 상대성 가설의 약한 형태에 대한 증거를 다루므로, 가장 적절한 제목은 ②입니다."},

{id:20,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Historians of science have documented that major paradigm shifts — from geocentrism to heliocentrism, from Newtonian mechanics to relativity — rarely happen because the old guard is convinced by new evidence. Instead, the old paradigm fades as its adherents retire or die and a new generation trained in the new framework rises to dominance. Max Planck observed this wryly: 'Science advances one funeral at a time.' This suggests that the sociology of scientific communities, not just the logic of evidence, drives the pace and shape of scientific progress.`,
choices:["How Scientific Journals Decide Which Papers to Publish","Why Scientific Revolutions Succeed One Generation at a Time","The Ethical Responsibilities of Scientists Toward Society","How Research Funding Shapes the Direction of Scientific Inquiry","Peer Review and the Quest for Reproducible Scientific Results"],answer:2,
explanation:"과학 혁명이 기존 세대의 설득보다 세대 교체를 통해 진전된다는 내용이므로, 가장 적절한 제목은 ②입니다."}
]},
