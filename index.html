{id:'C', name:'세트 C · 독해 종합', desc:'주제·제목·요지·내용일치 등 다양한 독해 유형입니다.', color:'#059669', time:45*60,
questions:[
{id:1,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Urban green spaces — parks, community gardens, and tree-lined streets — do far more than beautify cities. Research shows that access to nature within urban environments significantly reduces psychological stress and lowers blood pressure. Children who regularly interact with green spaces demonstrate stronger attention spans and better emotional regulation. Moreover, shared gardens foster social cohesion, bringing together neighbors who might otherwise remain strangers.`,
choices:["the high cost of maintaining urban parks","the psychological and social benefits of urban green spaces","how technology can replace nature in city planning","the economic impact of urban farming","challenges in designing modern city parks"],answer:2,
explanation:"글 전체가 도시 녹지 공간이 심리적·사회적으로 이점이 있다는 내용이므로 정답은 ②입니다."},

{id:2,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The way we consume music has changed dramatically over the past two decades. Streaming platforms have replaced physical albums, making virtually all recorded music accessible for a monthly fee. While this benefits consumers, many musicians argue they receive only a tiny fraction of revenue compared to the CD era. The debate raises fundamental questions about how creative labor should be valued in a digital economy.`,
choices:["the decline of live music concerts","the technical challenges of digital streaming","how streaming has changed music consumption and artist revenue","why CDs are superior to digital formats","copyright law in the entertainment industry"],answer:3,
explanation:"스트리밍이 음악 소비 방식과 아티스트 수익에 미친 변화가 핵심 주제입니다."},

{id:3,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Microplastics — particles smaller than five millimeters — have now been detected in the deep ocean, in Arctic ice, in drinking water, and even in human blood. Their tiny size allows them to enter organisms at the cellular level, and researchers are only beginning to understand the long-term health consequences. What began as a convenience material has become a pervasive environmental contaminant.`,
choices:["methods for recycling plastic products","the history of the plastics manufacturing industry","the widespread presence and health risks of microplastics","how oceans filter environmental pollutants","government policies on single-use plastics"],answer:3,
explanation:"마이크로플라스틱의 광범위한 존재와 건강 위험이 글의 핵심 주제입니다."},

{id:4,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Failure is often framed as something to be avoided, yet many of history's most significant innovations emerged directly from failed experiments. Thomas Edison famously described his thousands of unsuccessful attempts to invent the light bulb not as failures but as discoveries of what didn't work. Psychologists call this reframing, and it is a key characteristic of highly resilient individuals and organizations.`,
choices:["Edison's contribution to modern technology","the psychological definition of resilience","the role of failure and reframing in driving innovation","why scientists keep records of failed experiments","how to overcome fear of failure in school"],answer:3,
explanation:"실패를 재해석하는 것이 혁신을 이끈다는 것이 글의 주제입니다."},

{id:5,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The global rise in remote work since 2020 has profoundly altered the relationship between employees and the physical office. Many workers report higher productivity and satisfaction at home, while others struggle with isolation and blurred work-life boundaries. Companies are now experimenting with hybrid models, attempting to balance flexibility with the collaboration that in-person environments uniquely enable.`,
choices:["the history of office design in the 20th century","how commuting affects employee well-being","the benefits and challenges of remote and hybrid work models","why large corporations prefer traditional office settings","the future of technology in the workplace"],answer:3,
explanation:"재택·하이브리드 근무의 장단점과 변화하는 근무 환경이 주제입니다."},

{id:6,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`When a person makes a decision, they rarely have access to complete information. Instead, they rely on mental shortcuts — heuristics — to reach conclusions quickly. While often useful, these shortcuts produce systematic errors called cognitive biases. Confirmation bias, for instance, causes us to seek evidence that supports existing beliefs while dismissing contrary data. Understanding these patterns is the first step toward more rational thinking.`,
choices:["The History of Psychological Research","Mental Shortcuts: Helpful Tools or Hidden Traps?","How the Internet Amplifies Misinformation","Memory and Its Role in Decision-Making","Why Humans Are Naturally Creative"],answer:2,
explanation:"인지 편향이라는 정신적 지름길의 이점과 함정을 다루므로 ②가 가장 적절한 제목입니다."},

{id:7,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Across the world, millions of children do not attend school not because schools are unavailable but because they must work to help support their families. Child labor traps families in a cycle of poverty: without education, children grow into low-wage adults who in turn cannot afford to educate their own children. Breaking this cycle requires addressing not only school access but also the economic pressures families face.`,
choices:["Building Better Schools in Rural Areas","Child Labor: A Poverty Trap Across Generations","The Importance of Early Childhood Education","Why Children Prefer Work to School","Global Literacy Rates and Their Causes"],answer:2,
explanation:"아동 노동이 세대 간 빈곤의 악순환을 만든다는 내용이므로 ②가 가장 적절합니다."},

{id:8,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Plants are far more communicative than they appear. Through chemical signals released into the soil and air, trees can warn neighboring plants of insect attacks, share nutrients with weaker members of the same species via underground fungal networks, and even slow their own growth to allow nearby seedlings to access more light. Some ecologists now describe forests as having a kind of collective intelligence.`,
choices:["How Insects Damage Forest Ecosystems","The Silent Language of Trees and Plants","Fungi: Nature's Most Underrated Organism","Why Forests Are Important for Climate","Plant Growth and Photosynthesis Explained"],answer:2,
explanation:"식물이 화학 신호와 균류 네트워크를 통해 소통한다는 내용이므로 '식물의 언어'가 제목입니다."},

{id:9,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`For centuries, historians relied on written records — a significant limitation given that literacy was historically rare. Today, archaeologists, geneticists, and climate scientists contribute entirely new layers of evidence: DNA from ancient bones can trace migration routes, pollen samples can reconstruct prehistoric climates, and satellite imagery can reveal buried city layouts. History is becoming an increasingly multidisciplinary science.`,
choices:["Why Written Records Are Still Most Reliable","History Beyond Text: A Science of Many Disciplines","The Role of Climate in Ancient Civilizations","How Satellites Are Used in Modern Warfare","Archaeology and Its Limitations"],answer:2,
explanation:"역사학이 다양한 과학 분야의 결합으로 발전하고 있다는 내용이므로 ②가 제목으로 가장 적절합니다."},

{id:10,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The concept of "15-minute cities" proposes that urban residents should be able to reach all essential services — work, schools, healthcare, shops, and parks — within a 15-minute walk or bike ride. Proponents argue this model reduces car dependency, cuts emissions, and fosters stronger neighborhood communities. Critics, however, warn that poorly implemented versions can raise property values and displace lower-income residents.`,
choices:["Public Transportation and Urban Growth","The 15-Minute City: Promise and Pitfalls","Why Car Culture Is Hard to Change","Urban Parks and Community Health","How Cities Can Reduce Air Pollution"],answer:2,
explanation:"15분 도시 개념의 장점과 문제점을 함께 다루므로 ②가 가장 적절합니다."},

{id:11,pts:5,text:"다음 글에서 필자가 주장하는 바로 가장 적절한 것은?",
passage:`Many educators believe that standardized tests measure academic ability objectively. However, research consistently shows these tests reflect socioeconomic background as much as talent. Wealthier families can afford test preparation, private tutoring, and enrichment activities that give students a measurable advantage. Talented students from disadvantaged backgrounds often score lower despite their potential. To truly nurture talent across society, we must invest in more holistic assessment methods.`,
choices:["Standardized tests should be made harder to reduce grade inflation.","Students from wealthy families work harder for their scores.","Holistic assessments are too expensive for schools to adopt.","Evaluating students beyond test scores is necessary to ensure fairness.","Academic success depends primarily on a student's innate intelligence."],answer:4,
explanation:"필자는 시험 점수 이상의 다양한 평가 방식이 필요하다고 주장하므로 ④가 정답입니다."},

{id:12,pts:5,text:"다음 글에서 필자가 주장하는 바로 가장 적절한 것은?",
passage:`Social media companies profit from keeping users engaged as long as possible, using algorithms that prioritize emotionally provocative content. This business model has been linked to rising rates of anxiety, polarization, and misinformation. Voluntary self-regulation has proven insufficient. Governments must introduce enforceable standards around algorithmic transparency and user data protection, just as they regulate food safety and pharmaceutical advertising.`,
choices:["Social media should be banned for users under 18.","Users are responsible for managing their own screen time.","Voluntary company guidelines are sufficient to address social media harms.","Governments must regulate social media algorithms and data practices.","Social media platforms should prioritize entertainment over news."],answer:4,
explanation:"필자는 자율 규제가 불충분하므로 정부가 개입해야 한다고 주장합니다. ④가 정답입니다."},

{id:13,pts:5,text:"다음 글에서 필자가 주장하는 바로 가장 적절한 것은?",
passage:`Modern medicine has made extraordinary advances in treating disease, yet prevention remains vastly underfunded. Chronic diseases such as diabetes, hypertension, and obesity — largely preventable through lifestyle changes — account for the majority of healthcare costs in developed nations. Shifting even a fraction of medical spending toward public health education, accessible nutrition, and physical activity programs would yield enormous long-term savings and improve quality of life far more effectively.`,
choices:["Governments should reduce spending on hospital infrastructure.","Chronic diseases cannot be prevented through lifestyle changes alone.","Greater investment in preventive healthcare would be far more cost-effective.","Medical technology is advancing too quickly for public policy to keep pace.","Patients should be held financially responsible for lifestyle-related illnesses."],answer:3,
explanation:"예방 의학에 더 많은 투자가 필요하다는 것이 필자의 주장이므로 ③이 정답입니다."},

{id:14,pts:5,text:"다음 글에서 필자가 주장하는 바로 가장 적절한 것은?",
passage:`While artificial intelligence shows remarkable promise in fields from medicine to logistics, we must resist the temptation to deploy it without sufficient understanding of its decision-making processes. Opaque AI systems that cannot explain their outputs create serious accountability gaps — particularly when used in criminal justice, hiring, or medical diagnosis. Transparency and explainability should be non-negotiable requirements, not optional features.`,
choices:["AI development should be paused until safety standards are perfect.","Transparent and explainable AI must be a baseline requirement, not an option.","The benefits of AI in medicine outweigh its risks in all circumstances.","Criminal justice systems should not use any form of digital technology.","AI companies should remain self-regulating to encourage innovation."],answer:2,
explanation:"AI의 투명성과 설명 가능성이 선택이 아닌 필수 요건이 되어야 한다는 것이 필자의 주장입니다."},

{id:15,pts:5,text:"다음 글에서 필자가 주장하는 바로 가장 적절한 것은?",
passage:`Schools devote enormous time to teaching students what to think — content knowledge across subjects — but relatively little to teaching them how to think. Critical thinking, media literacy, and logical argumentation are skills that students will use in virtually every domain of adult life, yet they are rarely treated as standalone curriculum priorities. Education systems that neglect these skills are producing graduates ill-equipped to navigate a complex information environment.`,
choices:["Schools should eliminate content-based subjects entirely.","Critical and logical thinking skills must become central educational priorities.","Students today have more access to information than ever before.","Media literacy is best learned outside the formal school system.","Teachers are not qualified to teach critical thinking effectively."],answer:2,
explanation:"비판적 사고 등 사고 방법 교육이 교육 과정의 핵심이 되어야 한다는 것이 필자의 주장입니다."},

{id:16,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`Marie Curie was born in Warsaw, Poland, in 1867. She is the only person to have won Nobel Prizes in two different scientific disciplines — Physics in 1903 and Chemistry in 1911. Despite facing discrimination as a woman in academia, she persisted in pioneering research on radioactivity, a term she coined. Her discovery of polonium and radium laid the groundwork for modern nuclear medicine. She died in 1934 from aplastic anemia, almost certainly caused by decades of exposure to ionizing radiation.`,
choices:["Marie Curie was born in Warsaw in 1867.","She won Nobel Prizes in both Physics and Chemistry.","The term 'radioactivity' was introduced by another scientist.","She discovered both polonium and radium.","She died from a disease linked to radiation exposure."],answer:3,
explanation:"'radioactivity'라는 용어는 Marie Curie 본인이 만든 것입니다. ③에서 '다른 과학자가 만들었다'는 것은 본문의 내용과 일치하지 않으므로 정답은 ③입니다."},

{id:17,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The Great Barrier Reef, located off the coast of Queensland, Australia, is the world's largest coral reef system, stretching over 2,300 kilometers. It is home to more than 1,500 species of fish, 4,000 types of mollusk, and 240 species of birds. The reef was inscribed as a UNESCO World Heritage Site in 1981. However, rising ocean temperatures due to climate change have caused repeated mass bleaching events, threatening the reef's long-term survival.`,
choices:["The Great Barrier Reef is located near Queensland, Australia.","It stretches over 2,300 kilometers.","It was listed as a UNESCO World Heritage Site in 1981.","The reef contains fewer than 1,000 species of fish.","Climate change has caused bleaching events that threaten the reef."],answer:4,
explanation:"본문에는 1,500종 이상의 어류가 서식한다고 나와 있습니다. ④의 '1,000종 미만'은 사실과 다릅니다."},

{id:18,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The human brain contains approximately 86 billion neurons, each capable of forming thousands of connections with other neurons. These connections, called synapses, are the physical basis of learning and memory. Unlike computers, which process information sequentially, the brain processes enormous amounts of information simultaneously through massively parallel networks. Contrary to popular belief, humans use virtually all of their brain — not just ten percent — across different activities throughout the day.`,
choices:["The human brain contains approximately 86 billion neurons.","Synapses are the connections between neurons and form the basis of memory.","The brain processes information in parallel, unlike sequential computer processing.","Humans only use about ten percent of their brain capacity.","All regions of the brain are used across different daily activities."],answer:4,
explanation:"본문에서 '10% 사용'은 잘못된 믿음이라고 명시합니다. ④의 내용은 글의 내용과 일치하지 않습니다."},

{id:19,pts:5,text:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",
passage:`<p>The concept of "flow" was introduced by psychologist Mihaly Csikszentmihalyi to describe a mental state of complete absorption in a challenging activity.</p>
<p><b>(A)</b> When in flow, people report losing track of time, feeling deeply satisfied, and performing at their peak. Athletes, musicians, and programmers often describe this state.</p>
<p><b>(B)</b> However, flow is not automatic. It requires a careful balance between the difficulty of the task and the skill level of the person — too easy, and boredom sets in; too hard, and anxiety takes over.</p>
<p><b>(C)</b> Understanding this balance has practical applications in education and workplace design, where tasks can be calibrated to maximize both engagement and productivity.</p>`,
choices:["(A)-(B)-(C)","(A)-(C)-(B)","(B)-(A)-(C)","(B)-(C)-(A)","(C)-(B)-(A)"],answer:1,
explanation:"먼저 flow 상태를 설명(A), 그다음 flow가 자동적이지 않다는 조건 설명(B), 마지막으로 실용적 적용(C)으로 이어지는 것이 자연스럽습니다."},

{id:20,pts:5,text:"주어진 글 다음에 이어질 글의 순서로 가장 적절한 것은?",
passage:`<p>For most of human history, the night sky was filled with stars visible to the naked eye — a source of wonder, navigation, and mythology for every culture on Earth.</p>
<p><b>(A)</b> Today, an estimated 99% of the population of Europe and North America lives under light-polluted skies, and the Milky Way is invisible to more than one-third of humanity.</p>
<p><b>(B)</b> The spread of artificial lighting since the industrial revolution, while enormously beneficial in many ways, has gradually erased this shared human experience.</p>
<p><b>(C)</b> This loss goes beyond aesthetics: light pollution disrupts animal migration, affects plant growth cycles, and has been linked to sleep disorders and increased cancer risk in humans.</p>`,
choices:["(A)-(B)-(C)","(A)-(C)-(B)","(B)-(A)-(C)","(C)-(A)-(B)","(B)-(C)-(A)"],answer:3,
explanation:"인공 조명의 확산이 별하늘을 지웠다는 원인(B) → 구체적 통계(A) → 그로 인한 더 넓은 피해(C) 순서가 가장 논리적입니다."}
]}

,...(typeof EXTRA_SETS!=='undefined'?EXTRA_SETS:[])
]; // end SETS  (A·B·C first, then D–W from EXTRA_SETS)

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
let CS = null, answers = [], submitted = false;
let timerSecs = 0, timerInt = null, activeIdx = 0, N = 0;
let startTime = 0;

// ═══════════════════════════════════════════════════════════════
//  HOME
// ═══════════════════════════════════════════════════════════════
function renderHome(){
  const g = document.getElementById('setGrid');
  g.innerHTML = '';
  SETS.forEach(s => {
    const total = s.questions.reduce((a,q)=>a+q.pts,0);
    const d = document.createElement('div');
    d.className = 'set-card';
    d.innerHTML = `
      <div class="set-badge" style="background:${s.color}">${s.id}</div>
      <div class="set-name">${s.name}</div>
      <div class="set-desc">${s.desc}</div>
      <div class="set-meta">📝 ${s.questions.length}문항 &nbsp;·&nbsp; ⏱ ${Math.floor(s.time/60)}분 &nbsp;·&nbsp; 💯 ${total}점 만점</div>
      <button class="set-start" style="background:${s.color}" onclick="startSet('${s.id}')">시작하기 →</button>`;
    g.appendChild(d);
  });
}

function goHome(){
  if(!submitted && answers.some(a=>a>0)){
    if(!confirm('저장하지 않고 홈으로 돌아가시겠습니까?')) return;
  }
  clearInterval(timerInt);
  document.getElementById('penToggle').style.display='none';
  document.getElementById('drawBar').classList.remove('show');
  document.getElementById('homeScreen').style.display='';
  document.getElementById('examScreen').style.display='none';
}

function startSet(id){
  CS = SETS.find(s=>s.id===id);
  N = CS.questions.length;
  answers = new Array(N).fill(0);
  submitted = false; activeIdx = 0;
  timerSecs = CS.time;
  document.getElementById('homeScreen').style.display='none';
  document.getElementById('examScreen').style.display='';
  document.getElementById('hdrTitle').textContent = CS.name;
  document.getElementById('hdrCode').textContent = '2025-ENG-'+CS.id;
  document.getElementById('footerInfo').textContent = `CODE 2025-ENG-${CS.id}  ·  ${N}문항 · ${CS.questions.reduce((a,q)=>a+q.pts,0)}점`;
  document.getElementById('submitBtn').disabled = false;
  document.getElementById('submitBtn').textContent = '제출';
  document.getElementById('scoreBar').classList.remove('show');
  document.getElementById('qPanel').scrollTop = 0;
  startTime = Date.now();
  renderQ(); renderOMR(); refreshStats(); startTimer(); initScroll(); _onStartSet();
}

// ═══════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════
function renderQ(){
  const c = document.getElementById('qContainer');
  c.innerHTML = '';
  CS.questions.forEach((q,i)=>{
    const div = document.createElement('div');
    div.className = 'q-item'; div.id = `q${i}`;
    div.innerHTML = `
      <div class="q-top">
        <div class="q-num-wrap"><div class="q-badge" id="badge${i}"></div><div class="q-num">${q.id}.</div></div>
        <div class="q-text">${q.text}</div>
        <div class="q-pts">[${q.pts}점]</div>
      </div>
      ${q.passage?`<div class="passage">${q.passage}</div>`:''}
      <div class="choices" id="ch${i}">${q.choices.map((c,ci)=>`
        <div class="choice" id="c${i}_${ci+1}" onclick="pick(${i},${ci+1})">
          <div class="choice-num">${ci+1}</div><div class="choice-text">${c}</div>
        </div>`).join('')}
      </div>
      <div class="expl" id="expl${i}">💡 <strong>해설</strong> ${q.explanation}</div>`;
    c.appendChild(div);
  });
}

function renderOMR(){
  const b = document.getElementById('omrBody');
  b.innerHTML = '';
  CS.questions.forEach((q,i)=>{
    const row = document.createElement('div');
    row.className = 'omr-row'; row.id = `omrRow${i}`;
    row.innerHTML = `
      <div class="omr-qn" onclick="scrollToQ(${i})">${q.id}</div>
      <div class="omr-bbs">${[1,2,3,4,5].map(n=>`<div class="omr-bb" id="bb${i}_${n}" onclick="pick(${i},${n})">${n}</div>`).join('')}</div>
      <div class="omr-res" id="res${i}"></div>`;
    b.appendChild(row);
  });
}

// ═══════════════════════════════════════════════════════════════
//  INTERACTION
// ═══════════════════════════════════════════════════════════════
function pick(qi,ch){
  if(submitted) return;
  answers[qi] = answers[qi]===ch ? 0 : ch;
  refreshQ(qi); refreshStats();
}

function refreshQ(qi){
  const a = answers[qi];
  for(let n=1;n<=5;n++){
    const c=document.getElementById(`c${qi}_${n}`);
    const b=document.getElementById(`bb${qi}_${n}`);
    if(c){c.classList.remove('sel','ca','wa'); if(!submitted&&a===n) c.classList.add('sel');}
    if(b){b.classList.remove('sel','aok','ang'); if(!submitted&&a===n) b.classList.add('sel');}
  }
  document.getElementById(`omrRow${qi}`)?.classList.toggle('answered',a>0);
}

function refreshStats(){
  const done = answers.filter(a=>a>0).length;
  document.getElementById('hdrProg').textContent = `${done}/${N}`;
  document.getElementById('secSub').textContent = `${N}문항 중 ${done}번 답함`;
  document.getElementById('omrStats').innerHTML = `${N}문항 중 ${done}개 응답`;
  document.getElementById('omrDot').classList.toggle('on', done>0);
}

// ═══════════════════════════════════════════════════════════════
//  SUBMIT
// ═══════════════════════════════════════════════════════════════
function submitExam(){
  if(submitted) return;
  const rem = answers.filter(a=>a===0).length;
  if(rem>0 && !confirm(`${rem}개 문항에 아직 답하지 않았습니다.\n그래도 제출하시겠습니까?`)) return;
  submitted = true;
  clearInterval(timerInt);
  document.getElementById('submitBtn').disabled=true;
  document.getElementById('submitBtn').textContent='채점 완료';

  let correct=0, earned=0;
  CS.questions.forEach((q,i)=>{
    const ua=answers[i], ok=ua===q.answer;
    if(ok){correct++;earned+=q.pts;}

    for(let n=1;n<=5;n++){
      const c=document.getElementById(`c${i}_${n}`);
      const b=document.getElementById(`bb${i}_${n}`);
      if(c){c.classList.remove('sel'); if(n===q.answer) c.classList.add('ca'); else if(ua===n) c.classList.add('wa');}
      if(b){b.classList.remove('sel'); if(n===q.answer) b.classList.add('aok'); else if(ua===n) b.classList.add('ang');}
    }
    const res=document.getElementById(`res${i}`);
    if(res){ if(ok){res.textContent='○';res.className='omr-res ok';} else if(ua>0){res.textContent='✕';res.className='omr-res ng';} else{res.textContent='–';res.className='omr-res';} }

    const badge=document.getElementById(`badge${i}`);
    if(badge){badge.textContent=ok?'○':'✕';badge.className='q-badge show '+(ok?'ok':'ng');}

    document.getElementById(`expl${i}`).classList.add('show');
  });

  const total=CS.questions.reduce((a,q)=>a+q.pts,0);
  const elapsedSec = Math.floor((Date.now()-startTime)/1000);
  const em=String(Math.floor(elapsedSec/60)).padStart(2,'0');
  const es=String(elapsedSec%60).padStart(2,'0');
  const elapsedStr=`${em}분 ${es}초`;
  document.getElementById('scoreNum').innerHTML=`${earned}<sup>점</sup>`;
  document.getElementById('scoreDetail').innerHTML=`<b>정답 ${correct}개</b> / 오답 ${N-correct}개 / 미응답 ${answers.filter(a=>a===0).length}개<br>총점 ${total}점 만점 &nbsp;·&nbsp; ⏱ 소요시간 <b>${elapsedStr}</b>`;
  document.getElementById('scoreBar').classList.add('show');
  document.getElementById('hdrTitle').textContent=CS.name+' · 채점 완료';
  document.getElementById('hdrProg').textContent=`${correct}/${N} (${earned}점)`;
  document.getElementById('omrStats').innerHTML=`<strong>${earned}점 / ${total}점</strong><br>정답 ${correct}개 · 오답 ${N-correct}개`;
  document.getElementById('omrBtns').innerHTML=`<button class="omr-btn" onclick="retrySet()">다시 풀기</button><button class="omr-btn" onclick="goHome()">홈으로</button>`;
  document.getElementById('qPanel').scrollTop=0;

  const resultPayload = buildResultPayload({correct, earned, total, elapsedSec, elapsedStr});
  sendResultToSheet(resultPayload);

  showToast(`채점 완료! ${earned}점 (${correct}/${N} 정답)`);
}

// ═══════════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════════
function scrollToQ(i){document.getElementById(`q${i}`)?.scrollIntoView({behavior:'smooth',block:'start'});}
function toUnanswered(){const i=answers.findIndex(a=>a===0);i>=0?scrollToQ(i):showToast('모든 문항에 답했습니다!');}
function clearAll(){if(submitted)return;if(!confirm('모든 답을 지우시겠습니까?'))return;answers.fill(0);CS.questions.forEach((_,i)=>refreshQ(i));refreshStats();}
function retrySet(){if(confirm('다시 풀겠습니까? 답안이 초기화됩니다.'))startSet(CS.id);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

function startTimer(){
  clearInterval(timerInt);
  const el=document.getElementById('timer');
  function tick(){
    const m=String(Math.floor(timerSecs/60)).padStart(2,'0');
    const s=String(timerSecs%60).padStart(2,'0');
    el.textContent=`${m}:${s}`;
    el.classList.toggle('urgent',timerSecs<=300);
    if(timerSecs<=0){clearInterval(timerInt);submitExam();return;}
    timerSecs--;
  }
  tick(); timerInt=setInterval(tick,1000);
}

function initScroll(){
  const panel=document.getElementById('qPanel');
  const handler=()=>{
    let best=0,bestV=-1;
    CS.questions.forEach((_,i)=>{
      const el=document.getElementById(`q${i}`);
      if(!el)return;
      const r=el.getBoundingClientRect(),pr=panel.getBoundingClientRect();
      const vis=Math.max(0,Math.min(r.bottom,pr.bottom)-Math.max(r.top,pr.top));
      if(vis>bestV){bestV=vis;best=i;}
    });
    document.querySelectorAll('.omr-row').forEach(r=>r.classList.remove('active'));
    document.getElementById(`omrRow${best}`)?.classList.add('active');
    activeIdx=best;
  };
  panel.removeEventListener('scroll',panel._scrollH||null);
  panel._scrollH=handler;
  panel.addEventListener('scroll',handler,{passive:true});
}

document.addEventListener('keydown',e=>{
  if(!CS||submitted)return;
  const n=parseInt(e.key);
  if(n>=1&&n<=5){pick(activeIdx,n);return;}
  if(e.key==='ArrowDown'||e.key==='Tab'){e.preventDefault();scrollToQ(Math.min(activeIdx+1,N-1));}
  if(e.key==='ArrowUp'){e.preventDefault();scrollToQ(Math.max(activeIdx-1,0));}
});

localStorage.removeItem('mockExam_studentClass');
localStorage.removeItem('mockExam_studentNumber');
localStorage.removeItem('mockExam_studentName');

// ═══════════════════════════════════════════════════════════════
//  DRAWING — perfect-freehand
// ═══════════════════════════════════════════════════════════════
let _gs = null;
let _penOn = false, _dTool = 'pen', _dColor = '#e74c3c', _dSize = 1.5;
let _strokes = [], _cur = null, _ptg = false;

(async () => {
  try {
    const m = await import('https://esm.sh/perfect-freehand@1.2.2');
    _gs = m.getStroke;
  } catch(e) {}
})();

function togglePen() {
  _penOn = !_penOn;
  document.getElementById('penToggle').classList.toggle('on', _penOn);
  document.getElementById('drawBar').classList.toggle('show', _penOn);
  _updateCv();
}

function setDTool(t) {
  _dTool = t;
  document.getElementById('dtPen').classList.toggle('on', t === 'pen');
  document.getElementById('dtErase').classList.toggle('on', t === 'erase');
  _updateCv();
}

function setDCol(el) {
  document.querySelectorAll('.dcol').forEach(e => e.classList.remove('on'));
  el.classList.add('on');
  _dColor = el.dataset.c;
  if (_dTool === 'erase') setDTool('pen');
}

function clearDrawing() { _strokes = []; _cur = null; _redraw(); }

function _updateCv() {
  const cv = document.getElementById('drawCanvas');
  cv.className = _penOn ? (_dTool === 'erase' ? 'eraser-on' : 'pen-on') : '';
}

function _initDraw() {
  const cv = document.getElementById('drawCanvas');
  cv.addEventListener('pointerdown', _onDown, {passive: false});
  cv.addEventListener('pointermove', _onMove, {passive: false});
  cv.addEventListener('pointerup', _onUp);
  cv.addEventListener('pointercancel', _onUp);
  cv.addEventListener('contextmenu', e => e.preventDefault());
}

function _resizeCv() {
  const cv = document.getElementById('drawCanvas');
  if (!cv) return;
  const panel = document.getElementById('qPanel');
  const dpr = window.devicePixelRatio || 1;
  const w = panel.clientWidth, h = panel.scrollHeight;
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  _redraw();
}

function _ptOf(e) {
  const p = document.getElementById('qPanel'), r = p.getBoundingClientRect();
  return [e.clientX - r.left, e.clientY - r.top + p.scrollTop, e.pressure || 0.5];
}

function _onDown(e) {
  e.preventDefault();
  _ptg = true;
  _cur = { pts: [_ptOf(e)], color: _dColor, size: _dSize, er: _dTool === 'erase' };
}

function _onMove(e) {
  if (!_ptg) return;
  e.preventDefault();
  _cur.pts.push(_ptOf(e));
  _redraw();
}

function _onUp() {
  if (!_ptg) return;
  _ptg = false;
  if (_cur && _cur.pts.length > 1) _strokes.push(_cur);
  _cur = null;
  _redraw();
}

function _svgPath(pts) {
  if (pts.length < 2) return '';
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0,y0] = pts[i], [x1,y1] = pts[i+1];
    d += `Q${x0.toFixed(1)},${y0.toFixed(1)} ${((x0+x1)/2).toFixed(1)},${((y0+y1)/2).toFixed(1)}`;
  }
  const L = pts[pts.length-1];
  return d + `L${L[0].toFixed(1)},${L[1].toFixed(1)}Z`;
}

function _drawS(ctx, s) {
  if (s.pts.length < 2) return;
  ctx.save();
  if (s.er) ctx.globalCompositeOperation = 'destination-out';
  if (_gs) {
    const ol = _gs(s.pts, {
      size: s.size * 4,
      smoothing: 0.5,
      thinning: 0.6,
      streamline: 0.5,
      simulatePressure: true,
      last: !_ptg,
    });
    if (ol.length >= 2) {
      ctx.fillStyle = s.er ? 'rgba(0,0,0,1)' : s.color;
      ctx.fill(new Path2D(_svgPath(ol)));
    }
  } else {
    ctx.beginPath();
    ctx.strokeStyle = s.er ? 'rgba(0,0,0,1)' : s.color;
    ctx.lineWidth = s.size * 2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    s.pts.forEach(([x,y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.stroke();
  }
  ctx.restore();
}

function _redraw() {
  const cv = document.getElementById('drawCanvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.save();
  ctx.scale(dpr, dpr);
  [..._strokes, _cur].filter(Boolean).forEach(s => _drawS(ctx, s));
  ctx.restore();
}

function _onStartSet() {
  _strokes = []; _cur = null; _penOn = false;
  document.getElementById('penToggle').style.display = 'block';
  document.getElementById('penToggle').classList.remove('on');
  document.getElementById('drawBar').classList.remove('show');
  _updateCv();
  setTimeout(_resizeCv, 150);
}

window.addEventListener('resize', () => {
  if (document.getElementById('examScreen').style.display !== 'none') _resizeCv();
});

_initDraw();
renderHome();
</script>
