<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>영어 모의고사</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#f4efe6;--passage:#ebe4d4;--border:#ddd5c2;--ink:#1e1e1e;--sub:#666;--red:#c0392b;--hdr:#111;--omr:210px}
body{font-family:Georgia,'Noto Serif KR',serif;background:#1a1a1a;color:var(--ink);height:100dvh;overflow:hidden;font-size:15px}

/* ── HOME ── */
#homeScreen{height:100dvh;overflow-y:auto;background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 100%);display:flex;flex-direction:column;align-items:center;padding:48px 24px 60px}
.home-logo{font-size:13px;color:#888;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;font-family:sans-serif}
.home-title{font-size:32px;font-weight:700;color:white;margin-bottom:6px;text-align:center}
.home-sub{font-size:14px;color:#888;margin-bottom:48px;font-family:sans-serif;text-align:center}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;width:100%;max-width:960px}
.set-card{background:#1e1e2e;border-radius:14px;padding:28px 26px;border:1px solid #333;transition:transform .15s,border-color .15s;cursor:pointer}
.set-card:hover{transform:translateY(-3px);border-color:#555}
.set-badge{display:inline-block;width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:white;margin-bottom:16px;font-family:sans-serif}
.set-name{font-size:18px;font-weight:700;color:white;margin-bottom:6px}
.set-desc{font-size:13px;color:#aaa;line-height:1.6;margin-bottom:18px;font-family:sans-serif}
.set-meta{font-size:11px;color:#666;font-family:sans-serif;margin-bottom:18px}
.set-start{width:100%;padding:10px 0;border:none;border-radius:8px;color:white;font-size:14px;font-weight:700;cursor:pointer;font-family:sans-serif;transition:opacity .15s}
.set-start:hover{opacity:.85}

/* ── HEADER ── */
.hdr{position:fixed;top:0;left:0;right:0;z-index:200;height:52px;background:var(--hdr);display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #333}
.hdr-back{color:#aaa;font-size:13px;cursor:pointer;white-space:nowrap;font-family:sans-serif}
.hdr-back:hover{color:white}
.hdr-title{flex:1;min-width:0;font-size:13px;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-title strong{color:white}
.hdr-title small{color:#555;margin-left:6px;font-size:10px;font-family:monospace}
.hdr-prog{color:#bbb;font-size:13px;white-space:nowrap;font-family:sans-serif}
.hdr-timer{font-size:15px;font-weight:700;color:white;font-family:'Courier New',monospace;white-space:nowrap;min-width:50px;text-align:right;transition:color .3s}
.hdr-timer.urgent{color:#e74c3c}
.hdr-submit{background:#e74c3c;color:white;border:none;padding:7px 16px;border-radius:5px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:sans-serif}
.hdr-submit:hover{background:#a93226}
.hdr-submit:disabled{background:#555;cursor:default}

/* ── LAYOUT ── */
.layout{display:flex;height:100dvh;padding-top:52px}

/* ── Q PANEL ── */
.q-panel{flex:1;background:var(--paper);overflow-y:auto;padding:26px 40px 60px;scroll-behavior:smooth}
.q-panel::-webkit-scrollbar{width:5px}
.q-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);padding-bottom:12px;margin-bottom:24px;border-bottom:1.5px solid var(--border);font-family:sans-serif}
.sec-hdr span{font-weight:700;color:var(--ink)}

/* SCORE BAR */
.score-bar{display:none;background:#1a1a2e;color:white;padding:14px 40px;gap:28px;align-items:center;border-bottom:2px solid #e74c3c;margin:-26px -40px 26px;flex-shrink:0}
.score-bar.show{display:flex}
.score-num{font-size:38px;font-weight:700;color:#e74c3c;font-family:sans-serif;line-height:1}
.score-num sup{font-size:14px;color:#aaa;margin-left:2px}
.score-detail{font-size:13px;color:#bbb;line-height:2;font-family:sans-serif}
.score-detail b{color:white}

/* Q ITEMS */
.q-item{margin-bottom:36px;padding-bottom:32px;border-bottom:1px dashed var(--border)}
.q-item:last-child{border-bottom:none}
.q-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.q-num-wrap{position:relative;flex-shrink:0;width:36px}
.q-badge{display:none;position:absolute;top:-2px;left:-20px;font-size:20px;font-weight:700;line-height:1}
.q-badge.show{display:block}
.q-badge.ok{color:var(--red)}
.q-badge.ng{color:#e74c3c}
.q-num{font-size:17px;font-weight:700}
.q-text{flex:1;font-size:15px;line-height:1.75;color:#222}
.q-pts{font-size:11px;color:#999;background:var(--passage);padding:2px 7px;border-radius:3px;white-space:nowrap;margin-top:3px;flex-shrink:0;font-family:sans-serif}
.passage{background:var(--passage);border-left:3px solid #c8b89a;padding:14px 18px;margin:0 0 16px;font-size:14px;line-height:2;border-radius:0 4px 4px 0;color:#2a2a2a}
.passage p{margin-bottom:6px}
.passage p:last-child{margin-bottom:0}
.choices{display:flex;flex-direction:column;gap:7px;padding-left:20px}
.choice{display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:6px 10px;border-radius:6px;transition:background .12s;font-size:14px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.choice:hover{background:rgba(0,0,0,.05)}
.choice-num{width:26px;height:26px;border-radius:50%;border:1.5px solid #bbb;display:flex;align-items:center;justify-content:center;font-size:12px;color:#999;flex-shrink:0;transition:all .15s;font-family:sans-serif}
.choice.sel .choice-num{background:#1e1e1e;border-color:#1e1e1e;color:white}
.choice.ca .choice-num{background:var(--red);border-color:var(--red);color:white}
.choice.wa .choice-num{background:#999;border-color:#999;color:white}
.choice.ca .choice-text{font-weight:600}

/* EXPLANATION */
.expl{display:none;margin-top:12px;padding:10px 14px;background:#fff8f0;border-left:3px solid #e6a020;border-radius:0 6px 6px 0;font-size:13px;color:#555;line-height:1.7;font-family:sans-serif}
.expl strong{color:#c0700a}
.expl.show{display:block}

/* ── OMR ── */
.omr-panel{width:var(--omr);background:#fff;border-left:1px solid #e0e0e0;display:flex;flex-direction:column;overflow:hidden}
.omr-head{padding:10px 12px;border-bottom:1px solid #eee;background:#f9f9f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.omr-head-lbl{font-size:12px;font-weight:700;color:#333;font-family:sans-serif}
.omr-dot{width:8px;height:8px;border-radius:50%;background:#ddd;transition:background .3s}
.omr-dot.on{background:#27ae60}
.omr-col-hdr{display:flex;align-items:center;padding:3px 8px 1px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
.omr-cqn{width:20px}
.omr-cnums{display:flex;flex:1;justify-content:space-around}
.omr-cnum{width:22px;text-align:center;font-size:9px;color:#bbb;font-family:sans-serif;font-weight:700}
.omr-cres{width:16px}
.omr-body{flex:1;overflow-y:auto;padding:3px 0}
.omr-body::-webkit-scrollbar{width:3px}
.omr-body::-webkit-scrollbar-thumb{background:#ddd;border-radius:2px}
.omr-row{display:flex;align-items:center;padding:4px 8px;gap:2px;border-left:3px solid transparent;transition:border-color .1s,background .1s}
.omr-row.active{border-left-color:#333;background:#f5f5f5}
.omr-qn{width:20px;font-size:11px;color:#aaa;text-align:right;padding-right:3px;font-family:sans-serif;cursor:pointer;flex-shrink:0}
.omr-qn:hover{color:#333;font-weight:700}
.omr-bbs{display:flex;gap:2px;flex:1;justify-content:space-around}
.omr-bb{width:22px;height:22px;border-radius:50%;border:1.5px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:9.5px;color:#bbb;cursor:pointer;transition:all .15s;font-family:sans-serif;font-weight:600;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.omr-bb:hover{border-color:#888;color:#333}
.omr-bb.sel{background:#1e1e1e;border-color:#1e1e1e;color:white}
.omr-bb.aok{background:var(--red);border-color:var(--red);color:white}
.omr-bb.ang{background:#aaa;border-color:#aaa;color:white}
.omr-res{width:16px;text-align:center;font-size:13px;color:#ddd;flex-shrink:0;font-family:sans-serif}
.omr-res.ok{color:#27ae60}
.omr-res.ng{color:#e74c3c}
.omr-foot{border-top:1px solid #eee;background:#f9f9f9;padding:10px 12px;flex-shrink:0}
.omr-stats{font-size:10.5px;color:#888;line-height:2;font-family:sans-serif;margin-bottom:7px}
.omr-stats strong{color:var(--red);font-size:13px}
.omr-btns{display:flex;gap:5px}
.omr-btn{flex:1;padding:5px 0;font-size:10px;font-family:sans-serif;border:1px solid #ddd;background:white;border-radius:4px;cursor:pointer;color:#666}
.omr-btn:hover{background:#f0f0f0}
.omr-btn.d{color:#e74c3c;border-color:#f0b8b8}
.omr-btn.d:hover{background:#fdf0f0}

/* ── TOAST ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);background:#333;color:white;padding:9px 18px;border-radius:20px;font-size:13px;font-family:sans-serif;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── RESPONSIVE ── */
@media(max-width:680px){:root{--omr:160px}.q-panel{padding:18px 18px 60px}}
@media(max-width:480px){:root{--omr:142px}.omr-bb{width:19px;height:19px;font-size:8px}}

/* ── DRAW ── */
.q-panel{position:relative}
#drawCanvas{position:absolute;top:0;left:0;pointer-events:none;z-index:20;touch-action:none}
#drawCanvas.pen-on{pointer-events:all;cursor:crosshair}
#drawCanvas.eraser-on{pointer-events:all;cursor:cell}
.pen-toggle{background:transparent;border:1.5px solid #555;color:#bbb;padding:5px 10px;border-radius:5px;font-size:12px;cursor:pointer;font-family:sans-serif;white-space:nowrap;transition:all .15s;display:none}
.pen-toggle:hover{border-color:#aaa;color:white}
.pen-toggle.on{background:white;color:#111;border-color:white}
.draw-bar{display:none;align-items:center;gap:5px;padding:0 6px;border-left:1px solid #444}
.draw-bar.show{display:flex}
.dtb{width:26px;height:26px;border-radius:4px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;background:transparent;color:#aaa;flex-shrink:0;transition:all .15s}
.dtb:hover{background:#333;color:white}
.dtb.on{background:rgba(255,255,255,.15);color:white}
.dcol{width:15px;height:15px;border-radius:50%;cursor:pointer;box-sizing:content-box;border:2px solid transparent;flex-shrink:0;transition:border-color .1s;box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.dcol.on{border-color:white}
</style>
</head>
<body>

<!-- ═══ HOME ═══ -->
<div id="homeScreen">
  <div class="home-logo">영어 모의고사 시스템</div>
  <div class="home-title">세트를 선택하세요</div>
  <div class="home-sub">각 세트는 20문항 · 30분으로 구성됩니다</div>
  <div class="set-grid" id="setGrid"></div>
</div>

<!-- ═══ EXAM ═══ -->
<div id="examScreen" style="display:none">
  <div class="hdr">
    <div class="hdr-back" onclick="goHome()">← 홈</div>
    <div class="hdr-title"><strong id="hdrTitle"></strong><small id="hdrCode"></small></div>
    <div class="hdr-prog" id="hdrProg">0/20</div>
    <div class="hdr-timer" id="timer">30:00</div>
    <button class="hdr-submit" id="submitBtn" onclick="submitExam()">제출</button>
    <button class="pen-toggle" id="penToggle" onclick="togglePen()">✏ 필기</button>
    <div class="draw-bar" id="drawBar">
      <button class="dtb on" id="dtPen" onclick="setDTool('pen')" title="펜">✒</button>
      <button class="dtb" id="dtErase" onclick="setDTool('erase')" title="지우개">◻</button>
      <span style="color:#444;font-size:11px;margin:0 1px">│</span>
      <span class="dcol on" style="background:#e74c3c" data-c="#e74c3c" onclick="setDCol(this)"></span>
      <span class="dcol" style="background:#1565c0" data-c="#1565c0" onclick="setDCol(this)"></span>
      <span class="dcol" style="background:#2e7d32" data-c="#2e7d32" onclick="setDCol(this)"></span>
      <span class="dcol" style="background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.35)" data-c="#000" onclick="setDCol(this)"></span>
      <button class="dtb" onclick="clearDrawing()" title="전체 지우기" style="margin-left:2px">⌫</button>
    </div>
  </div>
  <div class="layout">
    <div class="q-panel" id="qPanel">
      <canvas id="drawCanvas"></canvas>
      <div class="score-bar" id="scoreBar">
        <div><div class="score-num" id="scoreNum">0<sup>점</sup></div></div>
        <div class="score-detail" id="scoreDetail"></div>
      </div>
      <div class="sec-hdr"><span>Ⅰ · 객관식</span><span id="secSub">20문항 중 0번 답함</span></div>
      <div id="qContainer"></div>
      <div style="text-align:center;padding:28px 0 8px;color:#aaa;font-size:12px;font-family:sans-serif">— 시험지 끝 —<br><span id="footerInfo" style="font-size:10px"></span></div>
    </div>
    <div class="omr-panel">
      <div class="omr-head"><span class="omr-head-lbl">답안지</span><div class="omr-dot" id="omrDot"></div></div>
      <div class="omr-col-hdr">
        <div class="omr-cqn"></div>
        <div class="omr-cnums"><div class="omr-cnum">1</div><div class="omr-cnum">2</div><div class="omr-cnum">3</div><div class="omr-cnum">4</div><div class="omr-cnum">5</div></div>
        <div class="omr-cres"></div>
      </div>
      <div class="omr-body" id="omrBody"></div>
      <div class="omr-foot">
        <div class="omr-stats" id="omrStats"></div>
        <div class="omr-btns" id="omrBtns">
          <button class="omr-btn" onclick="toUnanswered()">미응답↓</button>
          <button class="omr-btn d" onclick="clearAll()">지우기</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════════
//  RESULT SUBMISSION CONFIG
//  1) 아래 URL을 Google Apps Script 배포 URL로 바꾸면 제출 즉시 Google Sheet로 전송됩니다.
//  2) URL을 비워두면 채점만 되고 전송은 건너뜁니다.
// ═══════════════════════════════════════════════════════════════
const RESULT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzHZsqy87tZ_aW6To7nEeu8SsX2dyKJAMVVg6M9BThLoifcQvSCkmE0IYyv2T0OD08dSA/exec';


function getStudentInfo(){
  let studentClass = localStorage.getItem('mockExam_studentClass') || '';
  let studentNumber = localStorage.getItem('mockExam_studentNumber') || '';
  let studentName = localStorage.getItem('mockExam_studentName') || '';

  if(!studentClass) studentClass = prompt('반을 입력하세요. 예: 2-3') || '';
  if(!studentNumber) studentNumber = prompt('번호를 입력하세요. 예: 12') || '';
  if(!studentName) studentName = prompt('이름을 입력하세요.') || '';

  studentClass = studentClass.trim();
  studentNumber = studentNumber.trim();
  studentName = studentName.trim();

  if(studentClass) localStorage.setItem('mockExam_studentClass', studentClass);
  if(studentNumber) localStorage.setItem('mockExam_studentNumber', studentNumber);
  if(studentName) localStorage.setItem('mockExam_studentName', studentName);

  return {studentClass, studentNumber, studentName};
}

function buildResultPayload({correct, earned, total, elapsedSec, elapsedStr}){
  const info = getStudentInfo();
  const wrongItems = CS.questions
    .map((q,i)=>answers[i]===q.answer ? null : q.id)
    .filter(v=>v!==null);

  return {
    submittedAt: new Date().toISOString(),
    userAgent: navigator.userAgent,
    examTitle: document.title,
    setId: CS.id,
    setName: CS.name,
    studentClass: info.studentClass,
    studentNumber: info.studentNumber,
    studentName: info.studentName,
    totalQuestions: N,
    totalScore: total,
    score: earned,
    correctCount: correct,
    wrongCount: N - correct,
    unansweredCount: answers.filter(a=>a===0).length,
    elapsedSec: elapsedSec,
    elapsedText: elapsedStr,
    answers: answers.map((a,i)=>({
      qid: CS.questions[i].id,
      selected: a || '',
      correctAnswer: CS.questions[i].answer,
      isCorrect: a === CS.questions[i].answer,
      points: CS.questions[i].pts
    })),
    answersText: answers.map(a=>a || '').join(','),
    correctAnswersText: CS.questions.map(q=>q.answer).join(','),
    wrongItemsText: wrongItems.join(',')
  };
}

async function sendResultToSheet(payload){
  if(!RESULT_WEB_APP_URL || RESULT_WEB_APP_URL.includes('PASTE_YOUR_GOOGLE_APPS_SCRIPT')){
    showToast('채점 완료 · 전송 URL 미설정');
    return;
  }

  const btn = document.getElementById('submitBtn');
  if(btn) btn.textContent = '전송 중...';

  const sendPayload = Object.assign({}, payload);
  delete sendPayload.answers;
  const params = new URLSearchParams({payload: JSON.stringify(sendPayload)});
  await new Promise((resolve) => {
    const img = new Image();
    img.onload = img.onerror = resolve;
    img.src = RESULT_WEB_APP_URL + '?' + params.toString();
    setTimeout(resolve, 5000);
  });

  localStorage.setItem('lastMockExamSubmission', JSON.stringify({
    submittedAt: payload.submittedAt,
    setId: payload.setId,
    studentClass: payload.studentClass,
    studentNumber: payload.studentNumber,
    studentName: payload.studentName,
    score: payload.score
  }));

  if(btn) btn.textContent = '전송 완료';
  showToast('결과가 전송되었습니다.');
}

// sets-extra.js  — 20 extra sets (D–W), each 20 questions × 5 pts = 100 pts, 45 min
const EXTRA_SETS = [

// ── SET D : 빈칸완성 II  (심리·인지) ──────────────────────────────
{id:'D',name:'세트 D · 빈칸 완성 Ⅱ',desc:'심리학·인지과학 주제의 빈칸 완성 유형',color:'#dc2626',time:45*60,questions:[
{id:1,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`The pressure to ______ to group expectations is a powerful force in human social behavior. Even when individuals are confident in their own judgments, they frequently change their stated opinions to align with the majority, prioritizing social harmony over personal conviction.`,
choices:["conform","compete","retreat","resist","withdraw"],answer:1,
explanation:"집단의 기대에 맞추는 행동을 '순응하다(conform)'라고 합니다. 뒤 문장의 'align with the majority'가 단서입니다."},

{id:2,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Students who are aware of their own thinking processes — a skill known as ______ — tend to be more effective learners. By monitoring what they understand and what they do not, they can identify knowledge gaps early and adjust their study strategies accordingly.`,
choices:["divergence","creativity","metacognition","motivation","discipline"],answer:3,
explanation:"자신의 사고 과정을 인식하고 모니터링하는 능력을 '메타인지(metacognition)'라 합니다."},

{id:3,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`When forming judgments under uncertainty, people rely too heavily on the first piece of information they encounter — a bias known as ______. In negotiations, whoever states a number first tends to exert disproportionate influence on the final outcome, regardless of whether that number is realistic.`,
choices:["priming","anchoring","framing","filtering","projecting"],answer:2,
explanation:"처음 접한 정보에 과도하게 의존하는 인지 편향을 '닻 내림 효과(anchoring)'라 합니다."},

{id:4,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`People typically perform well-rehearsed tasks better when others are watching — a phenomenon known as social ______. However, an audience has the opposite effect on complex or unfamiliar tasks, because heightened arousal amplifies the dominant response, which is error-prone for difficult material.`,
choices:["comparison","facilitation","exclusion","modeling","cohesion"],answer:2,
explanation:"타인의 존재가 익숙한 과제 수행을 향상시키는 현상을 '사회적 촉진(social facilitation)'이라 합니다."},

{id:5,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Carol Dweck found that students who believe intelligence can be developed through effort tend to embrace challenges rather than avoid them. She called this a ______ mindset, contrasting it with the belief that abilities are fixed and innate — a view that causes people to give up when they encounter difficulty.`,
choices:["flexible","growth","positive","adaptive","creative"],answer:2,
explanation:"지능이 노력으로 발전 가능하다는 믿음을 Dweck은 '성장(growth)' 마인드셋이라 명명했습니다."},

{id:6,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Exposure to one stimulus can unconsciously shape responses to a later stimulus — a process called ______. In a classic experiment, participants shown words associated with old age subsequently walked more slowly down a hallway, with no awareness that the words had influenced their behavior.`,
choices:["encoding","linking","priming","triggering","adapting"],answer:3,
explanation:"선행 자극이 후속 자극에 대한 반응에 무의식적으로 영향을 미치는 것을 '점화(priming)'라 합니다."},

{id:7,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`The social rule of ______ compels people to repay what others have given them — whether gifts, favors, or concessions. This norm is so powerful that even unsolicited gifts create a sense of obligation, making it a widely exploited principle in marketing, diplomacy, and everyday social exchange.`,
choices:["authority","reciprocity","commitment","liking","scarcity"],answer:2,
explanation:"받은 것을 돌려주어야 한다는 사회적 규범을 '호혜성(reciprocity)'이라 합니다."},

{id:8,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Behavioral economists have shown that the pain of losing a given sum is felt roughly twice as intensely as the pleasure of gaining the same amount. This ______ causes individuals to make risk-averse choices that are often suboptimal, prioritizing the avoidance of loss over the pursuit of equivalent gain.`,
choices:["risk tolerance","anchoring effect","loss aversion","cognitive load","recency bias"],answer:3,
explanation:"손실을 이익보다 심리적으로 강하게 느끼는 경향을 '손실 회피(loss aversion)'라 합니다."},

{id:9,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`The ______ effect demonstrates that a patient's belief in a treatment's power can itself produce real physiological improvements, even when the treatment contains no active ingredients. Far from being a mere curiosity, this effect reveals how profoundly the mind can influence the body's healing processes.`,
choices:["halo","nocebo","placebo","observer","contrast"],answer:3,
explanation:"의학적으로 효과 없는 치료에 대한 믿음이 실제 개선을 일으키는 현상을 '플라시보(placebo)' 효과라 합니다."},

{id:10,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Items perceived as rare or soon to be unavailable are judged as more desirable — a tendency known as the ______ principle. This bias explains why limited-edition products command premium prices and why the mere threat of restriction often dramatically increases public demand for a product.`,
choices:["authority","novelty","scarcity","exclusivity","urgency"],answer:3,
explanation:"희소성이 높은 것을 더 가치 있다고 여기는 경향을 '희소성(scarcity)' 원칙이라 합니다."},

{id:11,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`When people hold two contradictory beliefs simultaneously, or when their behavior conflicts with their values, they experience a state of psychological discomfort known as cognitive ______. To resolve this tension, they often unconsciously adjust their beliefs or rationalize their actions rather than changing their behavior.`,
choices:["flexibility","dissonance","paralysis","overload","fatigue"],answer:2,
explanation:"상충되는 믿음·행동에서 비롯되는 심리적 불편함을 '인지 부조화(cognitive dissonance)'라 합니다."},

{id:12,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Albert Bandura introduced the concept of self-______ — an individual's belief in their capacity to execute the behaviors required to achieve specific goals. People with high levels of this belief are more likely to attempt difficult tasks, persist through obstacles, and ultimately perform at higher levels than those who doubt their own capabilities.`,
choices:["esteem","regulation","efficacy","awareness","determination"],answer:3,
explanation:"특정 과제를 수행할 수 있다는 개인의 믿음을 '자기 효능감(self-efficacy)'이라 합니다."},

{id:13,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`When individuals work as part of a group, they often exert less effort than they would if working alone — a phenomenon called social ______. This reduction in individual output tends to grow as group size increases, because personal accountability becomes more diffuse when responsibility is shared among many.`,
choices:["norming","bonding","loafing","priming","conforming"],answer:3,
explanation:"집단 속에서 개인이 혼자 할 때보다 적은 노력을 기울이는 현상을 '사회적 태만(social loafing)'이라 합니다."},

{id:14,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`When explaining the behavior of others, we tend to overestimate personality traits and underestimate situational factors — an error known as fundamental ______. We assume the driver who cut us off is simply reckless, rarely pausing to consider that they might be rushing to an emergency.`,
choices:["perception","attribution","confirmation","selection","projection"],answer:2,
explanation:"타인의 행동 원인을 상황보다 성격 탓으로 과도하게 귀인하는 것을 '근본적 귀인 오류(fundamental attribution error)'라 합니다."},

{id:15,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Mihaly Csikszentmihalyi described ______ as a mental state of complete absorption in a challenging yet manageable activity. During these experiences, individuals lose track of time, feel deeply satisfied, and typically perform at their peak without experiencing the activity as effortful or stressful.`,
choices:["lucidity","transcendence","flow","clarity","presence"],answer:3,
explanation:"과제에 완전히 몰입된 최적 경험 상태를 Csikszentmihalyi는 '몰입(flow)'이라 명명했습니다."},

{id:16,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Research has shown that the presence of onlookers actually decreases the likelihood that any single person will help in an emergency. This ______ effect occurs because witnesses diffuse responsibility among each other, each assuming that someone else will intervene, resulting in a collective failure to act.`,
choices:["conformity","observer","bystander","proximity","diffusion"],answer:3,
explanation:"구경꾼이 많을수록 개인의 도움 행동이 줄어드는 현상을 '방관자(bystander)' 효과라 합니다."},

{id:17,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Activities undertaken for their own sake — for the pleasure or satisfaction they provide — are said to be ______ motivated. Research consistently shows that such motivation produces deeper engagement, greater creativity, and longer persistence than activities driven by external rewards such as money or grades.`,
choices:["extrinsically","indirectly","intrinsically","emotionally","behaviorally"],answer:3,
explanation:"내적 만족 자체를 위해 행동하는 동기를 '내재적(intrinsically)' 동기라 합니다."},

{id:18,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`People naturally gravitate toward information that ______ their pre-existing beliefs while dismissing evidence that challenges them. Known as confirmation bias, this tendency can be particularly dangerous in medicine, law, and public policy, where accurate and impartial judgment is essential to sound decision-making.`,
choices:["questions","replaces","confirms","evaluates","enriches"],answer:3,
explanation:"기존 믿음을 지지하는 정보를 선택적으로 수용하고 반증을 무시하는 경향을 '확증 편향(confirmation bias)'이라 합니다."},

{id:19,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`People consistently ______ the degree to which others notice their appearance, mistakes, and behavior. In reality, individuals are far too preoccupied with their own concerns to pay sustained attention to others, yet the perception of being constantly scrutinized can significantly amplify social anxiety.`,
choices:["underrate","ignore","exaggerate","minimize","overlook"],answer:3,
explanation:"타인이 자신을 과도하게 주목한다고 착각하는 '스포트라이트 효과(spotlight effect)'를 설명하므로 '과장하다(exaggerate)'가 적절합니다."},

{id:20,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`When individuals are aware that their performance might confirm a negative ______ about a group they belong to, they often experience anxiety that actually impairs their performance. This effect can persist even when people personally reject the stereotype, contributing to persistent achievement gaps across demographic groups.`,
choices:["bias","stereotype","prejudice","expectation","assumption"],answer:2,
explanation:"자신이 속한 집단에 대한 부정적 고정관념을 확인시킬 수 있다는 불안을 '고정관념 위협(stereotype threat)'이라 하며, 빈칸에는 '고정관념(stereotype)'이 들어갑니다."}
]},

// ── SET E : 빈칸완성 III  (자연과학·기술) ─────────────────────────
{id:'E',name:'세트 E · 빈칸 완성 Ⅲ',desc:'자연과학·기술 주제의 빈칸 완성 유형',color:'#ea580c',time:45*60,questions:[
{id:1,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`The discovery in 1953 that DNA has a double ______ structure immediately suggested a copying mechanism for genetic information. The two complementary strands can separate and each serve as a template for building an identical copy, explaining with mathematical elegance how heritable traits are transmitted across generations.`,
choices:["spiral","helix","lattice","strand","chain"],answer:2,
explanation:"DNA의 이중 나선 구조를 '이중 헬릭스(double helix)'라 합니다."},

{id:2,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`CRISPR-Cas9 functions as a molecular ______, allowing scientists to cut DNA at precisely specified locations. Once the strand is cut, researchers can disable a faulty gene, insert a corrective sequence, or study gene function — all with a speed and accuracy that earlier gene-editing tools could not approach.`,
choices:["microscope","compass","scissors","bridge","filter"],answer:3,
explanation:"CRISPR-Cas9는 DNA를 특정 위치에서 자르는 '가위(scissors)' 역할을 합니다."},

{id:3,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Bacteria exposed to antibiotics that fail to kill them can pass their resistance genes to neighboring cells. Over time, this ______ pressure selects for strains that survive drug treatment, rendering previously effective medications useless. The problem is worsened by incomplete antibiotic courses and their overuse in industrial agriculture.`,
choices:["immune","reproductive","selective","chemical","genetic"],answer:3,
explanation:"항생제에 살아남은 내성균만 선별적으로 증식하게 되는 것을 '선택적(selective)' 압력이라 합니다."},

{id:4,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`As the Arctic warms, ice sheets melt to reveal darker ocean surfaces that absorb more heat, causing further warming. This ______ cycle — where an initial change triggers processes that amplify rather than dampen it — is one reason scientists warn that early climate action is far more effective than late intervention.`,
choices:["defensive","restorative","self-limiting","self-reinforcing","adaptive"],answer:4,
explanation:"온난화가 추가 온난화를 가속하는 순환을 '자기 강화(self-reinforcing)' 사이클이라 합니다."},

{id:5,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Observations of galaxy rotation rates reveal that visible matter alone cannot account for the gravitational forces holding galaxies together. Scientists propose that roughly 85 percent of all matter in the universe is ______ — a substance that neither emits nor absorbs light, yet exerts significant gravitational pull on ordinary matter.`,
choices:["plasma","exotic","dark","condensed","antimatter"],answer:3,
explanation:"빛과 상호작용하지 않지만 중력 효과를 지닌 물질을 '암흑(dark)' 물질이라 합니다."},

{id:6,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Scientists once believed the adult brain's structure was largely fixed after childhood. We now know that neural pathways can be ______ throughout life in response to learning, experience, or injury — a capacity called neuroplasticity that has revolutionized rehabilitation medicine and approaches to lifelong education.`,
choices:["preserved","rewired","simplified","isolated","restored"],answer:2,
explanation:"뇌 신경 경로가 경험에 따라 변화하는 것을 '재배선된다(rewired)'고 표현합니다."},

{id:7,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`The gut microbiome — the community of trillions of microorganisms in the digestive tract — functions as a complex internal ______. These organisms help digest food, regulate the immune system, and produce chemicals that influence mood and cognition, making their health central to overall human well-being.`,
choices:["filter","ecosystem","barrier","network","reservoir"],answer:2,
explanation:"장 내 미생물 군집이 기능하는 복잡한 내부 체계를 '생태계(ecosystem)'로 표현합니다."},

{id:8,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Nuclear fusion — the process that powers stars — combines hydrogen nuclei at extreme temperatures to release enormous energy with very little radioactive waste. If scientists can sustain controlled fusion reactions on Earth, it could provide a virtually ______ supply of clean energy, drawing on hydrogen derived from seawater.`,
choices:["stable","renewable","limitless","reliable","alternative"],answer:3,
explanation:"핵융합이 수소 연료의 풍부함으로 인해 사실상 '무한한(limitless)' 청정에너지를 공급할 가능성을 설명합니다."},

{id:9,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Traditional software requires programmers to specify rules explicitly. Machine learning inverts this approach: instead of being told what to do, algorithms ______ patterns from large datasets and use those patterns to make decisions on new, unseen inputs. Performance typically improves as more data is provided.`,
choices:["extract","describe","demonstrate","follow","confirm"],answer:1,
explanation:"머신러닝은 대규모 데이터에서 패턴을 '추출하여(extract)' 학습합니다."},

{id:10,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Epigenetics explores how environmental factors — diet, stress, trauma, and toxin exposure — can ______ which genes are expressed in a cell without altering the DNA sequence itself. Through chemical modifications to DNA or surrounding proteins, these environmental influences can switch genes on or off, sometimes across generations.`,
choices:["determine","program","control","regulate","eliminate"],answer:4,
explanation:"환경 요인이 DNA 서열 변경 없이 유전자 발현을 '조절(regulate)'하는 것이 후성유전학의 핵심입니다."},

{id:11,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Self-driving cars use combinations of sensors, cameras, radar, and lidar to ______ their environment in real time. Onboard AI systems process this data to identify pedestrians, predict the behavior of other vehicles, and make split-second navigation decisions — all without requiring human input.`,
choices:["alter","model","perceive","record","adjust"],answer:3,
explanation:"자율주행차가 센서로 주변 환경을 실시간으로 '인식하는(perceive)' 과정을 설명합니다."},

{id:12,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Carbon capture involves removing CO₂ from the atmosphere or from industrial emissions and ______ it permanently underground or converting it into stable solid forms. While promising, this technology remains too costly and energy-intensive to deploy at the scale required to meaningfully address global warming without significant advances.`,
choices:["releasing","burning","converting","sequestering","dissolving"],answer:4,
explanation:"포집한 탄소를 영구적으로 저장하는 것을 '격리(sequestering)'라 합니다."},

{id:13,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`The Kepler Space Telescope discovered thousands of ______ — planets orbiting stars beyond our solar system — by detecting the faint, regular dimming of starlight as a planet passed in front of its host star. These discoveries revealed that planetary systems are extraordinarily common throughout our galaxy.`,
choices:["satellites","comets","asteroids","exoplanets","nebulae"],answer:4,
explanation:"태양계 밖의 별을 공전하는 행성을 '외계 행성(exoplanet)'이라 합니다."},

{id:14,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Classical computers process information using bits that are either 0 or 1. Quantum computers instead use qubits, which exploit the quantum property of ______ to exist in multiple states at once, enabling them to evaluate vast numbers of possible solutions simultaneously rather than one at a time.`,
choices:["entanglement","superposition","interference","coherence","tunneling"],answer:2,
explanation:"양자 컴퓨터의 큐비트가 0과 1을 동시에 나타낼 수 있는 성질을 '중첩(superposition)'이라 합니다."},

{id:15,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Healthy ecosystems depend on ______ — the variety of species and genetic differences within a habitat. When this variety declines, ecosystems become fragile: the loss of even one species can trigger cascading effects on food webs, nutrient cycles, and the services that ecosystems provide to human communities.`,
choices:["stability","productivity","biodiversity","resilience","complexity"],answer:3,
explanation:"생태계의 건강을 지탱하는 다양한 종의 존재를 '생물다양성(biodiversity)'이라 합니다."},

{id:16,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Researchers are using three-dimensional printing to ______ living tissues and organs from a patient's own cells. If perfected, this technology could eliminate the need for donor organs and the immunological risk of rejection, making life-saving transplant surgery accessible to far more patients worldwide.`,
choices:["study","clone","fabricate","analyze","simulate"],answer:3,
explanation:"3D 바이오프린팅으로 살아있는 조직을 층층이 '제작하다(fabricate)'는 표현이 적절합니다."},

{id:17,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Scientists are applying CRISPR to ______ the faulty genes responsible for inherited diseases such as sickle cell anemia and certain forms of inherited blindness. Early clinical trial results have been dramatic, suggesting that an era of genuinely curative genetic medicine may be closer than previously imagined.`,
choices:["replicate","correct","suppress","transfer","isolate"],answer:2,
explanation:"CRISPR로 유전 질환을 일으키는 결함 유전자를 '교정하다(correct)'는 표현이 적절합니다."},

{id:18,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`The primary challenge of wind and solar power is their ______: they generate electricity only when conditions are favorable and cannot be dispatched on demand. Solving this limitation requires major advances in battery technology, smart grid management, and long-duration energy storage systems.`,
choices:["pollution","cost","intermittency","inefficiency","complexity"],answer:3,
explanation:"태양광·풍력의 발전이 조건에 따라 변동하는 특성을 '간헐성(intermittency)'이라 합니다."},

{id:19,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`As AI systems take on more consequential decisions — hiring, medical diagnosis, parole — ensuring that they are ______ and explainable has become an urgent ethical challenge. Opaque algorithms that cannot justify their outputs raise serious concerns about fairness, accountability, and the erosion of meaningful human oversight.`,
choices:["efficient","scalable","transparent","optimized","standardized"],answer:3,
explanation:"AI 의사결정의 설명 가능성과 관련하여 '투명한(transparent)'이 가장 적절합니다."},

{id:20,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`As oceans absorb increasing amounts of atmospheric CO₂, seawater becomes more ______ — a process called ocean acidification. This chemical change threatens marine life by weakening the shells and skeletons of corals, oysters, and certain plankton that form the indispensable base of ocean food chains.`,
choices:["polluted","toxic","acidic","saturated","stagnant"],answer:3,
explanation:"이산화탄소 흡수로 해양이 '산성화(acidic)'되는 현상을 설명합니다."}
]},

// ── SET F : 빈칸완성 IV  (역사·문화) ────────────────────────────
{id:'F',name:'세트 F · 빈칸 완성 Ⅳ',desc:'역사·문화 주제의 빈칸 완성 유형',color:'#d97706',time:45*60,questions:[
{id:1,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Gutenberg's printing press did not merely speed up book production; it fundamentally ______ the intellectual landscape of Europe. By making texts affordable and reproducible at scale, it broke the Church's near-monopoly on written knowledge and laid the groundwork for the Reformation, the Scientific Revolution, and the Enlightenment.`,
choices:["organized","transformed","limited","recorded","preserved"],answer:2,
explanation:"인쇄기가 유럽의 지적 풍경을 근본적으로 '변화시킨(transformed)' 영향을 설명합니다."},

{id:2,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Colonial powers drew borders across Africa and Asia with little regard for the ethnic, cultural, or religious ______ of the territories they divided. Rival communities were grouped into single states, while unified peoples were split across national boundaries — tensions that continue to fuel conflicts in many regions today.`,
choices:["governments","boundaries","landscapes","identities","resources"],answer:4,
explanation:"식민지 경계 획정 시 현지 민족의 '정체성(identities)'을 무시한 결과를 설명합니다."},

{id:3,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`The Industrial Revolution transformed economies that were primarily agricultural into ones driven by mechanized manufacturing. This shift ______ traditional ways of life, drawing millions of workers from rural areas into rapidly expanding cities and permanently altering family structures, community bonds, and the nature of work itself.`,
choices:["preserved","undermined","celebrated","reinforced","stabilized"],answer:2,
explanation:"산업혁명이 전통적 생활 방식을 '약화(undermined)'시킨 과정을 설명합니다."},

{id:4,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Before the invention of writing, cultures transmitted histories, laws, and values through ______ traditions — spoken stories, songs, and recitations passed from generation to generation. These were not informal arrangements; they were sophisticated memory systems that sustained complex societies without a single written record.`,
choices:["artistic","ritual","oral","musical","spiritual"],answer:3,
explanation:"문자 발명 이전에 말로 전승된 문화 전통을 '구전(oral)' 전통이라 합니다."},

{id:5,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`The Silk Road was not simply a conduit for ______ goods such as silk, spices, and precious metals. It also facilitated the exchange of ideas, religions, diseases, and technologies between East and West, making it one of the most significant drivers of cultural interaction in the pre-modern world.`,
choices:["illegal","surplus","manufactured","luxury","basic"],answer:4,
explanation:"실크로드가 주로 '사치품(luxury)' 교역 경로였음을 설명합니다."},

{id:6,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Renaissance humanists shifted the focus of scholarship from purely theological concerns to the study of classical Greek and Roman texts. This ______ of ancient wisdom inspired fresh approaches to art, literature, philosophy, and science, placing human potential and individual achievement at the center of intellectual life.`,
choices:["rejection","rediscovery","criticism","collection","preservation"],answer:2,
explanation:"르네상스가 고대 그리스·로마 지혜를 '재발견(rediscovery)'한 시대임을 설명합니다."},

{id:7,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Cultures preserve collective identity through shared memories of key events — wars, migrations, founding moments — transmitted through rituals, monuments, art, and education. When these ______ memories are lost or deliberately suppressed, communities can lose their sense of historical continuity and shared purpose.`,
choices:["personal","collective","private","subjective","emotional"],answer:2,
explanation:"공동체가 공유하는 역사적 기억을 '집합적(collective)' 기억이라 합니다."},

{id:8,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Music serves as a powerful vehicle for cultural ______: melodies, rhythms, and lyrics carry the values, emotions, and memories of a community, allowing them to be experienced and shared across generations. From folk songs to national anthems, music encodes what a society considers most meaningful and worth preserving.`,
choices:["division","competition","expression","documentation","regulation"],answer:3,
explanation:"음악이 공동체의 가치와 감정을 전달하는 문화적 '표현(expression)' 수단임을 설명합니다."},

{id:9,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`In medieval European art, visual symbols conveyed complex theological meanings to audiences who were largely ______. A lamb might represent Christ; a lily might symbolize the Virgin Mary. This shared visual vocabulary was as widely understood within its culture as any written text could have been.`,
choices:["educated","illiterate","wealthy","artistic","faithful"],answer:2,
explanation:"중세 유럽에서 시각 기호로 종교적 의미를 전달한 이유는 대다수 관객이 '문맹(illiterate)'이었기 때문입니다."},

{id:10,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Governments have long used ______ — strategically crafted messages designed to shape public opinion — to mobilize support during wartime, justify imperial expansion, or suppress internal dissent. While often associated with authoritarian regimes, democratic governments have also employed these techniques, particularly during periods of national crisis.`,
choices:["legislation","communication","diplomacy","propaganda","censorship"],answer:4,
explanation:"여론을 특정 방향으로 유도하기 위해 전략적으로 제작된 메시지를 '선전(propaganda)'이라 합니다."},

{id:11,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`A ______ refers to a community of people who live outside their ancestral homeland while maintaining a strong sense of shared identity, culture, and connection to their place of origin. Jewish, Chinese, Irish, and Indian communities around the world are among the most widely recognized examples of this phenomenon.`,
choices:["colony","diaspora","minority","settlement","enclave"],answer:2,
explanation:"고국 밖에서 살면서 원래 문화 정체성을 유지하는 공동체를 '디아스포라(diaspora)'라 합니다."},

{id:12,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Ideas, technologies, and cultural practices do not remain confined within the communities that originate them. Through trade, conquest, migration, and communication, they spread across geographic and cultural boundaries — a process known as cultural ______. This diffusion has been a primary engine of human progress throughout history.`,
choices:["isolation","resistance","diffusion","preservation","competition"],answer:3,
explanation:"문화 요소가 경계를 넘어 퍼져나가는 과정을 '문화적 확산(cultural diffusion)'이라 합니다."},

{id:13,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Every human culture has produced ______ — stories that explain the origins of the world, the nature of the divine, and the meaning of human life. Far from being mere entertainment, these narratives provided ancient peoples with frameworks for understanding their place in the cosmos and their obligations to one another.`,
choices:["legends","philosophy","mythology","theology","folklore"],answer:3,
explanation:"세계의 기원과 인간의 삶을 설명하는 문화적 이야기 체계를 '신화(mythology)'라 합니다."},

{id:14,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Throughout history, authorities have sought to ______ artistic and intellectual expression they perceived as threatening to their power or social order. Book burnings, press restrictions, and internet filtering are all manifestations of the same impulse: to control what people know and, through that control, how they think and act.`,
choices:["encourage","regulate","suppress","document","categorize"],answer:3,
explanation:"권력이 위협적으로 여기는 표현을 '억압하다(suppress)'가 문맥상 가장 자연스럽습니다."},

{id:15,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Enlightenment thinkers of 17th and 18th century Europe championed reason, empirical evidence, and individual liberty as the foundations of human progress. Their ideas challenged the ______ authority of monarchies and religious institutions, planting the intellectual seeds of constitutional democracy and universal human rights.`,
choices:["democratic","economic","cultural","traditional","scientific"],answer:4,
explanation:"계몽주의 사상가들이 도전한 것은 군주제와 교회의 '전통적(traditional)' 권위입니다."},

{id:16,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`______ — the belief that people sharing a common language, history, or culture form a distinct people entitled to political self-determination — reshaped the world during the 19th and 20th centuries. It drove the breakup of empires and the creation of new states, but also ignited devastating ethnic conflicts and wars.`,
choices:["Colonialism","Democracy","Nationalism","Imperialism","Federalism"],answer:3,
explanation:"민족 공동체가 정치적 자기결정권을 가져야 한다는 사상을 '민족주의(Nationalism)'라 합니다."},

{id:17,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`The Cold War was characterized not by direct military confrontation between the two superpowers but by ______ competition — a struggle for global influence waged through proxy wars, economic aid, espionage, propaganda, and the race to develop superior weapons and space technology.`,
choices:["economic","ideological","cultural","territorial","diplomatic"],answer:2,
explanation:"냉전은 직접 군사 충돌보다 '이념적(ideological)' 경쟁으로 특징지어집니다."},

{id:18,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`UNESCO's World Heritage program seeks to identify and ______ sites of outstanding cultural or natural significance — from the Egyptian pyramids to the Amazon rainforest — for the benefit of future generations. The central challenge is balancing conservation with the economic pressures of tourism and development.`,
choices:["promote","exploit","preserve","catalog","exhibit"],answer:3,
explanation:"UNESCO 세계 유산 프로그램의 목적은 중요한 장소를 '보존하는(preserve)' 것입니다."},

{id:19,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Globalization has created unprecedented opportunities for cultural exchange, but it has also generated anxiety about the ______ of local traditions. As global media and brands penetrate every corner of the world, many communities fear that their distinctive ways of life are being replaced by a homogeneous global consumer culture.`,
choices:["promotion","revival","commercialization","erosion","celebration"],answer:4,
explanation:"세계화가 지역 전통의 '침식(erosion)'에 대한 우려를 낳는다는 내용입니다."},

{id:20,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Renaissance artists developed the technique of linear ______, which creates the illusion of three-dimensional depth on a flat surface by having parallel lines converge at a single vanishing point. This mathematical approach to visual representation transformed European painting and influenced artistic practice for centuries thereafter.`,
choices:["proportion","symmetry","perspective","composition","geometry"],answer:3,
explanation:"평행선이 하나의 소실점으로 수렴하는 원근법 기법을 '원근법(perspective)'이라 합니다."}
]},

// ── SET G : 빈칸완성 V  (환경·경제) ─────────────────────────────
{id:'G',name:'세트 G · 빈칸 완성 Ⅴ',desc:'환경·경제 주제의 빈칸 완성 유형',color:'#65a30d',time:45*60,questions:[
{id:1,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`In a free market, prices are primarily determined by the relationship between ______ and demand. When the quantity producers are willing to sell at a given price equals the quantity consumers are willing to buy, the market reaches equilibrium and the price stabilizes without requiring external intervention.`,
choices:["competition","supply","regulation","quality","distribution"],answer:2,
explanation:"가격을 결정하는 시장 메커니즘은 '공급(supply)'과 수요의 관계입니다."},

{id:2,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`When economic transactions impose costs on parties not involved in them — such as when a factory pollutes a river used by nearby communities — economists call this a negative ______. Because these costs are not reflected in market prices, markets systematically overproduce goods that generate them.`,
choices:["subsidy","externality","monopoly","tariff","shortage"],answer:2,
explanation:"거래 당사자가 아닌 제3자에게 부과되는 비용을 경제학에서 '외부 효과(externality)'라 합니다."},

{id:3,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`A ______ economy is an alternative to the traditional 'take-make-dispose' model. Instead of treating materials as waste after a single use, it aims to keep products and resources in active circulation through reuse, repair, and recycling — minimizing both raw resource extraction and the environmental burden of waste disposal.`,
choices:["shared","circular","digital","knowledge","service"],answer:2,
explanation:"자원을 순환시켜 폐기물을 최소화하는 경제 모델을 '순환 경제(circular economy)'라 합니다."},

{id:4,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Growing income ______ — the widening gap between the highest and lowest earners — has been linked to a range of social problems, including reduced social mobility, lower institutional trust, poorer average health outcomes, and greater political polarization between segments of society.`,
choices:["mobility","diversity","stability","inequality","distribution"],answer:4,
explanation:"고소득층과 저소득층 간의 격차 심화를 '소득 불평등(income inequality)'이라 합니다."},

{id:5,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`______ erodes the purchasing power of money over time: the same sum buys fewer goods and services as prices rise. While moderate levels are considered normal in healthy economies, high or unpredictable rates create uncertainty that discourages investment and disproportionately harms those on fixed incomes.`,
choices:["Deflation","Recession","Inflation","Stagflation","Devaluation"],answer:3,
explanation:"시간이 지남에 따라 화폐 구매력이 감소하고 가격이 오르는 현상을 '인플레이션(Inflation)'이라 합니다."},

{id:6,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Modern industrial agriculture has dramatically increased food production but has simultaneously contributed to a significant ______ in biodiversity. The replacement of diverse traditional crop varieties with a handful of high-yield monocultures has made food systems far more vulnerable to disease, pests, and climate shocks.`,
choices:["advance","diversity","decline","investment","shift"],answer:3,
explanation:"산업형 농업이 생물다양성의 '감소(decline)'를 초래했음을 설명합니다."},

{id:7,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Carbon ______ mechanisms — such as carbon taxes or cap-and-trade systems — aim to make the environmental costs of burning fossil fuels visible in market prices. By requiring polluters to pay for the damage they cause, these policies create economic incentives for businesses and consumers to reduce emissions.`,
choices:["sequestration","pricing","trading","capture","offsetting"],answer:2,
explanation:"화석연료 연소의 환경 비용을 시장 가격에 반영하는 메커니즘을 '탄소 가격 책정(carbon pricing)'이라 합니다."},

{id:8,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Single-use plastics are designed to be used briefly and discarded, yet the material is engineered to ______ in the environment for hundreds of years without breaking down. This fundamental mismatch between brief utility and extraordinary environmental longevity lies at the heart of the global plastic pollution crisis.`,
choices:["decay","dissolve","persist","recycle","disappear"],answer:3,
explanation:"일회용 플라스틱이 수백 년간 환경에 '지속되는(persist)' 특성이 문제의 핵심입니다."},

{id:9,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`The concept of ______ development — meeting the needs of the present without compromising the ability of future generations to meet their own needs — seeks to reconcile economic growth with environmental protection and long-term social equity as simultaneous, mutually reinforcing objectives.`,
choices:["rapid","competitive","sustainable","technological","industrial"],answer:3,
explanation:"현세대와 미래 세대의 필요를 동시에 충족하는 발전 방식을 '지속 가능한(sustainable)' 발전이라 합니다."},

{id:10,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`As demand for fresh water grows — driven by population growth, agriculture, and industrial expansion — and climate change disrupts precipitation patterns, water ______ is emerging as one of the defining challenges of this century, threatening food security, public health, and political stability in many regions.`,
choices:["quality","access","pollution","scarcity","conservation"],answer:4,
explanation:"수요 증가와 기후 변화로 심화되는 담수 부족 문제를 '물 부족(water scarcity)'이라 합니다."},

{id:11,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`______ — the large-scale clearing of forests — contributes to climate change by releasing stored carbon, destroys habitat for vast numbers of species, disrupts regional water cycles, and degrades the land's long-term capacity to support agriculture, all while depriving local communities of resources they depend upon.`,
choices:["Erosion","Desertification","Reforestation","Deforestation","Urbanization"],answer:4,
explanation:"대규모 삼림 벌채를 '삼림 파괴(Deforestation)'라 하며, 기후 변화와 생물다양성 손실의 주요 원인입니다."},

{id:12,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Approximately one-third of all food produced globally is lost or wasted before reaching consumers. This represents not only a massive economic loss but also a significant ______ burden, since producing wasted food accounts for roughly eight percent of global greenhouse gas emissions each year.`,
choices:["social","financial","environmental","cultural","nutritional"],answer:3,
explanation:"음식물 낭비가 온실가스 배출에 기여하는 '환경적(environmental)' 부담을 설명합니다."},

{id:13,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`The rise of app-based platforms such as ride-sharing and food delivery has created a new category of ______ employment, in which workers are classified as independent contractors rather than employees. While offering flexibility, this arrangement typically denies workers access to health insurance, retirement benefits, and employment protections.`,
choices:["stable","formal","traditional","gig","unionized"],answer:4,
explanation:"앱 기반 플랫폼을 통한 단기 계약 형태의 노동을 '긱(gig)' 경제 고용이라 합니다."},

{id:14,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Forests, wetlands, and coral reefs provide humanity with invaluable ______ services — the benefits natural systems deliver free of charge, including clean water, carbon storage, pollination, and flood regulation. The economic value of these services is enormous, yet they remain largely absent from standard measures of national income.`,
choices:["cultural","commercial","environmental","ecosystem","biological"],answer:4,
explanation:"자연 시스템이 무료로 제공하는 혜택을 '생태계(ecosystem)' 서비스라 합니다."},

{id:15,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Universal basic income — a policy under which every citizen receives a regular, ______ cash payment from the government regardless of employment status — has attracted growing interest as automation threatens traditional jobs. Proponents argue it would reduce poverty and simplify complex, overlapping welfare programs.`,
choices:["conditional","means-tested","unconditional","supplementary","voluntary"],answer:3,
explanation:"기본소득의 핵심 특징은 자산·취업 여부와 상관없이 지급되는 '무조건적(unconditional)' 성격입니다."},

{id:16,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것을 고르시오.",
passage:`Economists use the term ______ capital to describe the natural resources and environmental conditions — forests, clean air, fertile soil, biodiversity — that underpin all economic activity. Just as businesses require financial and physical capital, every economy ultimately depends on the health and regenerative capacity of these natural systems.`,
choices:["human","social","natural","environmental","biological"],answer:3,

,{id:'L',name:'세트 L · 주제 파악 Ⅰ',desc:'글의 주제를 파악하는 유형 (자연과학·기술)',color:'#16a34a',time:45*60,questions:[
{id:1,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`When bees navigate back to their hive, they communicate the direction and distance of food sources through an elaborate figure-eight dance. The angle of the dance relative to vertical corresponds to the angle of the food source relative to the sun, while the duration of the waggle phase indicates distance. This remarkable system allows the colony to efficiently allocate foragers to productive sites without any individual bee having a map of the landscape.`,
choices:["the social hierarchy of bee colonies","the waggle dance as a bee communication system","how bees build and repair their hives","the role of the queen in directing worker bees","seasonal migration patterns of honeybee colonies"],answer:2,
explanation:"꿀벌의 8자 춤이 방향과 거리를 전달하는 의사소통 시스템이라는 내용이므로, 주제는 ②입니다."},

{id:2,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Scientists once assumed that ecosystems could absorb almost unlimited amounts of pollutants before showing signs of stress. Research over the past four decades, however, has revealed that ecosystems have critical thresholds — tipping points — beyond which change becomes rapid and potentially irreversible. Once a coral reef bleaches beyond a certain level, for example, it may shift permanently to an algae-dominated system even if water temperatures later return to normal.`,
choices:["pollution control technologies developed for coral reefs","ecosystem tipping points and the limits of environmental resilience","the economic costs of coral reef degradation","temperature changes in tropical ocean ecosystems","government policies to prevent marine pollution"],answer:2,
explanation:"생태계가 임계점을 넘으면 비가역적으로 변한다는 내용이므로, 주제는 ②입니다."},

{id:3,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The placebo effect has long puzzled medical researchers. Patients who receive sugar pills but believe they are receiving real medication often show genuine physiological improvements — reductions in pain, blood pressure, or anxiety. Recent neuroimaging studies reveal that these effects are not imagined: the brain actually releases endorphins and activates pain-suppression circuits when a patient expects relief, demonstrating that belief itself can produce measurable biological change.`,
choices:["the dangers of over-prescribing pain medication","the biological mechanisms underlying the placebo effect","why patients distrust pharmaceutical companies","how brain scans are used to diagnose chronic pain","the importance of honest communication in medical practice"],answer:2,
explanation:"플라시보 효과의 생물학적 메커니즘(뇌의 엔돌핀 분비 등)을 설명하므로, 주제는 ②입니다."},

{id:4,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Microplastics — fragments smaller than five millimeters — have been detected in the deepest ocean trenches, in Arctic ice, and even in human blood. They enter the environment through the breakdown of larger plastic products and are inadvertently ingested by marine organisms at every level of the food chain. Because plastics resist biological decomposition, they accumulate in tissues and concentrate as they move up the food web, ultimately reaching human consumers.`,
choices:["government regulations banning single-use plastics","the widespread contamination of ecosystems by microplastics","differences between biodegradable and conventional plastics","water purification techniques to remove microplastic pollution","the economic cost of plastic recycling programs"],answer:2,
explanation:"미세플라스틱의 광범위한 환경 오염과 먹이사슬 내 축적을 다루므로, 주제는 ②입니다."},

{id:5,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Dark matter cannot be seen, does not emit light, and does not interact with ordinary matter except through gravity. Yet astronomers infer its existence from the behavior of visible matter: galaxies rotate at speeds that their visible mass alone cannot explain, and light bends around galaxy clusters more than Einstein's equations predict without an additional unseen mass component. Dark matter appears to constitute roughly 27 percent of the total energy content of the universe.`,
choices:["the history of the Big Bang theory in cosmology","evidence for the existence of dark matter in the universe","why astronomers prefer telescopes in space","the chemical composition of ordinary stellar matter","dark energy and the accelerating expansion of the universe"],answer:2,
explanation:"중력 효과를 통해 암흑물질의 존재를 추론하는 근거를 설명하므로, 주제는 ②입니다."},

{id:6,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`CRISPR-Cas9 has transformed genetic research by allowing scientists to cut and edit DNA sequences with unprecedented precision. Unlike earlier gene-editing tools, which were expensive, slow, and often imprecise, CRISPR is cheap, fast, and highly accurate. Researchers have used it to develop disease-resistant crops, investigate the genetic basis of inherited disorders, and explore potential therapies for conditions once considered untreatable. Its versatility makes it one of the most significant biotechnology breakthroughs in decades.`,
choices:["ethical controversies surrounding human genetic modification","the revolutionary impact of CRISPR on genetic research and medicine","how DNA was first discovered and its structure determined","the role of bacteria in defending against viruses","agricultural applications of traditional cross-breeding techniques"],answer:2,
explanation:"CRISPR의 정밀성과 다양한 연구·의료 분야에서의 혁신적 영향을 다루므로, 주제는 ②입니다."},

{id:7,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The human gut contains trillions of microorganisms that collectively form the microbiome. Far from being passive passengers, these microbial communities actively influence digestion, immune function, and even mental health. Studies have linked disruptions in the microbiome — caused by antibiotics, poor diet, or stress — to conditions ranging from inflammatory bowel disease to anxiety and depression, suggesting that maintaining microbial diversity is as important as any other aspect of personal health.`,
choices:["how probiotics are manufactured and marketed","the far-reaching effects of gut microbiome health on the body","antibiotic resistance as a global public health threat","the role of the immune system in fighting bacterial infections","dietary fiber and its role in weight management"],answer:2,
explanation:"장내 미생물이 소화, 면역, 정신 건강에 미치는 광범위한 영향을 다루므로, 주제는 ②입니다."},

{id:8,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Engineers designing self-driving vehicles face a fundamental challenge: the real world is messy, unpredictable, and full of edge cases that no programmer can fully anticipate. A child running into the street, a construction sign placed unexpectedly, or a faded lane marking can all confuse systems trained on idealized scenarios. This gap between controlled testing environments and real-world conditions remains the central technical barrier to widespread autonomous vehicle deployment.`,
choices:["the ethical implications of autonomous vehicle decision-making","technical challenges preventing widespread adoption of self-driving cars","how machine learning algorithms are trained on labeled data","the history and development of electric vehicle technology","economic benefits of replacing human drivers with autonomous systems"],answer:2,
explanation:"자율주행차의 실제 환경 적용을 가로막는 기술적 한계를 다루므로, 주제는 ②입니다."},

{id:9,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Quantum computers exploit the principles of superposition and entanglement to perform certain calculations exponentially faster than classical computers. While a classical bit must be either 0 or 1, a quantum bit (qubit) can exist in both states simultaneously. This allows quantum machines to explore many possible solutions to a problem at once, making them potentially ideal for tasks like breaking encryption, simulating molecular structures for drug discovery, and optimizing complex logistics networks.`,
choices:["the history of computer science from vacuum tubes to transistors","how quantum computers work and their potential applications","cybersecurity threats posed by artificial intelligence","the difference between software and hardware in modern computing","environmental costs of large-scale data center operations"],answer:2,
explanation:"양자컴퓨터의 원리와 잠재적 응용 분야를 설명하므로, 주제는 ②입니다."},

{id:10,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Urban heat islands occur when cities absorb and retain more solar energy than surrounding rural areas, raising local temperatures by several degrees. Dark road surfaces, concrete buildings, and the waste heat from vehicles and air conditioning all contribute to the effect. Cities experiencing heat islands face elevated energy demand, worsened air quality, and increased heat-related illness — problems that designers are now addressing through green roofs, reflective pavements, and urban forests.`,
choices:["air conditioning technology and its environmental impact","the urban heat island effect and design strategies to mitigate it","solar energy adoption rates in major cities worldwide","differences in climate between northern and southern hemisphere cities","how urbanization affects regional rainfall patterns"],answer:2,
explanation:"도시 열섬 현상의 원인과 이를 완화하기 위한 설계 전략을 다루므로, 주제는 ②입니다."},

{id:11,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Bioluminescence — the ability of living organisms to produce and emit light — has evolved independently in dozens of species across the tree of life, from deep-sea fish to fungi to fireflies. In marine environments, where sunlight does not penetrate, bioluminescence serves critical functions: attracting prey, deterring predators, communicating with potential mates, and even camouflaging an organism by matching the faint light filtering down from above. Researchers are now borrowing this natural technology to develop bio-sensors and medical imaging tools.`,
choices:["how deep-sea creatures survive without sunlight","the biological function and technological applications of bioluminescence","the evolution of the eye and light perception in animals","why fireflies flash in patterns during summer nights","methods used by marine biologists to study ocean ecosystems"],answer:2,
explanation:"생물발광의 자연적 기능과 기술 응용을 다루므로, 주제는 ②입니다."},

{id:12,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The advent of artificial intelligence in medical diagnosis raises profound questions about the future role of physicians. AI systems can now detect certain cancers in medical images with accuracy matching or exceeding that of specialist radiologists. However, a correct diagnosis is only one part of medical care. Communicating with a frightened patient, weighing the values and preferences of an individual, and integrating social context into treatment decisions require human judgment and empathy that AI cannot replicate.`,
choices:["how AI diagnostic tools are trained on medical image datasets","the complementary roles of AI and human physicians in healthcare","privacy concerns raised by storing patient data in the cloud","how radiology as a profession has changed over the past century","government regulations governing medical devices and software"],answer:2,
explanation:"AI가 일부 진단에서 뛰어나지만 의사의 인간적 판단과 공감을 대체할 수 없다는 내용이므로, 주제는 ②입니다."},

{id:13,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Plastic pollution in the ocean is not distributed randomly. Ocean currents cause plastic to accumulate in five major subtropical gyres, creating enormous slow-moving patches of debris. The Great Pacific Garbage Patch, the most well-known of these, spans an area estimated at 1.6 million square kilometers and contains an estimated 80,000 metric tons of plastic. Cleanup is extraordinarily difficult because much of the debris consists of tiny fragments suspended throughout the water column, not a solid floating island.`,
choices:["government treaties addressing international ocean pollution","the formation and challenge of cleaning up ocean garbage patches","the economic impact of tourism on coastal communities","techniques for recycling ocean-collected plastic into new materials","differences between Atlantic and Pacific Ocean ecosystems"],answer:2,
explanation:"해양 쓰레기 섬의 형성 원인과 정화의 어려움을 다루므로, 주제는 ②입니다."},

{id:14,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Neuroplasticity — the brain's ability to reorganize itself by forming new neural connections — challenges the old view that the adult brain is fixed and unchanging. When people learn new skills, suffer brain injuries, or undergo intensive rehabilitation, the brain physically rewires itself, reassigning functions to undamaged areas. This discovery has transformed neurorehabilitation, offering hope to stroke survivors and patients with traumatic brain injuries who once would have been considered to have permanent deficits.`,
choices:["how different regions of the brain control specific body movements","brain plasticity and its implications for recovery and learning","the genetics of neurological disorders such as Alzheimer's disease","memory formation and the role of sleep in consolidating information","stress hormones and their effect on the developing adolescent brain"],answer:2,
explanation:"뇌의 신경가소성이 회복과 학습에 미치는 함의를 다루므로, 주제는 ②입니다."},

{id:15,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Antibiotics revolutionized medicine, but their overuse has fueled the emergence of drug-resistant bacteria that no existing medication can reliably treat. When antibiotics are used unnecessarily — for viral infections they cannot affect, or when courses are not completed — the bacteria that survive carry genes conferring resistance. These genes spread rapidly between bacterial species, creating multidrug-resistant organisms that pose a growing threat to global public health.`,
choices:["how antibiotics are synthesized in pharmaceutical laboratories","the rise of antibiotic-resistant bacteria and its public health implications","why viruses cannot be treated with antibiotics","the history of penicillin and Alexander Fleming's discovery","the use of antibiotics in livestock farming and food safety"],answer:2,
explanation:"항생제 남용으로 인한 내성균 출현과 공중 보건에 대한 위협을 다루므로, 주제는 ②입니다."},

{id:16,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Geothermal energy harnesses the heat stored within the Earth to generate electricity and provide direct heating. Countries like Iceland, which sits atop an active volcanic zone, already derive most of their heating and a significant fraction of their electricity from geothermal sources. Recent advances in drilling technology are making it possible to access geothermal energy in regions with no volcanic activity, potentially expanding this renewable source to a much larger portion of the globe.`,
choices:["Iceland's unique culture and natural landscape","the potential and expansion of geothermal energy as a renewable source","how oil and natural gas are extracted from deep geological formations","differences between solar, wind, and hydroelectric power generation","the economic challenges facing the global renewable energy industry"],answer:2,
explanation:"지열 에너지의 가능성과 기술 발전으로 인한 확장을 다루므로, 주제는 ②입니다."},

{id:17,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Invasive species — organisms introduced outside their native range — can devastate local ecosystems because they arrive without the natural predators, parasites, and competitors that kept them in check at home. The brown tree snake, accidentally transported to Guam after World War II, wiped out most of the island's native bird species within decades. Controlling invasive species is extremely difficult once they are established, making prevention through strict biosecurity measures far more effective than remediation.`,
choices:["global trade routes and their role in species transportation","the ecological damage caused by invasive species and prevention strategies","how predator-prey relationships regulate animal populations","conservation programs for endangered bird species worldwide","the legal frameworks governing wildlife import and export"],answer:2,
explanation:"외래종이 생태계에 미치는 피해와 예방의 중요성을 다루므로, 주제는 ②입니다."},

{id:18,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Epigenetics refers to changes in gene expression that do not involve alterations to the DNA sequence itself. Environmental factors — diet, stress, exposure to toxins — can switch genes on or off by adding or removing chemical tags on DNA. Some of these changes can be passed from parents to offspring, challenging the traditional view that only genetic sequence is inherited. This finding complicates our understanding of the boundary between nature and nurture.`,
choices:["how DNA mutations cause inherited genetic diseases","epigenetic mechanisms and their role in heredity and development","the difference between dominant and recessive genetic traits","how gene therapy is used to treat hereditary disorders","the ethical debate over genetically modified organisms in agriculture"],answer:2,
explanation:"후성유전학이 유전자 발현과 유전에 미치는 영향을 다루므로, 주제는 ②입니다."},

{id:19,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The Internet of Things (IoT) refers to the network of physical devices — from refrigerators and cars to industrial sensors and medical monitors — connected to the internet and capable of sharing data. By collecting real-time information from the physical world, IoT systems can optimize energy consumption, detect equipment failures before they occur, and personalize services in ways that were previously impossible. However, this connectivity also creates new cybersecurity vulnerabilities, as each connected device is a potential entry point for malicious actors.`,
choices:["the history of internet protocols and network architecture","the capabilities and cybersecurity risks of Internet of Things technology","how smartphones are manufactured and distributed globally","social media addiction and its effects on adolescent mental health","cloud storage solutions for businesses and individuals"],answer:2,
explanation:"IoT의 기능과 함께 그로 인한 사이버 보안 취약성을 다루므로, 주제는 ②입니다."},

{id:20,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`When a massive star exhausts its nuclear fuel, its core collapses within seconds under its own gravity, triggering a supernova explosion visible across billions of light-years. What remains depends on the original mass: smaller remnants become neutron stars, while larger ones collapse further into black holes — regions of spacetime where gravity is so extreme that nothing, not even light, can escape. Supernovae also forge and scatter heavy elements like iron and gold throughout the galaxy, making them essential to the chemistry of planets and life.`,
choices:["how stars are formed from interstellar gas and dust clouds","stellar evolution and the role of supernovae in creating heavy elements","methods astronomers use to measure the distance to nearby stars","the search for extraterrestrial life around distant star systems","how black holes were first theorized by Albert Einstein"],answer:2,
explanation:"별의 죽음과 초신성 폭발이 무거운 원소 생성에 기여한다는 내용이므로, 주제는 ②입니다."}
]},
