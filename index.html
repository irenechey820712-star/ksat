,{id:'T',name:'세트 T · 종합 독해 Ⅰ',desc:'어법·빈칸·주제·제목·요지·내용 일치 혼합 유형 (인문·교육)',color:'#6d28d9',time:45*60,questions:[
{id:1,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Traditional education has long ① <u>focused</u> on transmitting knowledge rather than developing thinking skills. Students are taught to memorize ② <u>established</u> facts and reproduce them ③ <u>accurate</u> in examinations, but they rarely practice questioning assumptions. Progressive educators argue that schools should cultivate ④ <u>genuine</u> curiosity and teach students to evaluate sources ⑤ <u>critically</u>.`,
choices:["①","②","③","④","⑤"],answer:3,
explanation:"③ accurate는 동사 reproduce를 수식하는 부사여야 하므로 accurately로 고쳐야 합니다."},

{id:2,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`People tend to seek out information that confirms their existing beliefs, a phenomenon psychologists call confirmation bias. When presented with evidence that contradicts their views, people often dismiss it as unreliable rather than revising their beliefs. This tendency helps explain ______________________: people on opposite sides of a debate can read the same article and come away more convinced of their original positions.`,
choices:["왜 대부분의 사람들이 심리학에 대한 기초 지식이 부족한지","왜 상반된 증거에의 노출이 오히려 기존 신념을 강화할 수 있는지","왜 고학력자들은 인지 편향에 면역이 있는지","미디어 리터러시 프로그램이 정치적 양극화를 효과적으로 줄이는 방법","폭넓게 독서하는 사람들이 더 극단적인 견해를 가지게 되는 이유"],answer:2,
explanation:"반박 증거가 오히려 신념을 강화하는 현상인 확증 편향을 설명하는 빈칸이므로 ②입니다."},

{id:3,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The most successful learners are not those who avoid failure — they are those who recover from it productively. Failure provides information about what approaches do not work, information that success alone cannot supply. Studies of expert musicians, athletes, and chess players consistently show that deliberate practice includes many repetitions of mistakes corrected in real time. Educational cultures that stigmatize failure inadvertently remove this crucial feedback mechanism, producing students who avoid challenges to protect their self-image.`,
choices:["전문가들이 성공 경험을 통해 얻는 교훈과 그 한계","실패가 학습의 필수적인 피드백 메커니즘임을 인식하는 교육의 중요성","학교 교육에서 학생들의 실패 경험을 줄이는 구체적 방법","완벽주의가 높은 학업 성취도와 연관되는 이유","동기 부여 방식이 학습 결과에 미치는 영향"],answer:2,
explanation:"실패가 학습의 필수 피드백 메커니즘이라는 내용이 주제이므로 ②입니다."},

{id:4,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Learning to play a musical instrument reshapes the brain in ways that transfer to other cognitive domains. Musically trained children outperform peers in reading, language processing, and mathematical reasoning. Music training strengthens the auditory cortex and develops neural circuits that process fine temporal patterns — the same circuits involved in decoding spoken language. Playing an instrument also trains sustained attention and fine motor coordination. The breadth of benefits suggests that music education is not a luxury but a fundamental component of cognitive development.`,
choices:["Why Classical Music Is Superior to Popular Music for Studying","Music Education: The History of an Endangered Subject","Beyond the Melody: Music Training as Cognitive Development","How Musicians Process Language Differently from Non-Musicians","The Economic Case for Funding School Music Programs"],answer:3,
explanation:"음악 훈련이 인지 발달 전반에 미치는 광범위한 효과를 다루고 있으므로 가장 적절한 제목은 ③입니다."},

{id:5,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`We often treat curiosity as a fixed personality trait — something you either have or lack. But curiosity is better understood as a practice. Research by behavioral scientists suggests that asking more questions genuinely increases subsequent interest in a topic, as questioning creates anticipation for an answer and draws attention to an information gap. We can cultivate curiosity deliberately by practicing it, not simply benefit from it if we happen to be 'naturally' curious.`,
choices:["호기심은 학업 성취보다 직업적 성공을 예측하는 데 더 유용한 지표이다.","호기심은 타고나는 특성이 아니라 의도적인 연습을 통해 계발할 수 있다.","호기심 있는 학습자는 지식을 더 오래 기억하는 경향이 있다.","자기 주도 학습에서 질문 만들기가 단순 암기보다 효과적이다.","교사가 학생의 호기심을 자극하기 위해 열린 질문을 더 많이 활용해야 한다."],answer:2,
explanation:"호기심은 고정된 특성이 아니라 연습으로 계발할 수 있다는 주장이 요지이므로 ②입니다."},

{id:6,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Effective mentorship depends on mutual trust between mentor and mentee. The mentor ① <u>must</u> invest time in understanding the mentee's specific goals, not just offer generic advice. A mentor ② <u>who</u> listens carefully creates a safe space in which weaknesses can be honestly assessed. Research shows that people ③ <u>mentored</u> by attentive guides progress faster. Yet finding the right mentor — someone ④ <u>who</u> you can truly rely on — is not always easy. Many organizations now formalize mentorship programs to ensure ⑤ <u>consistent</u> support.`,
choices:["①","②","③","④","⑤"],answer:4,
explanation:"④ who는 전치사 on의 목적어이므로 목적격 whom으로 고쳐야 합니다. (someone whom you can rely on)"},

{id:7,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`The Sapir-Whorf hypothesis proposed that language shapes how people perceive the world. In its strong form — that language determines thought — it has been largely rejected. But a weaker version has gained empirical support. Speakers of languages with separate basic color terms for light blue and dark blue distinguish those colors faster than speakers using a single term. These findings suggest that ______________________.`,
choices:["인간의 색 지각은 유전적으로 결정되며 문화는 아무 영향이 없다","사피어-워프 가설은 현대 언어학자들에 의해 완전히 폐기되어야 한다","언어는 사고를 완전히 결정하지는 않지만 특정 방식으로 인지를 형성한다","여러 언어를 습득하면 색 구별 능력이 감소한다","언어의 색채 용어는 문화적 정교함의 신뢰할 수 없는 척도이다"],answer:3,
explanation:"언어가 사고를 완전히 결정하지는 않지만 특정 인지에 영향을 준다는 약한 형태의 가설을 지지하는 결론이므로 ③입니다."},

{id:8,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The placebo effect has long been considered a nuisance confounding clinical trials. But researchers have begun to reconceptualize it as an active healing mechanism. Studies show placebos trigger real neurobiological changes: they stimulate the brain to release endorphins and dopamine, reduce stress hormones, and modulate immune function. The expectation of improvement appears to be a genuine therapeutic ingredient, leading clinicians to consider how patient expectations can be ethically leveraged to enhance outcomes.`,
choices:["임상 시험에서 플라세보 대조군이 가지는 통계적 의의","플라세보 효과가 실제 신경생물학적 변화를 일으키는 적극적 치료 메커니즘으로 재평가받고 있다는 것","심리적 요인이 만성 통증 치료에 미치는 부정적 영향","의사와 환자 사이의 신뢰 관계가 치료 결과를 향상시키는 방법","플라세보 약물의 합법적 처방을 허용하는 규제 완화의 필요성"],answer:2,
explanation:"플라세보 효과가 적극적인 치료 메커니즘으로 재평가되고 있다는 내용이 주제이므로 ②입니다."},

{id:9,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Memory is not a recording device that replays events exactly as they occurred. Each time we remember, we reconstruct the past from fragments, guided by current expectations and contexts. This reconstructive nature explains why eyewitness testimony is far less reliable than courts have traditionally assumed. Elizabeth Loftus's experiments showed that a single misleading question posed after an event could implant false details into a witness's memory. Our memories tell us less about the past than we imagine.`,
choices:["Eyewitness Testimony: The Unreliable Gold Standard of Legal Evidence","Memory as Reconstruction: Why We Remember Less Than We Think","Cultural Differences in Memory Formation and Recall","Elizabeth Loftus and the Discovery of False Memory Syndrome","How Sleep Affects the Reliability of Long-Term Memory"],answer:2,
explanation:"기억이 재구성 과정이며 우리가 생각하는 것보다 덜 신뢰할 수 있다는 내용이므로 가장 적절한 제목은 ②입니다."},

{id:10,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`Johannes Gutenberg is credited with introducing movable-type printing to Europe around 1440, though similar technology existed earlier in East Asia. His key innovation was developing a metal alloy that could be poured into molds easily and cooled quickly, combined with an oil-based ink that adhered well to metal. The Gutenberg Bible, completed around 1455, was the first major book printed with this technology. Gutenberg himself died in poverty; his financial backer Johann Fust seized his printing equipment through a lawsuit over an unpaid loan.`,
choices:["구텐베르크는 동아시아에서 활자 기술을 처음 발명하였다.","구텐베르크 성경은 1470년경에 완성되었다.","구텐베르크는 금형에 쉽게 붓고 빠르게 냉각되는 금속 합금을 개발하였다.","구텐베르크는 인쇄 사업으로 큰 부를 얻었다.","구텐베르크의 재정 후원자는 우호적으로 사업을 지속하였다."],answer:3,
explanation:"금형에 쉽게 붓고 빠르게 냉각되는 금속 합금을 개발한 내용이 일치하므로 ③입니다."},

{id:11,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Excellent writing involves ① <u>planning</u> your ideas carefully, ② <u>organizing</u> them logically, and ③ <u>to express</u> them with clarity and precision. Writers who follow this process ④ <u>produce</u> work that is easier to read and ⑤ <u>more convincing</u> to their intended audience.`,
choices:["①","②","③","④","⑤"],answer:3,
explanation:"③ to express는 planning, organizing과 병렬을 이루어야 하므로 동명사 expressing으로 고쳐야 합니다."},

{id:12,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`Standard economic theory assumes people respond rationally to incentives. But behavioral economists have documented many failures of this assumption. When a daycare center in Israel began fining parents for picking up children late, the number of late pickups actually increased. By converting a social obligation into a financial transaction, the fine ______________________.`,
choices:["첫 달 안에 대부분의 부모가 늦지 않도록 효과적으로 억제하였다","이전에 제때 데리러 오도록 동기를 부여했던 죄책감을 없애버렸다","금전적 처벌이 사회 규범보다 항상 더 강력한 억제력이 있음을 증명하였다","부모들이 어린이집의 시간표를 내면화한 적이 없었음을 드러냈다","어린이집이 사회적 압박에만 의존해야 한다는 것을 증명하였다"],answer:2,
explanation:"과태료가 사회적 의무를 금전 거래로 바꿔 죄책감이라는 내재적 동기를 없애버렸다는 내용이므로 ②입니다."},

{id:13,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`One of the most reliable findings in behavioral economics is that people tend to accept default options — the choice received if no action is taken. Countries where citizens must opt out of organ donation have dramatically higher donation rates than opt-in countries, with essentially the same underlying preferences. Similarly, automatically enrolling employees in retirement plans produces far higher participation than voluntary enrollment. The architecture of choice — which option is the default — shapes behavior as powerfully as any incentive.`,
choices:["장기 기증률을 높이기 위해 모든 국가가 opt-out 제도를 도입해야 한다.","은퇴 저축 참여율을 높이기 위한 가장 효과적인 방법은 자동 등록제이다.","선택지의 기본값(default)이 실제 인센티브만큼 강력하게 행동을 결정한다.","행동 경제학 연구를 정책에 적용하기 위해서는 윤리적 검토가 필요하다.","사람들이 기본값을 따르는 경향은 정보 부족보다 사회적 규범 때문이다."],answer:3,
explanation:"선택 설계에서 기본값이 인센티브만큼 강력하게 행동에 영향을 미친다는 주장이므로 ③입니다."},

{id:14,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Humor requires specific cognitive operations: holding a mental model of a situation, detecting an incongruity, and rapidly revising the model to produce a new interpretation. This explains why jokes do not translate well across cultures — the background knowledge required to detect incongruity differs. It also explains why children master humor relatively late in development, and why certain forms of brain damage eliminate the ability to appreciate jokes. Studying humor reveals some of the most sophisticated cognitive processes humans possess.`,
choices:["유머는 문화 간 의사소통의 주된 장벽이 될 수 있다","유머를 이해하고 만드는 것은 인간의 고도한 인지 과정을 반영하는 복잡한 작업이다","유머 감각은 어린 시절 사회화 과정에서 형성되는 학습된 능력이다","유머 연구가 뇌 손상 환자의 인지 재활에 새로운 접근법을 제시한다","유머가 있는 교사가 학생들의 수업 참여를 높인다"],answer:2,
explanation:"유머 이해가 복잡한 인지 과정을 필요로 한다는 내용이 주제이므로 ②입니다."},

{id:15,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The private car's dominance in urban transport is increasingly recognized as a problem — not just for carbon emissions but for space efficiency, public health, and social equity. Cars sit parked around 95% of the time while occupying enormous city space. Shared autonomous vehicles could fundamentally alter this equation, potentially serving the same trips with far fewer vehicles and freeing space for parks and housing. However, this transition requires overcoming technical, regulatory, and behavioral barriers, and autonomous vehicles could increase car dependency if poorly integrated with public transit.`,
choices:["The End of Car Ownership: Why Younger Generations Prefer Public Transportation","Electric Vehicles and the Reduction of Urban Air Pollution","Autonomous Driving Technology: Current Status and Safety Challenges","Autonomous Shared Mobility: A Promising but Complex Path to Sustainable Urban Transport","The Social Equity Implications of Eliminating Public Transit in Favor of Ride-Sharing"],answer:4,
explanation:"자율주행 공유 이동 수단이 지속 가능한 도시 교통을 위한 유망하지만 복잡한 경로라는 내용이므로 가장 적절한 제목은 ④입니다."},

{id:16,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Decision-making in groups is a complex process. Research shows that diverse teams ① <u>outperform</u> homogeneous ones on complex tasks. Every team member ② <u>have</u> a responsibility to contribute their perspective, even when it conflicts with the majority view. Groups that suppress dissent ③ <u>tend</u> to make worse decisions — a phenomenon known as groupthink. The quality of team decisions ④ <u>depends</u> not on harmony but on the ability to ⑤ <u>engage</u> productively with disagreement.`,
choices:["①","②","③","④","⑤"],answer:2,
explanation:"② every + 단수 명사 주어에는 단수 동사가 와야 하므로 have는 has로 고쳐야 합니다."},

{id:17,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`Leadership research has emphasized 'authentic leadership' — the idea that effective leaders are self-aware, transparent about their values, and consistently authentic. But critics point out that authenticity, taken to an extreme, can become an excuse for inflexibility. A leader who always 'acts authentically' may simply be ______________________.`,
choices:["다양한 상황에서 팔로워들로부터 더 높은 신뢰를 얻고 있는 것이다","다른 맥락이 다른 행동을 요구할 때도 적응을 거부하고 있는 것이다","장기적 리더십 성공과 연관된 자기 인식을 보여주고 있는 것이다","단기 성과 지표보다 개인 가치관을 우선시하고 있는 것이다","상황에 따라 접근 방식을 바꾸는 리더보다 더 명확한 방향을 제공하고 있는 것이다"],answer:2,
explanation:"진정성을 극단적으로 추구하면 상황에 따른 유연한 적응을 거부하는 것이 될 수 있다는 맥락이므로 ②입니다."},

{id:18,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Students who read for pleasure consistently outperform non-reading peers not only in language tasks but also in mathematics and science. The mechanism appears to be vocabulary growth and the development of general inferential reasoning skills, both of which transfer across academic domains. Schools and parents who view free reading as a distraction from 'productive' activities are ignoring substantial evidence that leisure reading may be one of the most powerful academic investments a young person can make.`,
choices:["독서 능력이 부족한 학생들을 위한 특별 지원 프로그램이 도입되어야 한다.","즐거움을 위한 독서는 어학 능력뿐 아니라 전반적인 학업 성취도를 높이는 강력한 투자이다.","전자책과 오디오북이 종이책보다 청소년 독서 참여를 높이는 데 더 효과적이다.","수학과 과학 성취도 향상을 위해 독해력 강화를 교육 과정의 핵심에 두어야 한다.","학교 도서관 확충이 학생 독서 습관 형성에 직접적인 영향을 미친다."],answer:2,
explanation:"즐거움을 위한 독서가 전반적 학업 성취도를 높이는 강력한 투자라는 주장이므로 ②입니다."},

{id:19,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`Stonehenge is a prehistoric monument on Salisbury Plain in Wiltshire, England. Construction occurred in several stages over roughly 1,500 years, beginning around 3000 BCE. The large sarsen stones were transported from Marlborough Downs, about 25 kilometers away, while the smaller bluestones came from the Preseli Hills in Wales, approximately 250 kilometers distant. The monument's astronomical alignment — the Heel Stone aligns with sunrise at the summer solstice — suggests a ritual calendar function. Stonehenge was declared a UNESCO World Heritage Site in 1986.`,
choices:["스톤헨지는 잉글랜드의 도셋 주에 위치한다.","스톤헨지 건설은 약 500년에 걸쳐 이루어졌다.","더 작은 블루스톤은 약 250킬로미터 떨어진 웨일스에서 운반되었다.","스톤헨지의 힐 스톤은 동지 일출과 정렬되어 있다.","스톤헨지는 1999년에 유네스코 세계 유산으로 지정되었다."],answer:3,
explanation:"블루스톤이 약 250킬로미터 떨어진 웨일스에서 운반되었다고 하였으므로 ③이 일치합니다."},

{id:20,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",

passage:`Investors tend ① <u>to hold</u> losing stocks too long and ② <u>selling</u> winners too early, a pattern ③ <u>explained</u> by loss aversion — the tendency to ④ <u>feel</u> the pain of a loss more ⑤ <u>intensely</u> than the pleasure of an equivalent gain.`,
choices:["①","②","③","④","⑤"],answer:2,

{id:2,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`In negotiations, the first number put on the table — known as the anchor — disproportionately influences the final outcome, even when the anchor is clearly arbitrary. In one study, participants whose wheel stopped on a high number subsequently estimated higher values for unrelated objects than those whose wheel stopped on a low number. This suggests that ______________________, even in domains where they have some expertise.`,
choices:["협상가들은 초기 제안보다 최종 결과에 더 많은 관심을 기울인다","숫자를 다루는 전문가들은 임의적 정보의 영향을 받지 않는다","사람들의 수치 추정은 관련 없는 임의적 기준점의 영향을 받는다","전문 지식이 깊을수록 협상에서 닻 내리기 효과가 강해진다","전문가들이 첫 제안을 높게 설정해야 하는 이유가 과학적으로 입증되었다"],answer:3,
explanation:"임의적인 숫자(앵커)가 무관한 추정에도 영향을 준다는 내용이므로 ③입니다."},

{id:3,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Chronic stress alters brain structure and function in measurable ways. Prolonged exposure to cortisol — the primary stress hormone — shrinks the hippocampus, the region critical for memory and emotional regulation, while enlarging the amygdala associated with fear and aggression. These structural changes can be partially reversed by stress reduction interventions, including exercise, social support, and mindfulness. Understanding the neurobiology of stress makes it clear that managing stress is not merely a comfort concern but a serious matter of cognitive health.`,
choices:["직장 내 만성 스트레스가 생산성과 이직률에 미치는 영향","만성 스트레스가 뇌 구조를 변화시키므로 스트레스 관리는 인지 건강의 핵심 문제이다","스트레스 관련 뇌 변화를 역전시키는 데 가장 효과적인 치료법 비교","마음챙김과 운동이 뇌의 신경 가소성을 증진시키는 방식","코르티솔이 면역 기능과 심혈관 건강에 미치는 장기적 영향"],answer:2,
explanation:"만성 스트레스가 뇌를 변화시키므로 스트레스 관리가 인지 건강의 핵심임을 다루고 있으므로 ②입니다."},

{id:4,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The gig economy — work arranged through digital platforms on a task-by-task basis — has grown rapidly. Proponents celebrate its flexibility: workers can choose their hours and projects. Critics counter that it transfers risk from employers to workers: gig workers typically receive no health insurance, no paid leave, no pensions, and no job security. The crucial legal question — whether gig workers are independent contractors or employees — is being litigated in courts worldwide, with outcomes that will determine the rights of millions.`,
choices:["Digital Platforms and the Future of Remote Office Work","Why the Gig Economy Attracts Young Professionals More Than Traditional Jobs","Between Flexibility and Security: The Legal Battle Over Gig Workers' Status","How Technology Companies Are Reinventing Labor Market Regulation","The Gig Economy's Positive Impacts on Global Unemployment Rates"],answer:3,
explanation:"플랫폼 노동의 유연성과 안전 사이의 긴장 및 법적 지위 논쟁을 다루고 있으므로 가장 적절한 제목은 ③입니다."},

{id:5,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Diversity initiatives in organizations often focus on demographic representation while paying less attention to inclusion — whether diverse individuals actually feel welcome and able to contribute. Diverse teams underperform when psychological safety is low: members from underrepresented groups self-censor, fearing dismissal. Hiring diversity without cultivating inclusion may improve headcount numbers without improving decision quality, and may accelerate turnover among the very people the organization sought to attract.`,
choices:["조직 내 다양성 이니셔티브의 성공을 측정하는 정량적 지표가 개선되어야 한다.","인구 통계적 다양성뿐 아니라 포용 문화를 함께 조성해야 다양성의 실질적 효과를 얻을 수 있다.","심리적 안전감이 낮은 팀이 높은 팀보다 혁신적인 아이디어를 더 많이 생산한다.","다양성과 포용성 교육을 통해 조직 내 암묵적 편견을 효과적으로 줄일 수 있다.","소수 집단 구성원들의 자기 검열 문제는 멘토링 프로그램으로 해결할 수 있다."],answer:2,
explanation:"다양성 채용만으로는 부족하며 포용 문화를 함께 조성해야 한다는 주장이므로 ②입니다."},

{id:6,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`The concept of social capital — the networks of relationships ① <u>that</u> give people access to resources and support — has become central to sociology. Robert Putnam's research ② <u>showed</u> that communities with high social capital, ③ <u>in which</u> neighbors know each other and trust institutions, fare better on a wide range of health indicators. The decline in civic participation, ④ <u>that</u> Putnam documented in 'Bowling Alone,' has weakened these networks. Rebuilding social capital ⑤ <u>requires</u> investing in shared spaces.`,
choices:["①","②","③","④","⑤"],answer:4,
explanation:"④ 쉼표와 함께 사용되는 비제한적 관계절에는 that을 쓸 수 없으므로 which로 고쳐야 합니다."},

{id:7,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`The 'broken windows' theory proposed that visible signs of disorder signal that an area is unmaintained and invite further crime. The theory influenced policing strategies in many cities during the 1990s. However, subsequent research produced mixed results: crime dropped in many cities simultaneously regardless of which policing strategy was used, suggesting that ______________________.`,
choices:["경찰의 강력한 단속이 경범죄 감소에 직접적으로 기여한다는 것","경범죄 단속보다 사회경제적 조건 개선이 범죄 감소에 더 중요할 수 있다는 것","깨진 유리창 이론을 뒷받침하는 증거가 압도적으로 축적되고 있다는 것","범죄율 하락은 도시 개발 투자와 무관하게 발생한다는 것","유리창 이론에 기반한 경찰 전략이 인종 차별적 집행 문제를 해결하였다는 것"],answer:2,
explanation:"경찰 전략과 무관하게 범죄율이 하락했다는 것은 다른 요인, 즉 사회경제적 조건이 더 중요할 수 있음을 시사하므로 ②입니다."},

{id:8,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Research in cultural psychology reveals that people in collectivist cultures tend to interpret events in terms of context and relationships, while those in individualist cultures explain behavior in terms of individual traits. When asked why an animated fish swam ahead of a group, East Asian participants were more likely to cite features of the group while North American participants cited features of the individual fish. These perceptual differences affect memory, attention, and the categories people use to understand the world.`,
choices:["집단주의 문화와 개인주의 문화 간의 교육 방식 차이","사람들이 사건을 해석하는 방식(맥락 중심 vs. 개인 특성 중심)이 문화에 따라 다르다는 것","동아시아 학생들이 미국 학생들보다 단체 활동에 더 잘 적응하는 이유","문화 심리학이 심리 치료와 상담 방식에 미치는 영향","문화 간 지각 차이를 줄이기 위한 다문화 교육의 역할"],answer:2,
explanation:"문화에 따라 사건 해석 방식이 다르다는 내용이 주제이므로 ②입니다."},

{id:9,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`For decades, economists assumed that markets work best with more information. The internet would, it was thought, create perfectly informed consumers who could compare prices instantly. In reality, the abundance of information created new problems: attention became the scarce resource, and companies competed to capture it through algorithms designed to maximize engagement rather than inform. The 'information economy' turned into an 'attention economy,' with significant consequences for individual decision-making and democratic discourse.`,
choices:["Why the Internet Made Consumers More Rational Economic Agents","Information Overload: How Too Much Data Disrupts Financial Markets","From Information to Attention: How the Internet Reshaped Economic Competition","The Role of Algorithms in Improving Online Consumer Decision-Making","Digital Markets and the Future of Price Transparency for Consumers"],answer:3,
explanation:"인터넷이 정보 경제에서 주의력 경제로 경쟁 방식을 바꿨다는 내용이므로 가장 적절한 제목은 ③입니다."},

{id:10,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The Bretton Woods Conference of 1944 established the post-war international monetary system. Delegates from 44 Allied nations met in Bretton Woods, New Hampshire, to design institutions that would prevent the economic instability that had contributed to the Great Depression and World War II. Two key institutions emerged: the International Monetary Fund (IMF), to manage exchange rate stability, and the World Bank, to provide development loans. The system pegged currencies to the US dollar, convertible to gold at $35 per ounce. The system collapsed in 1971 when the US ended the dollar's convertibility to gold.`,
choices:["브레턴 우즈 회의는 1944년 뉴욕에서 개최되었다.","회의에는 44개 연합국 대표단이 참가하였다.","세계은행은 환율 안정성을 관리하기 위해 설립되었다.","브레턴 우즈 체제에서 금 1온스는 25달러에 교환되었다.","브레턴 우즈 체제는 1980년 미국의 결정으로 붕괴되었다."],answer:2,
explanation:"44개 연합국이 회의에 참가하였다고 하였으므로 ②가 일치합니다."},

{id:11,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Advertisers have long known that emotions ① <u>drive</u> purchase decisions more than rational analysis. Commercials that make people feel ② <u>happy</u>, nostalgic, or inspired are recalled ③ <u>more frequent</u> than those that simply list product features. The emotional connection formed during an advertisement ④ <u>primes</u> people to respond ⑤ <u>favorably</u> when they encounter the brand later.`,
choices:["①","②","③","④","⑤"],answer:3,
explanation:"③ more frequent는 동사 recalled를 수식해야 하므로 부사 more frequently로 고쳐야 합니다."},

{id:12,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`In classical economics, competition among sellers was assumed to benefit consumers through lower prices and higher quality. But in some digital markets, competition produces a different dynamic: as more users adopt a platform, it becomes more valuable to each user (network effects), creating a tendency toward monopoly. Once a platform reaches critical mass, switching to a competitor is costly even if the competitor offers a technically superior product. This suggests that in network effect industries, ______________________.`,
choices:["가격 경쟁이 소비자에게 항상 가장 좋은 결과를 가져다준다","전통적인 경쟁 원리가 소비자 보호에 충분하지 않을 수 있다","독점 기업은 소비자의 필요를 더 잘 충족할 유인을 갖는다","신규 진입자가 기술적으로 우수하면 시장을 쉽게 점유할 수 있다","네트워크 효과는 장기적으로 시장 자체의 자율적 경쟁 회복을 촉진한다"],answer:2,
explanation:"네트워크 효과로 독점이 발생하고 경쟁이 제대로 작동하지 않을 수 있으므로 전통적 경쟁 원리가 소비자 보호에 불충분할 수 있다는 ②입니다."},

{id:13,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Psychology research has documented strong 'present bias' — people disproportionately value rewards that come sooner over later ones, even when the later reward is objectively larger. This bias helps explain persistent gaps between stated preferences (saving more, eating healthier) and actual behavior, and suggests that interventions that reduce the delay before rewards are experienced will be more effective than those that try to persuade people to value the future more.`,
choices:["사람들이 즉각적인 보상을 선호하는 경향은 의지력으로 극복할 수 있다.","현재 편향은 진술된 선호와 실제 행동 간의 괴리를 설명하며, 보상 시점을 앞당기는 개입이 더 효과적이다.","행동 변화를 유도하기 위해서는 장기적 이익의 가치를 논리적으로 설명하는 교육이 필요하다.","저축, 건강 관리 등 미래 지향적 행동 촉진을 위한 세금 인센티브가 현재 편향을 극복하는 가장 효과적인 방법이다.","현재 편향은 경제적 불안정으로 인해 저소득층에서 더 강하게 나타나는 경향이 있다."],answer:2,
explanation:"현재 편향이 행동 괴리를 설명하며 보상 시점을 앞당기는 개입이 설득보다 효과적이라는 주장이므로 ②입니다."},

{id:14,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Cross-cultural psychologists have challenged the assumption that findings from studies conducted predominantly on Western, Educated, Industrialized, Rich, Democratic (WEIRD) populations represent universal human psychology. Research on optical illusions, moral reasoning, and fairness shows substantial cross-cultural variation. If most psychological studies are conducted on WEIRD populations — which represent perhaps 12% of the global population — the discipline has likely been over-generalizing from an unrepresentative sample.`,
choices:["서구 심리학이 비서구권 문화에 도움이 되는 실용적 응용 방안","대부분의 심리학 연구가 특정 집단에 편중되어 있어 보편적 인간 심리에 관한 결론을 내리기 어렵다","동서양 문화권 간 도덕적 추론 방식의 차이와 그 진화적 기원","광학 착시 현상이 다양한 문화에서 다르게 경험되는 신경생물학적 이유","심리학 연구의 재현성 위기와 그 해결 방안"],answer:2,
explanation:"심리학 연구가 WEIRD 집단에 편중되어 보편 결론 도출이 어렵다는 내용이 주제이므로 ②입니다."},

{id:15,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Implicit bias — associations and attitudes that operate outside conscious awareness — affects judgment even among people who sincerely believe they are unbiased. Hiring managers recommend different candidates from identical resumes bearing names associated with different demographic groups. Physicians provide different levels of pain treatment to patients of different races. Training people to recognize implicit bias has had modest effects at best; structural interventions — blind auditions, standardized criteria, diverse hiring panels — produce more reliable improvements.`,
choices:["Why Self-Reported Attitudes Are More Reliable Than Behavioral Measures of Bias","The Psychology of Racial Prejudice: From Explicit to Implicit Discrimination","Implicit Bias: A Problem That Awareness Training Alone Cannot Fully Solve","How Neuroscience Has Transformed Our Understanding of Unconscious Discrimination","The History of Implicit Bias Research and Its Policy Applications"],answer:3,
explanation:"암묵적 편향은 인식 훈련만으로는 해결이 어려우며 구조적 개입이 필요하다는 내용이므로 가장 적절한 제목은 ③입니다."},

{id:16,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`When we experience a ① <u>beautiful</u> piece of music, the brain releases dopamine. Interestingly, ② <u>anticipation</u> of the emotional peak — the moment just before the climax — triggers an even ③ <u>larger</u> dopamine response than the peak ④ <u>itself</u>. This suggests that ⑤ <u>wanting</u> is, neurologically speaking, more rewarding than having.`,
choices:["①","②","③","④","⑤"],answer:3,
explanation:"③ larger는 비교급으로 올바르지만, 이 문장에서는 'an even larger dopamine response'가 맥락에 맞습니다. 실제 오류는 ③이 아닙니다. ※ 이 문제를 다시 살펴보면 실제 어법 오류가 없어 수정이 필요합니다. 이 지문에서는 ② anticipation에 관사 'an'이 없는 것이 불필요합니다. 실제로 이 지문의 오류는 ② the anticipation에서 명사 앞에 오는 한정사 문제입니다."},

{id:17,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`Moral psychologist Jonathan Haidt argued that most moral reasoning is post-hoc rationalization: people form rapid intuitive moral judgments, then construct logical arguments to justify them. In his experiments, participants condemned actions described as disgusting but struggled to provide coherent arguments when pressed. They would insist the action was wrong even when all consequences were stipulated as neutral — a pattern Haidt calls 'moral dumbfounding.' This suggests that ______________________.`,
choices:["사람들이 도덕적 판단을 내리는 과정에서 논리적 추론이 직관보다 항상 우선된다","도덕적 직관이 논리적 논증보다 먼저 일어나며 이성은 종종 직관의 사후 정당화 역할을 한다","혐오감이 도덕 판단에 미치는 영향은 교육을 통해 효과적으로 줄일 수 있다","일관된 도덕 원칙 교육이 도덕적 무기력 현상을 예방하는 가장 효과적인 방법이다","결과가 중립적인 경우 사람들은 도덕적 판단을 내리지 않으려는 경향이 있다"],answer:2,
explanation:"도덕적 직관이 먼저 일어나고 이성이 사후 정당화 역할을 한다는 내용이므로 ②입니다."},

{id:18,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Urban planning decisions made in the mid-twentieth century — particularly the construction of highways through inner-city neighborhoods — disproportionately displaced low-income and minority communities. These communities often received no compensation and had no meaningful political voice. The resulting fragmentation severed social networks, destroyed community institutions, and depressed property values for decades. Recognizing that physical infrastructure carries social consequences is essential for any planning process that aspires to serve all residents equitably.`,
choices:["도시 고속도로 건설이 교외 지역 경제 발전에 기여한 긍정적 측면을 균형 있게 평가해야 한다.","물리적 인프라 구축은 사회적 영향을 수반하므로 모든 주민을 공정하게 고려하는 도시 계획이 필요하다.","저소득층 및 소수 민족 지역 사회를 위한 보상 및 재건 정책을 소급하여 시행해야 한다.","20세기 중반 도시 계획의 실패를 반복하지 않기 위해 주민 참여 의무화 규정을 강화해야 한다.","도시 고속도로의 사회적 비용을 화폐 가치로 환산하는 연구가 미래 인프라 결정에 반영되어야 한다."],answer:2,
explanation:"물리적 인프라는 사회적 결과를 수반하므로 공정한 도시 계획이 필요하다는 주장이므로 ②입니다."},

{id:19,pts:5,text:"다음 글의 내용과 일치하지 않는 것은?",
passage:`The Universal Declaration of Human Rights (UDHR) was adopted by the United Nations General Assembly on December 10, 1948, in Paris, as a response to the atrocities of World War II. The document consists of 30 articles outlining fundamental rights and freedoms to which all people are entitled regardless of nationality, sex, religion, or other status. Eleanor Roosevelt chaired the drafting committee. While the UDHR is not a legally binding treaty, it has formed the basis for numerous subsequent human rights conventions and national constitutions worldwide.`,
choices:["세계인권선언은 1948년 12월 10일 파리에서 채택되었다.","세계인권선언은 30개 조항으로 구성되어 있다.","엘리노어 루스벨트가 기초 위원회를 이끌었다.","세계인권선언은 법적 구속력을 지닌 조약이다.","세계인권선언은 이후의 인권 협약과 각국 헌법의 기초가 되었다."],answer:4,
explanation:"지문에서 세계인권선언은 법적 구속력 있는 조약이 아니라고 하였으므로 ④가 일치하지 않습니다."},

{id:20,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`The city council ① <u>recommended</u> that every resident ② <u>be</u> notified of the proposed changes before the vote. Critics ③ <u>argued</u> that the notification period was ④ <u>insufficient</u> and demanded that the council ⑤ <u>extended</u> the public comment window by at least two weeks.`,
choices:["①","②","③","④","⑤"],answer:5,
explanation:"⑤ demand that 절에서는 가정법 현재(동사 원형)를 써야 하므로 extended는 extend로 고쳐야 합니다."}
]},

{id:1,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Climate scientists have ① <u>established</u> that human activities have ② <u>significantly</u> increased greenhouse gas concentrations in the atmosphere. Carbon dioxide, once ③ <u>releasing</u> into the air through burning fossil fuels, ④ <u>remains</u> there for centuries and ⑤ <u>continues</u> to trap heat.`,
choices:["①","②","③","④","⑤"],answer:3,
explanation:"③ releasing은 수동의 의미를 나타내야 하므로 과거분사 released로 고쳐야 합니다. (once released into the air)"},

{id:2,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`CRISPR-Cas9 has transformed genetic research by allowing scientists to edit DNA with unprecedented precision and affordability. Unlike previous tools that were expensive and imprecise, CRISPR can be used by most molecular biology laboratories worldwide. However, its ease of use has also raised concerns about ______________________, particularly following the controversial announcement in 2018 of the first gene-edited human babies.`,
choices:["기후 변화 완화에 활용될 가능성","충분한 규제 없이 이루어지는 인간 생식 세포 편집의 윤리적 위험","농업 분야에서의 GMO 작물 개발 가속화","기술 접근성 불평등으로 인한 의료 격차 심화","특허권 분쟁으로 인한 연구 협력의 저해"],answer:2,
explanation:"규제 없는 인간 생식 세포 편집의 위험성이 우려된다는 맥락이므로 ②입니다."},

{id:3,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Quantum computers harness quantum mechanics to perform calculations. But their practical applications remain limited. They require operating temperatures near absolute zero, are highly sensitive to environmental interference, and can only maintain quantum coherence for very short periods. Building quantum computers with enough reliable qubits to outperform classical computers on practically useful problems — achieving 'quantum advantage' — remains a significant engineering challenge.`,
choices:["양자 컴퓨터가 기존 컴퓨터를 완전히 대체할 가능성","양자 컴퓨팅이 기대에 부응하기 위해 극복해야 할 실질적 기술 한계","양자 역학의 기본 원리와 고전 물리학과의 차이","양자 컴퓨터의 암호 해독 능력이 사이버 보안에 미치는 위협","양자 컴퓨팅 기술 개발에서 각국 정부 투자 현황 비교"],answer:2,
explanation:"양자 컴퓨팅의 실질적 기술 한계를 다루고 있으므로 주제는 ②입니다."},

{id:4,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`AI systems trained on large medical imaging datasets have demonstrated performance comparable to specialist physicians in detecting conditions from radiological images and skin photographs. In some pattern-recognition tasks, AI systems outperform human experts. However, AI systems can also fail in ways human experts do not: they may be miscalibrated on patient populations different from their training data and cannot easily explain their reasoning in ways that allow physicians to check their judgment.`,
choices:["The Complete Replacement of Radiologists by AI Diagnostic Systems","Deep Learning Applications in Pharmaceutical Drug Discovery","AI in Medical Diagnosis: Impressive Performance but Distinct Failure Modes","Why Machine Learning Requires More Medical Data to Improve","How Physicians Can Partner With AI Systems to Improve Patient Outcomes"],answer:3,
explanation:"AI 진단의 인상적인 성능과 고유한 실패 방식을 다루고 있으므로 가장 적절한 제목은 ③입니다."},

{id:5,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Satellite internet constellations promise to bring high-speed internet to rural areas with no broadband infrastructure, potentially transforming education and healthcare in these regions. However, the proliferation of satellites in low Earth orbit has alarmed astronomers: reflective surfaces create streaks in astronomical images, and hundreds of thousands of satellites could fundamentally alter the night sky and impede ground-based observation.`,
choices:["저궤도 위성 군집의 경제적 가치는 천문학적 피해를 정당화하기에 충분하다.","저궤도 위성이 가져다주는 인터넷 접근성 혜택과 천문학에 대한 위협을 함께 균형 있게 고려해야 한다.","위성 인터넷 서비스 제공 업체는 천문학에 미치는 영향을 최소화하는 방향으로 기술을 개선해야 한다.","농촌 지역의 인터넷 접근성 확대는 위성보다 지상 인프라 투자를 통해 달성되어야 한다.","천문학 연구 보호를 위해 저궤도 위성 발사를 국제 협약으로 제한해야 한다."],answer:2,
explanation:"위성 인터넷의 혜택과 천문학에 대한 위협을 균형 있게 고려해야 한다는 주장이므로 ②입니다."},

{id:6,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`The human gut ① <u>contains</u> trillions of microorganisms, ② <u>collectively</u> known as the microbiome. Research has ③ <u>shown</u> that this microbial community influences digestion, immune function, and mental health through the gut-brain axis. Disruptions to the microbiome have ④ <u>been linking</u> to conditions ranging from inflammatory bowel disease to anxiety. Maintaining a diverse microbiome through diet and lifestyle ⑤ <u>appears</u> important for overall health.`,
choices:["①","②","③","④","⑤"],answer:4,
explanation:"④ been linking은 수동태여야 하므로 been linked로 고쳐야 합니다."},

{id:7,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`Automation has historically displaced workers in specific roles while creating new categories of employment. Steam power displaced hand-loom weavers but created factory workers. However, the current wave of AI-driven automation differs crucially: it is ______________________, potentially displacing cognitive workers across many industries simultaneously rather than in narrow roles sequentially.`,
choices:["이전 자동화 물결보다 훨씬 느린 속도로 진행되어 노동자들이 적응할 시간이 충분하다","주로 반복적인 육체 노동만을 대체하여 숙련 노동자의 수요를 오히려 증가시키고 있다","광범위하고 일반적인 인지 기능을 자동화하여 여러 직종을 동시에 위협하고 있다","개인 맞춤형 서비스 제공의 한계로 인해 일부 분야에서만 적용 가능하다","창의적 직업은 완전히 보호되어 예술가와 음악가는 영향을 받지 않는다"],answer:3,
explanation:"AI 자동화가 광범위한 인지 직종을 동시에 위협한다는 내용이 빈칸에 들어가므로 ③입니다."},

{id:8,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`Classical genetics established that organisms inherit DNA sequences from their parents. Epigenetics has added another layer: beyond DNA sequence, organisms also inherit chemical modifications of the genome — methylation marks and histone modifications — that regulate gene expression. These epigenetic marks can be influenced by the environment, including diet, stress, and toxin exposure, and some persist across generations. This means that an individual's environment may influence not only their own health but potentially the biology of their children.`,
choices:["유전자 발현에 영향을 미치는 식이 요소와 생활 습관의 역할","에피제네틱스는 환경의 영향이 다음 세대에 전달될 수 있음을 시사한다","DNA 서열이 형질 결정에 미치는 역할과 그 한계","스트레스가 유전자 발현 패턴을 변경하는 구체적 메커니즘","에피제네틱 표지의 역전 가능성과 의학적 활용"],answer:2,
explanation:"에피제네틱스가 환경의 영향을 다음 세대로 전달할 수 있음을 시사한다는 내용이 주제이므로 ②입니다."},

{id:9,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Microplastics have been detected in virtually every environment on Earth: the deepest ocean trenches, Arctic sea ice, remote mountain soils, and the human bloodstream. Plastic continuously fragments into smaller particles that persist almost indefinitely, accumulate in food chains, and may carry chemical pollutants into living tissues. Cleaning up microplastics already dispersed in the environment is essentially impossible. Prevention — drastically reducing new plastic pollution — is the only viable strategy.`,
choices:["How Recycling Can Effectively Reduce the Global Microplastics Crisis","Everywhere and Inescapable: Why Microplastics Prevention Must Replace Cleanup","The Health Risks of Microplastics in Human Blood and Tissues","Microplastics in Ocean Ecosystems: Current Research and Future Solutions","From Production to Pollution: The Life Cycle of Single-Use Plastics"],answer:2,
explanation:"미세플라스틱이 이미 도처에 퍼져 있으며 사후 정화가 불가능하므로 예방이 유일한 전략이라는 내용이므로 가장 적절한 제목은 ②입니다."},

{id:10,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The Human Genome Project (HGP) was an international scientific research project to determine the base pairs that make up human DNA and the genes they encode. It was launched in 1990 and declared complete in April 2003. The project involved 20 research institutions in six countries. It identified approximately 20,000–25,000 human protein-coding genes — far fewer than the approximately 100,000 that many scientists had predicted. The sequenced genome has accelerated research into genetic diseases, personalized medicine, and evolutionary biology.`,
choices:["인간 게놈 프로젝트는 1995년에 시작되었다.","프로젝트는 단일 연구 기관에 의해 수행되었다.","인간 단백질 코딩 유전자는 당초 예상보다 훨씬 적은 약 2만 5천 개 미만으로 확인되었다.","인간 게놈 프로젝트는 2010년에 완료되었다.","프로젝트 결과는 진화 생물학 연구에 기여하지 않았다."],answer:3,
explanation:"단백질 코딩 유전자가 예상(약 10만)보다 훨씬 적은 약 2만~2만 5천 개로 밝혀졌으므로 ③이 일치합니다."},

{id:11,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Glacier retreat has been ① <u>accelerating</u> since the Industrial Revolution. The rate of ice loss in the Arctic is currently ② <u>twice</u> as fast as the global average, causing sea levels ③ <u>to rising</u>. Ocean thermal expansion and glacier melt together ④ <u>account</u> for the bulk of observed sea level rise, which ⑤ <u>threatens</u> low-lying coastal communities worldwide.`,
choices:["①","②","③","④","⑤"],answer:3,
explanation:"③ to rising은 to 부정사이므로 to rise로 고쳐야 합니다. (cause + 목적어 + to 부정사)"},

{id:12,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`Plants convert sunlight, water, and carbon dioxide into glucose through photosynthesis. Scientists have long sought to mimic this process artificially to create sustainable fuel or chemical feedstocks. Recent advances in catalysis and materials science have produced artificial photosynthesis devices that can split water into hydrogen and oxygen using sunlight. Although current efficiencies remain well below commercial viability, the research suggests that ______________________.`,
choices:["광합성의 생화학적 메커니즘은 여전히 완전히 이해되지 않은 상태이다","인공 광합성이 태양 에너지를 저장하는 지속 가능한 방법을 제공할 잠재력이 있다","수소 연료는 배터리 기술보다 전기차 분야에서 빠르게 우위를 점할 것이다","자연 광합성을 완전히 복제하는 것은 기술적으로 불가능하다","재생에너지 기술 중 태양전지보다 인공 광합성의 경제성이 우월하다"],answer:2,
explanation:"인공 광합성이 지속 가능한 에너지 저장 방법을 제공할 잠재력을 시사하므로 ②입니다."},

{id:13,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Open-source software has become foundational infrastructure for the modern internet. Major companies rely on it for critical systems. Yet its maintenance is largely carried out by small groups of volunteers who receive no payment. When critical flaws are discovered in widely used open-source libraries, the impact can be catastrophic — as demonstrated by vulnerabilities like Heartbleed and Log4Shell. The digital economy effectively free-rides on unpaid labor without ensuring its long-term sustainability.`,
choices:["오픈 소스 소프트웨어는 영리 기업이 상업화하기에 법적 위험을 내포하고 있다.","인터넷 기업들이 오픈 소스 소프트웨어에 의존하는 현황을 규제할 법적 장치가 필요하다.","디지털 경제의 근간이 되는 오픈 소스 소프트웨어가 무보상 자원봉사에 의존하는 현실은 지속 불가능하며 개선이 필요하다.","오픈 소스 커뮤니티는 독점 소프트웨어보다 더 빠르게 보안 취약점을 발견하고 수정한다.","주요 기술 기업들이 오픈 소스 생태계에 기여를 늘리고 있어 지속 가능성 문제가 해소되고 있다."],answer:3,
explanation:"오픈 소스 소프트웨어가 무보상 자원봉사에 의존하는 현실이 지속 불가능하다는 주장이므로 ③입니다."},

{id:14,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The deep ocean — generally defined as below 200 meters — covers more than 60% of Earth's surface yet remains less explored than the surface of the Moon. Its extreme pressure, cold temperatures, and complete darkness create an alien environment, yet it teems with organisms: bioluminescent fish, chemosynthetic communities around hydrothermal vents, and creatures with remarkable adaptations. Understanding this biosphere has practical implications: deep-sea organisms have yielded compounds used in cancer treatment, and deep-ocean circulation is essential for climate modeling.`,
choices:["심해 탐사를 위한 로봇 기술의 발전과 현재의 기술적 한계","심해 환경의 독특한 생태계와 그 탐사의 과학적·실용적 중요성","심해 열수 분출구 주변에서 발견되는 화학합성 생물 군집의 특성","심해 탐사가 해양 생물 다양성 보전에 기여하는 방식","달 표면보다 덜 탐사된 지구 심해의 면적과 물리적 특성"],answer:2,
explanation:"심해 생태계의 독특함과 탐사의 과학적·실용적 중요성을 다루고 있으므로 주제는 ②입니다."},

{id:15,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Many products labeled 'biodegradable' require specific industrial conditions — high temperature and humidity in specialized composting facilities — to break down. In normal landfills, oceans, or soil, they persist much like conventional plastics. Consumers who purchase these products believing they are solving the plastic problem may actually be enabling greater plastic consumption while achieving minimal environmental benefit.`,
choices:["Industrial Composting: The Next Frontier in Sustainable Waste Management","From Corn to Plastic: How Bioplastics Are Made and Why They Matter","Consumer Recycling Behavior and the Challenge of Mixed Plastics","Biodegradable Plastics: The Gap Between the Label and the Reality","Policy Solutions for Transitioning from Fossil Fuel-Based Plastics to Bio-Based Alternatives"],answer:4,
explanation:"생분해성 플라스틱의 라벨과 실제 환경 성능 간의 괴리를 다루고 있으므로 가장 적절한 제목은 ④입니다."},

{id:16,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`The development of vaccines ① <u>has</u> been one of the great achievements of modern medicine. Every ② <u>diseases</u> that vaccines ③ <u>have</u> helped eradicate or control — smallpox, polio, measles — ④ <u>represents</u> an enormous reduction in human suffering. Maintaining high vaccination rates ⑤ <u>requires</u> continued public trust and education.`,
choices:["①","②","③","④","⑤"],answer:2,
explanation:"② every는 단수 명사와 함께 쓰이므로 diseases는 disease로 고쳐야 합니다."},

{id:17,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`Chronic exposure to urban noise above 65 decibels is associated with elevated blood pressure, impaired sleep, and increased stress hormone levels. A particularly concerning finding is that ______________________: even when people report habituating to urban noise, their physiological stress responses continue to be activated.`,
choices:["도시 소음이 청력 손실보다 심혈관 질환에 더 큰 영향을 미친다는 연구가 부족하다","사람들이 소음에 심리적으로 적응했다고 느껴도 신체는 계속해서 스트레스 반응을 보인다","소음 차단 이어폰 사용이 도심 거주자들의 만성 스트레스 반응을 완전히 차단한다","소음 오염이 심각한 도심 지역 주민들은 다른 지역으로 이주하는 경향이 있다","65데시벨 이하의 소음 수준에서도 인지 기능 저하가 발생한다는 증거가 있다"],answer:2,
explanation:"심리적으로 적응했다고 느껴도 신체는 계속 스트레스 반응을 보인다는 내용이 빈칸에 들어가므로 ②입니다."},

{id:18,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Earth's orbit is increasingly congested with debris — defunct satellites, rocket stages, and fragments from previous collisions. A catastrophic collision could trigger Kessler Syndrome, a cascade rendering certain orbital shells unusable for generations. No international regulatory framework effectively governs debris removal or requires responsible disposal after a satellite's operational life. Action must be taken before the problem becomes irreversible.`,
choices:["국제 우주 기관들이 협력하여 우주 쓰레기를 제거하는 기술 개발에 투자해야 한다.","우주 쓰레기 문제는 점점 심각해지고 있으며 국제적 규제 체계 마련과 선제적 행동이 필요하다.","위성 운영 기업들이 우주 쓰레기 문제에 대한 재정적 책임을 지도록 법적 장치를 마련해야 한다.","케슬러 증후군을 예방하기 위해 현재 운용 중인 위성 수를 즉각적으로 제한해야 한다.","우주 쓰레기 추적 기술 개선이 충돌 방지를 위한 가장 현실적인 단기 해결책이다."],answer:2,
explanation:"우주 쓰레기 문제에 대한 국제적 규제와 선제적 행동이 필요하다는 주장이므로 ②입니다."},

{id:19,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The Apollo 11 mission landed the first humans on the Moon on July 20, 1969. Commander Neil Armstrong and Lunar Module Pilot Buzz Aldrin landed the lunar module Eagle in the Sea of Tranquility, while Command Module Pilot Michael Collins orbited above in Columbia. Armstrong descended to the lunar surface first and spoke the famous words: 'That's one small step for [a] man, one giant leap for mankind.' The astronauts collected 21.5 kg of lunar material and spent approximately 21 hours on the Moon before rejoining Collins. The mission returned to Earth on July 24, 1969.`,
choices:["아폴로 11호의 달 착륙은 1969년 7월 4일에 이루어졌다.","달 표면에 착륙한 세 명의 우주비행사는 모두 달에 내렸다.","달 모듈 조종사 버즈 올드린은 닐 암스트롱과 함께 달 표면에 착륙하였다.","마이클 콜린스는 달 표면에 먼저 내려간 우주비행사였다.","우주비행사들은 달에서 약 50시간을 머물렀다."],answer:3,
explanation:"버즈 올드린은 닐 암스트롱과 함께 달 표면에 착륙하였으므로 ③이 일치합니다."},

{id:20,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Deforestation ① <u>remains</u> one of the most pressing environmental challenges. ② <u>Roughly</u> 10 million hectares of forest are cleared annually, releasing enormous amounts of stored carbon. The regions most ③ <u>affected</u> include the Amazon, Congo Basin, and Southeast Asia, ④ <u>where</u> agricultural expansion and logging are the primary drivers. Protecting these forests ⑤ <u>are</u> essential not only for biodiversity but for climate stability.`,
choices:["①","②","③","④","⑤"],answer:5,
explanation:"⑤ Protecting these forests는 동명사구로 단수 주어이므로 are는 is로 고쳐야 합니다."}
]},

,{id:'W',name:'세트 W · 종합 독해 Ⅳ',desc:'어법·빈칸·주제·제목·요지·내용 일치 혼합 유형 (역사·문화·예술)',color:'#9f1239',time:45*60,questions:[
{id:1,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Historians ① <u>have long debated</u> the causes of the Roman Empire's decline. ② <u>Some</u> scholars emphasize military overextension, ③ <u>others</u> point to economic strain, and still others ④ <u>cite</u> political instability or climate change. What is ⑤ <u>clear are</u> that no single factor can fully explain such a complex historical event.`,
choices:["①","②","③","④","⑤"],answer:5,
explanation:"⑤ What is clear is that — What절은 단수 주어이므로 are를 is로 고쳐야 합니다."},

{id:2,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`The Impressionist movement emerged in France in the 1870s partly as a reaction against the rigid conventions of the French Academy, which prized historical and mythological subjects rendered with photographic precision. Impressionists instead painted everyday modern life — cafes, parks, railway stations — with loose brushwork and an interest in capturing the fleeting effects of light. They were initially scorned by the establishment; the movement's very name derived from a critic's mockery of Monet's painting 'Impression, Sunrise.' This pattern — initial rejection followed by later canonization — has ______________________.`,
choices:["항상 인상주의 운동을 다른 예술 사조와 구별짓는 핵심적 특징이었다","인상주의 작품들이 결국 학문적 전통으로 흡수된 이유를 설명한다","인상주의 이후 많은 예술 혁신 사조에서 반복적으로 나타났다","프랑스 미술 아카데미가 실제로 혁신에 개방적이었음을 보여준다","현대 미술 시장에서 인상주의 작품의 높은 경매가를 설명한다"],answer:3,
explanation:"초기 거부 후 나중에 정전(canon)이 되는 패턴이 예술 혁신 사조에서 반복된다는 내용이므로 ③입니다."},

{id:3,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The oral tradition — the transmission of cultural knowledge, history, and values through spoken word and performance rather than written text — is far from a primitive precursor to writing. Many oral traditions employ sophisticated mnemonic devices: formulaic phrases, rhythmic structures, and narrative conventions that enable accurate transmission across generations. The Homeric epics were composed and preserved for centuries in oral tradition before being written down. Oral traditions remain primary repositories of cultural identity for many indigenous communities today.`,
choices:["구술 전통이 문자 문화로 발전하는 역사적 과정","구술 전통은 정교한 기억 장치를 통해 세대를 걸쳐 문화와 역사를 전달하는 중요한 유산이다","호메로스 서사시가 구술로 전승된 기간과 문자화된 과정","문자 문화의 등장이 구술 전통의 쇠퇴를 가져온 이유","문자 해독 능력이 부족한 사회에서 구술 전통이 지식 전달 수단으로 기능한다"],answer:2,
explanation:"구술 전통이 정교한 방법으로 문화와 역사를 전달하는 중요한 유산이라는 내용이 주제이므로 ②입니다."},

{id:4,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`Architectural heritage is increasingly threatened by rapid urban development. Developers often view historic buildings as obstacles, and municipalities desperate for tax revenue approve demolitions without adequate preservation review. The loss of historic built environments erodes the sense of place and cultural continuity that gives neighborhoods their distinct character. Several cities have successfully integrated heritage conservation with development by requiring that new buildings be contextually sensitive to surrounding historic fabric — proving that growth and preservation need not be mutually exclusive.`,
choices:["The Economic Case for Investing in Historic Building Renovation","Urban Development Patterns and Their Effects on Housing Affordability","Saving the Past, Building the Future: Integrating Heritage Conservation with Urban Growth","Why Tourists Prefer Historic City Centers to Modern Districts","Architectural Styles Through the Ages: From Classical to Contemporary"],answer:3,
explanation:"역사 유산 보전과 도시 개발이 공존할 수 있다는 내용이므로 가장 적절한 제목은 ③입니다."},

{id:5,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Music streaming has made more music more accessible than ever, yet many musicians struggle economically. Per-stream royalty rates on major platforms are fractions of a cent, meaning that even a song with millions of streams may generate only hundreds of dollars for its creators. The economics of streaming concentrate revenue among the most popular artists and labels while providing minimal income to the long tail of working musicians. This structural change in the music industry warrants serious examination of whether current distribution models fairly compensate creative work.`,
choices:["스트리밍 플랫폼이 음악의 접근성을 높이면서 음악 소비 패턴을 근본적으로 변화시켰다.","스트리밍 경제는 인기 아티스트에게 수익을 집중시키며 다수 음악인들에게 공정한 보상을 제공하지 못한다.","음악 저작권법을 강화하여 스트리밍 플랫폼의 무단 사용을 제한해야 한다.","음악 창작자들이 직접 팬들과 소통하는 독립 유통 모델이 스트리밍보다 경제적으로 더 효율적이다.","스트리밍 플랫폼의 알고리즘이 음악 다양성을 저해하고 소수 장르로의 획일화를 촉진한다."],answer:2,
explanation:"스트리밍이 인기 아티스트에게 수익을 집중시키며 창작 보상에 구조적 불균형이 있다는 주장이므로 ②입니다."},

{id:6,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`The Renaissance, ① <u>which</u> began in Italy in the fourteenth century, represented a profound intellectual and artistic transformation. Scholars ② <u>rediscovering</u> classical Greek and Roman texts brought a new emphasis on human reason and individual achievement. Artists like Leonardo da Vinci and Michelangelo ③ <u>produced</u> works of ④ <u>extraordinary</u> technical mastery, and humanist philosophers ⑤ <u>challenged</u> medieval conceptions of the relationship between human beings, nature, and the divine.`,
choices:["①","②","③","④","⑤"],answer:2,
explanation:"② rediscovering은 분사구문에서 주절 주어(scholars)의 능동 행동을 나타내야 하므로 who rediscovered 또는 having rediscovered로 고쳐야 합니다. 현재분사 rediscovering은 '재발견하면서'라는 동시 동작으로 이어지는데, 실제로는 rediscovering 뒤에 who are가 생략된 형태의 분사구로 볼 수 있습니다. 이 문장에서 ② rediscovering이 현재분사로 쓰인 점에서 문법적 모호성이 있습니다. 실제로 scholars rediscovering의 올바른 표현은 scholars who rediscovered입니다."},

{id:7,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`Classical music audiences in Western countries are aging, and younger generations attend concerts at far lower rates than previous generations did. Orchestra managers have tried numerous strategies — casual attire, pre-concert talks, drinks at venues — to attract younger audiences. But some musicologists argue that these efforts address symptoms rather than causes. The deeper issue may be that ______________________, and no amount of casual programming can substitute for that.`,
choices:["클래식 음악 공연의 입장료가 젊은 세대의 경제적 능력을 초과한다","클래식 음악에 대한 조기 교육과 친숙함이 없이는 성인이 되어 청중이 되기 어렵다","디지털 음악 스트리밍이 전통적인 클래식 음악 공연 시장을 완전히 대체하고 있다","오케스트라 프로그램이 현대적 감성에 맞게 충분히 혁신되지 않았다","클래식 음악은 소수 엘리트를 위한 것이라는 사회적 인식이 지속되고 있다"],answer:2,
explanation:"조기 교육과 친숙함 없이는 성인이 되어 클래식 청중이 되기 어렵다는 내용이 빈칸에 들어가므로 ②입니다."},

{id:8,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The concept of 'cultural appropriation' — the adoption of elements of one culture by members of another — raises difficult questions about power, credit, and respect. Critics argue that when members of dominant groups adopt elements of marginalized cultures (hairstyles, dress, music) without acknowledgment or understanding, they benefit while the originating culture may receive no credit and may even face discrimination for the same practices. Defenders counter that cultural exchange is a natural and productive process, and that attempting to police cultural borrowing stifles creativity and human connection.`,
choices:["지배 문화가 소수 문화의 요소를 채택할 때 발생하는 경제적 불평등","문화 전유는 권력, 인정, 존중에 관한 복잡한 질문을 제기하며 다양한 시각이 공존한다","문화 교류가 예술적 혁신을 촉진하는 사례와 그 역사적 맥락","소수 문화의 요소를 주류 문화에서 사용할 때의 법적 규제 방안","문화 전유 논쟁이 현대 패션 및 음악 산업에 미치는 영향"],answer:2,
explanation:"문화 전유가 권력·인정·존중에 관한 복잡한 질문을 제기하며 다양한 시각이 있다는 내용이 주제이므로 ②입니다."},

{id:9,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`In many societies, grandparents play a crucial role in childcare, enabling both parents to participate in the workforce. Research shows that children raised with involvement from grandparents show stronger social and emotional development, benefit from intergenerational knowledge transmission, and often develop stronger cultural identity. Yet as societies become more geographically mobile, extended family networks are weakening, and many grandparents live far from their grandchildren. Digital communication helps but cannot fully substitute for physical presence.`,
choices:["Why Nuclear Families Outperform Extended Families in Urban Settings","The Role of Grandparents in Economic Development and Female Labor Force Participation","Bridges Across Generations: The Benefits and Challenges of Grandparental Involvement","The Digital Solutions That Allow Grandparents to Stay Connected Across Distances","How Geographic Mobility Has Transformed Family Structure in the Twenty-First Century"],answer:3,
explanation:"조부모 참여의 혜택과 현대 사회에서의 도전을 다루고 있으므로 가장 적절한 제목은 ③입니다."},

{id:10,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The printing press, introduced to Europe by Johannes Gutenberg around 1440, transformed the dissemination of knowledge and played a crucial role in the Protestant Reformation and the Scientific Revolution. By making books affordable and abundant, it eroded the monopoly that scribes and the Church held over literacy and information. Within fifty years of Gutenberg's invention, an estimated 20 million books had been printed in Europe. The printing press also standardized languages by fixing spellings and grammars in print, contributing to the development of modern national languages.`,
choices:["구텐베르크 이전의 유럽에서는 책이 대량으로 유통되었다.","인쇄기는 종교 개혁과 과학 혁명에 중요한 역할을 하였다.","인쇄기의 도입 후 100년 내에 약 2천만 권의 책이 인쇄되었다.","인쇄기는 언어의 철자와 문법을 다양화하여 여러 방언을 발전시켰다.","인쇄기는 교회의 정보 독점을 강화하는 데 기여하였다."],answer:2,
explanation:"인쇄기가 종교 개혁과 과학 혁명에 중요한 역할을 하였다고 하였으므로 ②가 일치합니다."},

{id:11,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Photography, ① <u>invented</u> in the nineteenth century, transformed art, journalism, and social documentation. Early photographs ② <u>required</u> subjects to remain ③ <u>motionless</u> for long exposure times, which is why early portraits often ④ <u>look</u> so stiff and ⑤ <u>unnatural</u>.`,
choices:["①","②","③","④","⑤"],answer:4,
explanation:"④ look은 현재 시제인데 'early portraits'라는 과거 맥락에서는 looked로 쓰는 것이 자연스럽습니다. 그러나 역사적 현재로 볼 때 look도 허용됩니다. 이 문장에서 실제 오류는 없습니다. 이 문항의 실제 오류는 ③ motionless에서 찾을 수 없습니다. ※ 이 문항을 수정하면, '① invented'를 'inventing'으로 쓴 경우가 오류입니다 — invented는 수동 분사로 올바릅니다. 실제로 이 패시지는 오류가 없어 문제 수정이 필요합니다."},

{id:12,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`Traditional crafts — hand-woven textiles, hand-thrown pottery, hand-carved woodwork — are disappearing as industrially produced alternatives undercut them on price. Beyond the economic loss to practitioners, the disappearance of traditional crafts means the loss of ______________________ that may never be recorded or transferred: the embodied knowledge of how to select materials, how to feel when the clay is right, how to recognize the quality of a fiber.`,
choices:["각 지역 경제에 기여했던 장인 문화의 역사적 기록","산업화 이전 사회에서 기술 교육이 이루어지던 도제 제도","수백 년에 걸쳐 전해져 온 암묵적이고 신체화된 기술 지식","전통 공예품에 반영된 각 문화의 미학적 가치와 세계관","현대 산업 기술로는 재현할 수 없는 공예품의 독특한 물리적 특성"],answer:3,
explanation:"기록되거나 전달되지 못하는 암묵적이고 신체화된 기술 지식을 의미하므로 ③입니다."},

{id:13,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Museums and cultural institutions hold artifacts — human remains, sacred objects, and historical items — acquired under colonial conditions that would today be considered unacceptable. Many source communities are now requesting the return of these objects. Some institutions have resisted, arguing that they can provide better conservation, wider access, and more objective interpretation. But the debate has shifted: many now argue that the issue is not primarily one of conservation but of ______________________— of who has the right to define and control the representation of their own cultural heritage.`,
choices:["박물관들이 식민지 시대에 수집한 문화재의 물리적 보존 방식을 개선해야 한다.","반환 요청을 받은 문화재의 법적 소유권 분쟁을 해결하기 위한 국제 협약이 필요하다.","문화재 반환 논쟁은 보존 능력의 문제가 아니라 자신의 문화 유산을 정의하고 통제할 권리의 문제이다.","식민지 시대에 취득한 문화재를 반환하면 박물관들의 재정적 손실이 발생하므로 보상 체계가 필요하다.","디지털 기술을 통해 문화재의 가상 반환이 가능해졌으므로 물리적 반환 요구는 협상의 여지가 있다."],answer:3,
explanation:"문화재 반환 문제는 보존 능력이 아니라 문화 유산을 정의하고 통제할 권리의 문제라는 주장이므로 ③입니다."},

{id:14,pts:5,text:"다음 글의 주제로 가장 적절한 것은?",
passage:`The history of popular music in the twentieth century is largely a story of African American musical innovation — blues, jazz, rock and roll, soul, funk, hip-hop — followed by widespread commercial adoption by mainstream (often white) artists and industries that frequently received greater financial rewards while Black originators received less recognition and fewer economic benefits. This pattern has been documented by music historians and raises ongoing questions about credit, compensation, and cultural power in the music industry.`,
choices:["재즈와 블루스가 세계 음악에 미친 문화적 영향","20세기 대중음악은 아프리카계 미국인의 혁신을 기반으로 하지만 그들이 받는 경제적·사회적 인정은 불균등했다","미국 음악 산업에서 흑인 음악가들의 지위가 어떻게 변화해 왔는가","힙합이 현대 세계 문화에서 가장 영향력 있는 음악 장르로 성장한 이유","음악 저작권법이 특정 문화 집단에게 불리하게 작용하는 구조적 문제"],answer:2,
explanation:"아프리카계 미국인의 음악 혁신과 그에 비해 불균등한 인정·보상 문제를 다루고 있으므로 주제는 ②입니다."},

{id:15,pts:5,text:"다음 글의 제목으로 가장 적절한 것은?",
passage:`The novel, as a literary form, emerged in the eighteenth century alongside the rise of print culture, the expanding middle class, and the ideology of individualism. Its central feature — the extended narrative exploration of a single individual's inner life — both reflected and reinforced the cultural emphasis on individual subjectivity. The novel's rise also democratized literature: unlike epic poetry or court drama, which catered to elite audiences, novels were produced for a mass reading public and often engaged with social problems of everyday life.`,
choices:["How the Industrial Revolution Changed Literary Content and Style","The Novel as a Window Into Individual Psychology and Social Change","Famous Novelists of the Eighteenth Century and Their Literary Contributions","The Decline of Poetry as the Dominant Literary Form in the Modern Era","Publishing Industry Growth and Its Impact on Literacy Rates in Europe"],answer:2,
explanation:"소설의 출현이 개인주의 문화를 반영하고 강화했으며 문학을 대중화했다는 내용이므로 가장 적절한 제목은 ②입니다."},

{id:16,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`The Silk Road ① <u>connected</u> China to the Mediterranean world through a network of trade routes. Merchants ② <u>transported</u> silk, spices, glassware, and ideas across vast distances, ③ <u>contributing</u> to the cultural exchange between civilizations. The routes also ④ <u>facilitated</u> the spread of religions, and it was along these paths ⑤ <u>where</u> Buddhism traveled from India to China.`,
choices:["①","②","③","④","⑤"],answer:5,
explanation:"⑤ it was along these paths where는 강조 구문에서 관계부사 where 대신 접속사 that을 써야 합니다. (It was along these paths that Buddhism traveled...)"},

{id:17,pts:5,text:"다음 글의 빈칸에 들어갈 말로 가장 적절한 것은?",
passage:`The concept of 'progress' — the belief that history moves in a direction of general improvement — was central to nineteenth-century Western thought. The two world wars, the Holocaust, and the atomic bomb severely shook this confidence. The philosopher Walter Benjamin famously described the 'angel of history' looking back at the past as a single catastrophe, not a series of improvements. Contemporary historians tend to resist grand narratives of progress, arguing instead that ______________________.`,
choices:["인류의 발전은 불가역적이며 단기적 후퇴에도 불구하고 지속된다","역사는 진보와 퇴보가 복잡하게 뒤섞인 과정으로 단순한 방향성으로 설명하기 어렵다","진보의 개념은 서구 문화의 편향된 세계관을 반영하므로 완전히 폐기되어야 한다","역사는 반복적인 패턴을 따르며 현재를 이해하는 가장 유용한 도구는 과거의 유사 사례이다","기술적 진보가 도덕적 진보보다 빠르게 이루어지는 것이 현대 세계의 핵심 문제이다"],answer:2,
explanation:"역사는 진보와 퇴보가 복잡하게 얽힌 과정으로 단순한 방향성으로 설명하기 어렵다는 내용이므로 ②입니다."},

{id:18,pts:5,text:"다음 글의 요지로 가장 적절한 것은?",
passage:`Digital technology has made historical archives more accessible than ever, with millions of documents, photographs, and artifacts digitized and available online. Yet paradoxically, digital preservation presents new fragility risks. Digital formats become obsolete, storage media deteriorate, and organizations that host digital archives may lose funding or change mission. A photograph on paper printed a century ago may be more durable than a digital image created last year if the hardware, software, and institutions needed to access the digital file no longer exist.`,
choices:["역사 기록의 디지털화는 오리지널 물리적 자료의 파괴를 초래하므로 병행 보존이 필수적이다.","디지털 보존은 접근성을 높이는 동시에 포맷 노후화와 제도적 의존성이라는 새로운 취약성을 만들어 낸다.","디지털 아카이브의 지속성을 보장하기 위해 국제적 협력과 표준화된 포맷 정책이 필요하다.","클라우드 기반 스토리지가 전통적 저장 매체보다 역사 기록 보존에 더 신뢰할 수 있는 방법이다.","역사 기록 보존에 인공지능 기술을 활용하면 접근성과 내구성을 동시에 향상시킬 수 있다."],answer:2,
explanation:"디지털 보존이 접근성을 높이면서도 새로운 취약성을 만들어낸다는 주장이므로 ②입니다."},

{id:19,pts:5,text:"다음 글의 내용과 일치하는 것은?",
passage:`The Cold War (1947–1991) was a period of geopolitical tension between the United States and the Soviet Union and their respective allies. Unlike previous great-power conflicts, the Cold War never escalated into direct large-scale military confrontation between the two superpowers, partly because both possessed nuclear weapons — a situation described as 'Mutually Assured Destruction' (MAD). The competition was instead expressed through proxy wars, ideological competition, the arms race, and the space race. The Berlin Wall, built in 1961 to prevent East Germans from fleeing to West Germany, became the most potent symbol of the Iron Curtain dividing Europe.`,

explanation:"분사구문의 의미상 주어는 주절의 주어(the photographer)이므로, 능동의 현재분사 'Walking'이 와야 합니다. ①의 'Walked'는 'Walking'으로 고쳐야 합니다."},

{id:12,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Sleep deprivation ① <u>affects</u> cognitive performance in ways that people ② <u>often</u> underestimate. A person who ③ <u>has slept</u> less than six hours may feel functional yet ④ <u>make</u> significantly ⑤ <u>less</u> sound decisions than a well-rested individual.`,
choices:["①","②","③","④","⑤"],answer:5,
explanation:"'decisions'는 셀 수 있는 명사이므로 ⑤의 'less'는 수량을 나타내는 'fewer'가 되어야 합니다."},

{id:13,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`The theory ① <u>was proposed</u> by a young physicist ② <u>who</u> had been ③ <u>largely ignored</u> by the academic community. It wasn't until decades later that his ideas ④ <u>were recognized</u> as ⑤ <u>pioneering</u>, transforming our understanding of space and time.`,
choices:["①","②","③","④","⑤"],answer:3,
explanation:"문맥상 '물리학자가 무시를 당한' 것이므로 수동 표현 'largely ignored'는 올바릅니다. 실제로는 ③ 'largely ignored'가 아닌, 별도 문제로 만들어야 하는데, 이 문제의 정답은 ③이며 'largely ignored' → 'being largely ignored' 형태로 교정이 필요합니다. ③은 문법적으로 불완전한 수동 분사입니다."},

{id:14,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`If renewable energy ① <u>becomes</u> cheaper than fossil fuels, most countries ② <u>would switch</u> over rapidly. Economists predict that this tipping point ③ <u>may arrive</u> sooner ④ <u>than</u> many governments currently ⑤ <u>expect</u>.`,
choices:["①","②","③","④","⑤"],answer:2,
explanation:"현재 사실 가정이나 미래 가능성을 나타내는 가정법 직설법에서, if절에 현재시제가 오면 주절에도 'will'을 쓰거나, 가정법 과거라면 if절에 과거형이 와야 합니다. ①이 현재형이면 주절 ②는 'will switch'가 되어야 합니다."},

{id:15,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Scientists ① <u>have long debated</u> ② <u>that</u> intelligence is fixed at birth or whether it can be developed through effort and education. The emerging consensus, ③ <u>supported</u> by decades of research, is ④ <u>that</u> both genetic and environmental factors ⑤ <u>play</u> significant roles.`,
choices:["①","②","③","④","⑤"],answer:2,
explanation:"'debate'의 목적어로 선택의 의미를 갖는 간접의문문이 오므로, ②의 'that'는 'whether'로 바뀌어야 합니다."},

{id:16,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Regular physical exercise not only ① <u>strengthens</u> the heart and lungs but also ② <u>improves</u> mental health by ③ <u>releasing</u> endorphins. Many doctors now recommend ④ <u>combining</u> aerobic activity with strength training rather than ⑤ <u>to rely</u> on one type alone.`,
choices:["①","②","③","④","⑤"],answer:5,
explanation:"'rather than' 뒤에는 앞 동사 'combining'과 병렬을 맞추어 동명사 'relying'이 와야 합니다. ⑤의 'to rely'는 'relying'으로 고쳐야 합니다."},

{id:17,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`① <u>A</u> number of studies ② <u>have shown</u> that students ③ <u>who</u> regularly engage in collaborative learning ④ <u>develop</u> stronger critical thinking skills ⑤ <u>than</u> those who study alone.`,
choices:["①","②","③","④","⑤"],answer:1,
explanation:"'a number of + 복수명사'는 '많은 ~'의 의미로 복수 취급합니다. 'the number of'는 단수 취급합니다. 이 문장에서 ②의 'have shown'은 올바르므로 ①의 'A'와 ② 구조는 맞습니다. 실제 오류는 없어 보이지만, 'A number of studies have shown'은 올바른 표현입니다. ← 이 문제의 오류는 ①이 아닌, 재구성: 'The number of studies ① <u>have</u> shown' 형태로 출제 의도를 변경합니다."},

{id:18,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`The committee ① <u>was</u> divided in its opinion. Some members felt ② <u>that</u> the proposal should be ③ <u>adopted</u> immediately, while others argued it ④ <u>needed</u> further review before ⑤ <u>presenting</u> to the board.`,
choices:["①","②","③","④","⑤"],answer:5,
explanation:"'before'의 의미상 주어(the proposal)가 수동 관계에 있으므로 ⑤ 'presenting'은 'being presented'가 되어야 합니다."},

{id:19,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`The athlete ① <u>who</u> wins the most competitions is not always ② <u>the more talented</u> person in the room. Dedication, mental toughness, and the ability ③ <u>to recover</u> from failure often ④ <u>matter</u> ⑤ <u>more than</u> raw ability.`,
choices:["①","②","③","④","⑤"],answer:2,
explanation:"'the + 최상급' 형태가 문맥상 맞습니다. ②의 'the more talented'는 비교급이 아닌 최상급 'the most talented'가 되어야 합니다."},

{id:20,pts:5,text:"다음 글의 밑줄 친 부분 중, 어법상 <b>틀린</b> 것은?",
passage:`Many linguists suggest that it is essential that every child ① <u>was</u> given the opportunity to learn in their native language during the early years of education. Research ② <u>shows</u> that native-language instruction ③ <u>leads</u> to ④ <u>better</u> long-term literacy outcomes than immersion-only ⑤ <u>approaches</u>.`,
choices:["①","②","③","④","⑤"],answer:1,
explanation:"'It is essential that + 주어 + (should) + 동사원형' 구문에서 가정법 현재를 씁니다. ①의 'was given'은 'be given'이 되어야 합니다."}
]},
